<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ferents Team">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ferents Team Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/karate-192.png">
  <link rel="apple-touch-icon" href="icons/karate-apple-180.png">

  <style>
    :root {
      --bg: #f3f4f6; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --border: #d1d5db;
      --card: #ffffff; --head: #111827; --primary: #111827; --on-primary: #ffffff; --link: #1d4ed8;
      --gold: #d1a84b;
      --gold-soft: color-mix(in srgb, var(--gold) 20%, var(--card));
      --gold-ink: color-mix(in srgb, var(--gold) 60%, #000);
      --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0b0f17; --ink: #e5e7eb; --muted: #9ca3af; --line: #1f2937; --border: #374151;
      --card: #151b26; --head: #05080d; --primary: #e5e7eb; --on-primary: #111827; --link: #93c5fd;
      --gold-ink: color-mix(in srgb, var(--gold) 70%, #fff);
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1515;
      color-scheme: dark;
    }
    @font-face {
      font-family: 'Manrope'; src: url('fonts/manrope.woff') format('woff');
      font-weight: 200 800; font-style: normal; font-display: swap;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }

    /* Шапка */
    header {
      background: var(--head); color: #fff;
      padding: 22px 16px 18px;
      padding-top: max(22px, env(safe-area-inset-top));
      border-bottom: 4px solid var(--gold);
    }
    .hwrap { max-width: 640px; margin: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .brand { color: #d1d5db; font-size: 12px; letter-spacing: .15em; margin: 0; }
    header h1 { margin: 6px 0 2px; font-size: 28px; }
    .motto { color: #9ca3af; margin: 0; font-size: 13px; }
    .ghost {
      background: transparent; border: 1px solid #374151; color: #d1d5db;
      border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
    }

    main { padding: 16px; max-width: 640px; margin: auto; }
    footer { text-align: center; color: var(--muted); padding: 25px; font-size: 12px; }

    /* Загальні елементи */
    h2 { margin: 4px 0; font-size: 22px; }
    h3 { margin: 24px 0 8px; font-size: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .err { color: var(--bad); }

    .topbar { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; min-height: 40px; }
    .topbar h2 { flex: 1; }
    .back { color: var(--ink); text-decoration: none; font-size: 15px; padding: 8px 10px 8px 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 0; border-radius: 12px; padding: 11px 16px;
      background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; font-size: 15px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .5; }
    .btn.light { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .btn.danger { background: var(--bad-bg); color: var(--bad); }
    .btn.wide { width: 100%; margin-top: 12px; }
    .btn.sq { width: 46px; padding: 11px 0; font-size: 20px; line-height: 1; }

    input, select, textarea {
      width: 100%; font: inherit; font-size: 16px; color: var(--ink);
      padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); border-color: transparent; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 0; }
    label > input, label > select, label > textarea { margin-top: 5px; }
    label.check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); }
    label.check input { width: 22px; height: 22px; margin: 0; }

    .search { margin-bottom: 10px; }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .picker {
      position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
      font-size: 16px; font-weight: 600; color: var(--ink);
    }
    label.picker { cursor: pointer; }
    .picker input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .picker input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; cursor: pointer; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .chip {
      flex: none; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
      background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
    }
    .chip.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }

    /* Головний екран */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; }
    .stat { background: var(--card); border-radius: 14px; padding: 14px 12px; box-shadow: 0 2px 8px #0000000d; }
    .stat b { display: block; font-size: 26px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat.warn b { color: var(--bad); }
    .bday { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 12px; font-size: 14px; line-height: 1.6; box-shadow: 0 2px 8px #0000000d; }
    .bday strong { display: block; font-size: 13px; letter-spacing: .05em; color: var(--gold-ink); margin-bottom: 2px; }
    .bday-today { background: var(--gold-soft); border-radius: 10px; padding: 8px 10px; margin: 4px 0; }
    .today { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
    .today strong { display: block; font-size: 13px; letter-spacing: .05em; color: var(--gold-ink); margin-bottom: 2px; }

    .card {
      display: block; width: 100%; text-align: left; text-decoration: none;
      border: 0; border-radius: 14px; background: var(--card); padding: 18px 20px; margin: 12px 0;
      color: var(--ink); font: inherit; box-shadow: 0 2px 8px #0000000d; cursor: pointer;
    }
    .card strong { display: block; font-size: 18px; }
    .card span { display: block; color: var(--muted); margin-top: 6px; font-size: 14px; }
    .card:active, .row:active { background: var(--line); }

    /* Списки */
    .list { background: var(--card); border-radius: 14px; box-shadow: 0 2px 8px #0000000d; overflow: hidden; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; border: 0; background: var(--card); color: var(--ink);
      font: inherit; padding: 13px 16px; margin: 0; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .row:last-child { border-bottom: 0; }
    .row strong { display: block; font-size: 16px; font-weight: 600; }
    .row span span, .row div span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .row.dim strong { color: var(--muted); }
    .row.tick input { width: 26px; height: 26px; flex: none; accent-color: var(--ok); }
    .chev { color: var(--muted); font-size: 22px; }
    .row.plan { align-items: flex-start; }
    .tasks { white-space: pre-line; font-size: 14px; color: var(--ink); margin-top: 8px; line-height: 1.5; }
    .row input.kg { width: 92px; flex: none; text-align: center; }
    .day-title { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 6px; }
    .empty { padding: 18px 16px; color: var(--muted); }

    .badge { flex: none; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.gold { background: var(--gold-soft); color: var(--gold-ink); }

    .summary { font-size: 15px; margin: 6px 2px 10px; }
    .summary b { font-size: 18px; }

    a.link { color: var(--link); word-break: break-all; }

    /* Вхід */
    .login { background: var(--card); border-radius: 16px; padding: 22px 20px; box-shadow: 0 2px 8px #0000000d; margin-top: 10px; }
    .login .btn { width: 100%; margin-top: 18px; }

    /* Діалог */
    dialog {
      border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100% - 24px));
      max-height: calc(100% - 40px); box-shadow: 0 20px 50px #0004; background: var(--card); color: var(--ink);
    }
    dialog::backdrop { background: #1118277a; }
    dialog form { padding: 20px; }
    dialog h3 { margin: 0 0 4px; font-size: 19px; }
    .dlg-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .dlg-actions .spacer { flex: 1; }
    .dlg-extra { margin-top: 12px; font-size: 14px; }

    /* Меню ☰ */
    .menu-btn {
      width: 44px; height: 44px; flex: none; border: 1px solid #374151; border-radius: 12px; background: transparent;
      display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center; cursor: pointer;
    }
    .menu-btn span { width: 20px; height: 2px; border-radius: 2px; background: #e5e7eb; }
    dialog#menu {
      margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(320px, 86%);
      border-radius: 18px 0 0 18px; padding: 0; display: none; flex-direction: column;
    }
    dialog#menu[open] { display: flex; }
    .menu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      padding: max(20px, env(safe-area-inset-top)) 18px 16px; background: var(--head); color: #fff; border-bottom: 4px solid var(--gold); }
    .menu-head span { display: block; color: #9ca3af; font-size: 13px; margin-top: 3px; }
    .menu-close { background: transparent; border: 0; color: #d1d5db; cursor: pointer; padding: 2px; display: flex; }
    .menu-close svg { width: 22px; height: 22px; }
    .menu-list { padding: 10px 0; }
    .menu-item {
      position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      padding: 11px 18px; border: 0; background: transparent; color: var(--ink);
      font: inherit; font-size: 16px; font-weight: 500; text-decoration: none; cursor: pointer;
      transition: background .15s;
    }
    .menu-item + .menu-item::before {
      content: ''; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--line);
    }
    .menu-item:active { background: var(--line); }
    .menu-item:active .mi { transform: scale(.92); }
    .mi {
      --c1: #94a3b8; --c2: #475569;
      width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(145deg, var(--c1), var(--c2));
      box-shadow: inset 0 1px 0 #ffffff40, 0 3px 8px color-mix(in srgb, var(--c2) 35%, transparent);
      transition: transform .15s;
    }
    .mi svg { width: 20px; height: 20px; }
    .mi-home     { --c1: #ecc76a; --c2: #b8862b; }
    .mi-chat     { --c1: #5eb0ff; --c2: #2563eb; }
    .mi-users    { --c1: #3ddc9f; --c2: #0e9467; }
    .mi-settings { --c1: #9aa6b8; --c2: #4b5567; }
    .mi-install  { --c1: #b197fc; --c2: #6d3fe0; }
    .mi-logout   { --c1: #ff8a80; --c2: #d93636; }
    .mi-chev { margin-left: auto; width: 18px; height: 18px; color: var(--border); flex: none; }
    .menu-item.out { margin-top: 14px; color: var(--bad); }
    .menu-item.out::before { display: none; }
    .menu-foot { margin-top: auto; padding: 16px 18px; color: var(--muted); font-size: 12px; }

    /* Налаштування */
    .set-block { background: var(--card); border-radius: 14px; padding: 2px 16px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px #0000000d; }
    .set-block h3 { margin: 14px 0 10px; }
    .chip { background: var(--card); }
    .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; }
    .swatch.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }

    /* Чат */
    .chat {
      height: calc(100dvh - 250px); min-height: 280px; overflow-y: auto; background: var(--card);
      border-radius: 14px; padding: 12px; box-shadow: 0 2px 8px #0000000d; display: flex; flex-direction: column; gap: 6px;
    }
    .msg { max-width: 82%; align-self: flex-start; background: var(--bg); border-radius: 14px 14px 14px 4px; padding: 7px 12px; }
    .msg.mine { align-self: flex-end; background: var(--gold-soft); border-radius: 14px 14px 4px 14px; }
    .msg.can-del { cursor: pointer; }
    .msg-head { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .msg-head b { color: var(--gold-ink); font-weight: 600; }
    .msg-body { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.4; }
    .msg-day { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
    .chat-input { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
    .chat-input textarea { resize: none; max-height: 120px; margin: 0; }
    .chat-input .btn { flex: none; width: 52px; height: 46px; padding: 0; font-size: 20px; }

    /* Вхід */
    .login-links { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--link); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    .msg-ok { color: var(--ok); }
    .info { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.55; margin-bottom: 12px; }

    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--head); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px;
      max-width: calc(100% - 32px); box-shadow: 0 8px 24px #0003; z-index: 10;
    }
    .toast.bad { background: var(--bad); }

    /* Компактна шапка всередині розділів */
    body.inner header { padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom-width: 3px; }
    body.inner header h1, body.inner header .motto { display: none; }
    body.inner .brand { font-size: 13px; color: #e5e7eb; }
    body.inner .hwrap { align-items: center; }
    body.inner .menu-btn { width: 38px; height: 38px; }
    body[data-route="chat"] footer { display: none; }
    body.has-tabs .chat { height: calc(100dvh - 250px - 62px - env(safe-area-inset-bottom)); }

    /* Нижня панель вкладок */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px #0000000a;
    }
    .tabbar .tabs { max-width: 640px; margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); }
    .tab {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 9px 2px 8px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 500;
    }
    .tab svg { width: 24px; height: 24px; }
    .tab.on { color: var(--ink); font-weight: 700; }
    .tab.on svg { color: var(--gold-ink); }
    .tab.on::before { content: ''; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
    body.has-tabs { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
    body.has-tabs .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
    .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* Головна: плитки розділів */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .tile {
      display: flex; flex-direction: column; gap: 10px; min-height: 108px; padding: 14px;
      background: var(--card); border-radius: 14px; box-shadow: 0 2px 8px #0000000d; color: var(--ink); text-decoration: none;
    }
    .tile:active { background: var(--line); }
    .tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink);
      display: flex; align-items: center; justify-content: center; }
    .tile .ic svg { width: 22px; height: 22px; }
    .tile strong { display: block; font-size: 15px; }
    .tile small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    a.stat { color: inherit; text-decoration: none; position: relative; }
    a.stat::after { content: '›'; position: absolute; top: 10px; right: 12px; color: var(--muted); font-size: 18px; }
    a.stat:active { background: var(--line); }

    /* Головна: тренування зараз */
    .now {
      display: flex; align-items: center; gap: 14px; margin: 0 0 12px; padding: 16px 18px; border-radius: 16px;
      background: var(--primary); color: var(--on-primary); text-decoration: none;
    }
    .now b { display: block; font-size: 17px; }
    .now span { display: block; font-size: 13px; opacity: .75; margin-top: 2px; }
    .now .go { margin-left: auto; font-size: 26px; line-height: 1; }
    .now .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); animation: pulse 1.8s infinite; }
    .now.soon { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--gold); }
    .now.soon .dot { animation: none; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 70%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }

    /* Кольоровий пояс */
    .belt {
      display: inline-block; flex: none; width: 26px; height: 9px; border-radius: 3px; vertical-align: middle;
      background: linear-gradient(90deg, var(--b) 0 60%, var(--s) 60% 80%, var(--b) 80%);
      box-shadow: inset 0 0 0 1px #0000002e; margin-right: 8px; position: relative; top: -2px;
    }
    :root[data-theme="dark"] .belt { box-shadow: inset 0 0 0 1px #ffffff47; }
    .belt.big { width: 54px; height: 16px; border-radius: 4px; top: 0; }
    a.row { text-decoration: none; }
    a.btn { text-decoration: none; }
    .row .belt, .badge .belt { display: inline-block; margin-top: 0; }
    .chips.seg { padding-bottom: 4px; }
    .chips.seg .chip { font-weight: 600; }
    .chips.seg .chip.on { background: var(--gold); color: #111827; }
    .sum-sec { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .sum-sec:last-child { border-bottom: 0; }
    .assign-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .assign-row .chips { padding: 0; flex: none; }
    .assign-row .chip { padding: 6px 11px; font-size: 13px; }
    .pick-tools { display: flex; align-items: center; gap: 14px; margin: 10px 0 8px; }
    .pick-tools span { margin-left: auto; }
    .pick-list { max-height: 46vh; overflow-y: auto; box-shadow: inset 0 0 0 1px var(--line); }
    .hero > h2 + .note { color: var(--ink); }
    /* Форми знизу екрана (шторки) */
    dialog.sheet[open] { animation: sheetUp .3s cubic-bezier(.2, .8, .2, 1); }
    dialog.sheet.closing { animation: sheetDown .2s ease-in forwards; }
    dialog.sheet::backdrop { animation: fadeIn .25s ease-out; }
    dialog.sheet.closing::backdrop { animation: fadeOut .2s ease-in forwards; }
    dialog.sheet::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 10px auto 0; }
    dialog.sheet .dlg-actions { position: sticky; bottom: 0; z-index: 1; background: var(--card); margin: 16px -20px -20px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
    @media (max-width: 700px) {
      dialog.sheet { margin: auto 0 0; width: 100%; max-width: 100%; max-height: 92dvh; border-radius: 22px 22px 0 0; }
    }
    @media (min-width: 701px) {
      dialog.sheet[open] { animation-name: popIn; }
      dialog.sheet.closing { animation-name: popOut; }
      dialog.sheet::before { display: none; }
    }
    @keyframes sheetUp { from { transform: translateY(100%); } }
    @keyframes sheetDown { to { transform: translateY(100%); } }
    @keyframes popIn { from { transform: scale(.96); opacity: 0; } }
    @keyframes popOut { to { transform: scale(.96); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }
    .confirm-body { padding: 18px 20px 20px; }
    .confirm-body h3 { margin: 4px 0 6px; font-size: 19px; }

-- Вступ за посиланням: створює учасника і привʼязує до спортсмена
create or replace function public.claim_invite(p_code text, p_name text)
returns text language plpgsql security definer set search_path = public as $$
declare
  inv public.invites;
  em text := lower(auth.jwt() ->> 'email');
  aname text;
begin
  if em is null then raise exception 'not_signed_in'; end if;
  select * into inv from public.invites where code = upper(trim(p_code)) for update;
  if not found then raise exception 'invite_not_found'; end if;
  select full_name into aname from public.athletes where id = inv.athlete_id;
  if exists (select 1 from public.member_athletes where email = em and athlete_id = inv.athlete_id) then
    return aname;
  end if;
  if inv.expires_at < now() or inv.uses_left <= 0 then raise exception 'invite_expired'; end if;
  insert into public.members (email, full_name, role)
    values (em, coalesce(nullif(trim(p_name), ''), em), inv.role)
    on conflict (email) do nothing;
  insert into public.member_athletes (email, athlete_id) values (em, inv.athlete_id)
    on conflict do nothing;
  update public.invites set uses_left = uses_left - 1 where code = inv.code;
  return aname;
end $$;
revoke execute on function public.claim_invite(text, text) from anon;

  if (select count(*) from public.join_requests where email = em) >= 5 then raise exception 'too_many'; end if;
  rev := split_part(n, ' ', 2) || ' ' || split_part(n, ' ', 1);
  select array_agg(a.id::text) into ids from public.athletes a

// Supabase → Edge Functions → назва «notify». Секрети: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY.
import webpush from "npm:web-push@3.6.7";
import { createClient } from "npm:@supabase/supabase-js@2";

const cors = {
  "Access-Control-Allow-Origin": "*",
  "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
  "Access-Control-Allow-Methods": "POST, OPTIONS",
};
const json = (data: unknown, status = 200) =>
  new Response(JSON.stringify(data), { status, headers: { ...cors, "Content-Type": "application/json" } });

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
  try {
    const url = Deno.env.get("SUPABASE_URL")!;
    const authHeader = req.headers.get("Authorization") ?? "";
    // Хто надсилає — перевіряємо його правами
    const asUser = createClient(url, Deno.env.get("SUPABASE_ANON_KEY")!, { global: { headers: { Authorization: authHeader } } });
    const { data: { user } } = await asUser.auth.getUser();
    if (!user?.email) return json({ error: "not_signed_in" }, 401);

    const b = await req.json();
    const kind = String(b.kind || "");
    const rpc = async (fn: string) => (await asUser.rpc(fn)).data === true;
    const allowed = kind === "chat" ? await rpc("is_athlete_member")
      : kind === "joined" ? await rpc("is_member")
      : kind === "request" ? await rpc("has_join_request")
      : ["announcement", "event", "plan"].includes(kind) ? await rpc("is_coach")
      : false;
    if (!allowed) return json({ error: "forbidden" }, 403);

    // Кому надсилати — рахує база (service role)
    const admin = createClient(url, Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);
    const { data: targets, error } = await admin.rpc("push_targets", {
      p_kind: kind,
      p_audience: b.audience ?? "all",
      p_section: b.section || null,
      p_group: b.group || null,
      p_exclude: user.email,
    });
    if (error) return json({ error: error.message }, 500);

    webpush.setVapidDetails(
      Deno.env.get("VAPID_SUBJECT") ?? "mailto:rostyslavferents@gmail.com",
      Deno.env.get("VAPID_PUBLIC_KEY")!,
      Deno.env.get("VAPID_PRIVATE_KEY")!,
    );
    const payload = JSON.stringify({
      title: String(b.title || "Ferents Team").slice(0, 80),
      body: String(b.body || "").slice(0, 240),
      url: String(b.url || "./"),
      tag: kind,
    });

    let sent = 0;
    const gone: string[] = [];
    await Promise.all((targets ?? []).map(async (t: { endpoint: string; sub: webpush.PushSubscription }) => {
      try { await webpush.sendNotification(t.sub, payload, { TTL: 86400 }); sent++; }
      catch (e) { const s = (e as { statusCode?: number }).statusCode; if (s === 404 || s === 410) gone.push(t.endpoint); }
    }));
    // Пристрої, які відписались, прибираємо
    if (gone.length) await admin.from("push_subscriptions").delete().in("endpoint", gone);
    return json({ sent, removed: gone.length });
  } catch (e) {
    return json({ error: String(e) }, 500);
  }
});
`;

      if (f.type === 'textarea') return `<label>${f.label}<textarea name="${f.name}" rows="${f.rows || 3}" ${req} ${f.attrs || ''}>${esc(v)}</textarea></label>`;
      if (f.type === 'checkbox') return `<label class="check"><input type="checkbox" name="${f.name}" ${v !== false ? 'checked' : ''}>${f.label}</label>`;
      return `<label>${f.label}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.attrs || ''}></label>`;
    };

    dlg.innerHTML = `<form>
        <h3>${esc(title)}</h3>
        ${top}
        ${fields.map(field).join('')}
        ${extra ? `<div class="dlg-extra">${extra}</div>` : ''}
        <div class="dlg-actions">
          ${onDelete ? '<button type="button" class="btn danger" data-act="delete">Видалити</button>' : ''}
          <span class="spacer"></span>
          <button type="button" class="btn light" data-act="cancel">Скасувати</button>
          <button type="submit" class="btn">Зберегти</button>
        </div>
      </form>`;

    const form = dlg.querySelector('form');
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const obj = {};
      for (const f of fields) {
        let v;
        if (f.type === 'checkbox') v = fd.has(f.name);
        else {
          v = String(fd.get(f.name) ?? '').trim();
          if (v === '') v = null;
          else if (f.type === 'number' || f.cast === 'number') v = Number(v);
        }
        obj[f.name] = v;
      }
      const btn = form.querySelector('[type=submit]');
      btn.disabled = true;
      state.queued = false;
      try {
        await onSave(obj); dlg.close();
        toast(state.queued ? '⏳ Збережено на телефоні — відправлю, коли буде інтернет' : 'Збережено');
        render();
      }
      catch (err) { /* помилку вже показано */ }
      finally { btn.disabled = false; }
    };
    form.querySelector('[data-act=cancel]').onclick = () => dlg.close();
    const del = form.querySelector('[data-act=delete]');
    if (del) del.onclick = async () => {
      // Якщо видалення можна відмінити — видаляємо одразу з кнопкою «Скасувати», інакше питаємо
      if (!onUndo && !(await confirmSheet({ title: 'Видалити?', text: deleteText || 'Цю дію не можна буде скасувати.' }))) return;
      state.queued = false;
      try {
        await onDelete(); dlg.close();
        const msg = state.queued ? '⏳ Видалено на телефоні — відправлю, коли буде інтернет' : 'Видалено';
        toast(msg, false, onUndo ? { label: 'Скасувати', fn: async () => { try { await onUndo(); toast('Повернуто'); render(); } catch (e) {} } } : null);
        render();
      } catch (err) {}
    };
    dlg.showModal();
  }

  async function homeView() {
    setActions('');
    if (state.role === 'member') return memberHomeView();
    if (state.role !== 'coach') return joinView();

    const t = today();
    const reqP = db.from('join_requests').select('id', { count: 'exact', head: true });
    let [ath, att, pay, sch, ev, pl] = await Promise.all([
      q(db.from('athletes').select('*')),
      q(db.from('attendance').select('athlete_id, date').eq('date', t).eq('present', true)),
      q(db.from('payments').select('athlete_id, month').eq('month', t.slice(0, 7) + '-01')),
      q(db.from('schedule').select('*').order('start_time')),
      q(db.from('events').select('title, date').gte('date', t).order('date').limit(1)),
      db.from('training_plans').select('group_name, title').eq('date', t),
    ]).then(([a1, a2, a3, a4, a5, a6]) => [a1,
      withPending('attendance', a2, r => r.date === t).filter(r => r.present !== false),
      withPending('payments', a3, r => r.month === t.slice(0, 7) + '-01'), a4, a5, a6]);
    const schAll = sch;
    sch = schAll.filter(s => Number(s.weekday) === weekdayOf(t));
    const plansToday = (pl.data || []);
    const active = ath.filter(isActive);
    const paid = new Set(pay.map(p => p.athlete_id));
    const unpaid = active.filter(a => !paid.has(a.id)).length;
    const presentIds = new Set(att.map(m => String(m.athlete_id)));

    // Тренування, яке йде зараз (за 30 хв до початку і 30 хв після кінця), або наступне сьогодні
    const mins = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
    const nowD = new Date(), nowM = nowD.getHours() * 60 + nowD.getMinutes();
    const slots = sch.map(s => {
      const st = mins(s.start_time), en = s.end_time ? mins(s.end_time) : st + 90;
      return { s, st, en };
    });
    // Якщо вікна груп перекриваються — беремо ту, що вже почалася найпізніше
    const inWin = slots.filter(x => nowM >= x.st - 30 && nowM <= x.en + 30);
    const current = inWin.filter(x => x.st <= nowM).sort((a, b) => b.st - a.st)[0] || inWin[0];
    // Наступна група сьогодні після поточної
    const after = current && slots.filter(x => x.st > current.st).sort((a, b) => a.st - b.st)[0];
    let next = !current && slots.find(x => x.st > nowM);
    if (next) next.date = t;
    // Сьогодні більше немає — шукаємо найближчий день за розкладом (до тижня вперед)
    if (!current && !next) {
      for (let d = 1; d <= 7 && !next; d++) {
        const date = shiftDate(t, d);
        const s = schAll.filter(x => Number(x.weekday) === weekdayOf(date))
          .sort((a, b) => mins(a.start_time) - mins(b.start_time))[0];
        if (s) next = { s, st: mins(s.start_time), date, days: d };
      }
    }
    const groupCount = (g, sec) => {
      const inG = active.filter(a => (!g || a.group_name === g) && (!sec || !('section' in a) || a.section === sec));
      return [inG.filter(a => presentIds.has(String(a.id))).length, inG.length];
    };
    let nowBlock = '';
    if (current) {
      const [n, total] = groupCount(current.s.group_name, current.s.section);
      const curLabel = esc([current.s.section, current.s.group_name].filter(Boolean).join(' · '));
      if (n > 0 && after) {
        // Поточну групу вже відмічено — пропонуємо наступну

  // Вік і підпис дати народження
  function ageOf(a) {
    if (!a.birth_date) return null;
    const b = new Date(a.birth_date + 'T12:00'), n = new Date();
    let age = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) age--;
    return age;
  }
  function yearsWord(n) {
    const d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return 'рік';
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return 'роки';
    return 'років';
  }
  // Найближчий день народження: { days, age, date }
  function nextBirthday(a) {
    if (!a.birth_date) return null;
    const [y, m, d] = a.birth_date.split('-').map(Number);
    const t = today(), ty = Number(t.slice(0, 4));
    const mk = yr => {
      // 29 лютого в невисокосний рік святкуємо 28-го
      const leap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0;
      const dd = (m === 2 && d === 29 && !leap) ? 28 : d;
      return `${yr}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
    };
    let date = mk(ty), yr = ty;
    if (date < t) { yr = ty + 1; date = mk(yr); }
    const days = Math.round((new Date(date + 'T12:00') - new Date(t + 'T12:00')) / 864e5);
    return { days, age: yr - y, date };
  }
  function bdayMark(a) {
    const b = nextBirthday(a);
    if (!b || b.days > 7) return '';
    return b.days === 0 ? ' 🎂 сьогодні!' : ' 🎂';
  }

  function birthLabel(a) {
    const age = ageOf(a);
    if (age !== null) return `${age} ${yearsWord(age)}`;
    return a.birth_year ? a.birth_year + ' р.н.' : '';
  }
  function fmtKg(w) { return Number(w).toLocaleString('uk-UA', { maximumFractionDigits: 1 }) + ' кг'; }

  // Остання вага кожного спортсмена: Map(id → {weight, date})
  async function lastWeights() {
    const { data } = await db.from('weights').select('athlete_id, weight, date').order('date', { ascending: false });
    const m = new Map();
    (data || []).forEach(w => { if (!m.has(String(w.athlete_id))) m.set(String(w.athlete_id), w); });
    return m;
  }

  // ----- Спортсмени -----
  // ----- Додати спортсменів списком (вставити з нотаток, Excel, Google Таблиць) -----
  // Рядок: «Імʼя Прізвище» + за бажання через кому/Tab: рік або дата народження, група, секція
  function parseAthleteLines(text, defGroup, defSection) {
    const norm = s => s.toLowerCase().replace(/[’'`ʼ]/g, '');
    const groupOf = s => GROUPS.find(g => norm(s).startsWith(norm(g).slice(0, 5)));
    const sectionOf = s => SECTIONS.find(x => norm(s).startsWith(norm(x).slice(0, 4)));
    return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.split(/\t|;|,/).map(s => s.trim()).filter(Boolean);
      const row = { full_name: '', group_name: defGroup || null, section: defSection || null, birth_date: null, birth_year: null };
      const nameParts = [];
      for (const p of parts) {
        let m;
        if ((m = p.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/))) {
          row.birth_date = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; row.birth_year = Number(m[3]);
        } else if ((m = p.match(/^(\d{4})-(\d{2})-(\d{2})$/))) { row.birth_date = p; row.birth_year = Number(m[1]); }
        else if (/^(19|20)\d{2}( ?р\.?(н\.?)?)?$/i.test(p)) row.birth_year = Number(p.slice(0, 4));
        else if (groupOf(p)) row.group_name = groupOf(p);
        else if (sectionOf(p)) row.section = sectionOf(p);
        else if (/^\d+[.)]?$/.test(p)) continue; // номер рядка «1.»
        else nameParts.push(p);
      }
      row.full_name = nameParts.join(' ').replace(/^\d+[.)]\s*/, '').replace(/\s+/g, ' ').trim();
      return row;
    }).filter(r => r.full_name.length > 1);
  }

  function bulkAthletes(existing) {

    const dlg = $('#dlg');
    dlg.innerHTML = `<form><h3>Додати списком</h3>
      <p class="muted small" style="margin:4px 0 8px">Вставте список: <b>одна людина — один рядок</b>. Можна скопіювати з нотаток, Viber, Excel чи Google Таблиць.
        Після імені через кому можна дописати рік або дату народження, групу й секцію — або вибрати їх нижче для всіх одразу.</p>
      <textarea id="bulkText" rows="8" style="width:100%" placeholder="Петренко Іван, 2015\nКоваль Марія, 03.05.2014\nШевчук Олег"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        ${state.hasSection !== false ? `<label style="flex:1;min-width:130px">Секція<select id="bulkSec"><option value="">— з рядка —</option>${SECTIONS.map(s => `<option ${state.section === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}
        <label style="flex:1;min-width:130px">Група<select id="bulkGroup"><option value="">— з рядка —</option>${GROUPS.map(g => `<option ${state.group === g ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
      </div>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="bulkSwap">У списку спочатку імʼя — переставити, щоб першим було прізвище</label>
      <div id="bulkPrev" class="small" style="margin-top:10px"></div>
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn" id="bulkGo" disabled>Додати</button></div></form>`;
    const form = dlg.querySelector('form');
    let rows = [];
    const preview = () => {
      const all = parseAthleteLines($('#bulkText').value, $('#bulkGroup').value, $('#bulkSec') ? $('#bulkSec').value : '');
      if ($('#bulkSwap').checked) all.forEach(r => { r.full_name = surnameFirst(r.full_name); });
      const seen = new Set();
      rows = all.filter(r => { const k = r.full_name.toLowerCase(); if (have.has(k) || seen.has(k)) return false; seen.add(k); return true; });
      const dup = all.length - rows.length;
      const noGroup = rows.filter(r => !r.group_name).length;
      const noSec = $('#bulkSec') ? rows.filter(r => !r.section).length : 0;
      $('#bulkPrev').innerHTML = all.length ? `
        <b>Буде додано: ${rows.length}</b>${dup ? ` <span class="muted">· пропущено ${dup} (вже є в списку або повтор)</span>` : ''}
        ${noGroup || noSec ? `<div class="err" style="margin-top:4px">⚠️ ${noGroup ? `Без групи: ${noGroup}. ` : ''}${noSec ? `Без секції: ${noSec}. ` : ''}Виберіть вище для всіх або допишіть у рядки.</div>` : ''}
        <div class="list" style="margin-top:6px;max-height:200px;overflow:auto">${rows.map(r => `<div class="row" style="cursor:default;padding:6px 10px">
          <div><strong style="font-size:14px">${esc(r.full_name)}</strong><span>${esc([r.section, r.group_name, r.birth_date ? fmtDate(r.birth_date, { day: '2-digit', month: '2-digit', year: 'numeric' }) : r.birth_year].filter(Boolean).join(' · '))}</span></div></div>`).join('')}</div>` : '';
      $('#bulkGo').disabled = !rows.length || noGroup > 0 || noSec > 0;
      $('#bulkGo').textContent = rows.length ? `Додати ${rows.length}` : 'Додати';
    };
    form.oninput = preview; form.onchange = preview;
    form.querySelector('[data-act=cancel]').onclick = () => dlg.close();
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = $('#bulkGo'); btn.disabled = true;
      try {
        const data = rows.map(r => {
          const o = { full_name: r.full_name, group_name: r.group_name, active: true };
          if ($('#bulkSec')) o.section = r.section;
          if (r.birth_date) o.birth_date = r.birth_date;
          if (r.birth_year) o.birth_year = r.birth_year;
          return o;
        });
        await q(db.from('athletes').insert(data));
        dlg.close(); toast(`Додано спортсменів: ${data.length}`); render();

  // ----- Імʼя ↔ прізвище: «Іван Петренко» → «Петренко Іван» -----
  // Останнє слово стає першим (по батькові, якщо є, лишається після імені)
  function surnameFirst(name) {
    const p = String(name || '').trim().split(/\s+/);
    return p.length > 1 ? [p[p.length - 1], ...p.slice(0, -1)].join(' ') : p.join(' ');
  }
  // Імʼя для звертання (у базі тепер «Прізвище Імʼя»)
  function firstNameOf(full) {
    const p = String(full || '').trim().split(/\s+/);
    return p.length > 1 ? p[1] : p[0];
  }
  function swapNames(list) {
    const people = list.filter(a => a.full_name.trim().split(/\s+/).length > 1);
    const on = new Set(people.map(a => String(a.id)));
    const dlg = $('#dlg');
    dlg.innerHTML = `<form><h3>Спочатку прізвище</h3>
      <p class="muted small" style="margin:4px 0 8px">Перевірте список. <b>Зніміть галочку</b> з тих, у кого прізвище вже стоїть першим — їх не буде змінено.</p>
      <div class="pick-tools"><span class="muted small" id="swCount"></span>
        <button type="button" class="linkbtn" id="swAll">усі</button> · <button type="button" class="linkbtn" id="swNone">жодного</button></div>
      <div class="list pick-list" id="swList" style="max-height:50vh;overflow:auto"></div>
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn" id="swGo">Змінити</button></div></form>`;
    const draw = () => {
      $('#swList').innerHTML = people.map(a => `<label class="row tick">
          <span><strong>${esc(on.has(String(a.id)) ? surnameFirst(a.full_name) : a.full_name)}</strong>
            <span>${on.has(String(a.id)) ? 'було: ' + esc(a.full_name) : 'без змін'}</span></span>
          <input type="checkbox" data-sw="${esc(a.id)}" ${on.has(String(a.id)) ? 'checked' : ''}></label>`).join('') || '<div class="empty">Немає кого змінювати</div>';
      $('#swCount').textContent = `Буде змінено: ${on.size} з ${people.length}`;
      $('#swGo').disabled = !on.size;
    };
    const form = dlg.querySelector('form');
    form.onchange = e => {
      const b = e.target.closest('[data-sw]'); if (!b) return;
      b.checked ? on.add(b.dataset.sw) : on.delete(b.dataset.sw); draw();
    };
    form.onclick = e => {
      if (e.target.closest('[data-act=cancel]')) dlg.close();
      if (e.target.closest('#swAll')) { people.forEach(a => on.add(String(a.id))); draw(); }
      if (e.target.closest('#swNone')) { on.clear(); draw(); }
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = $('#swGo'); btn.disabled = true;
      const todo = people.filter(a => on.has(String(a.id)));
      let done = 0;
      try {
        for (const a of todo) {
          await q(db.from('athletes').update({ full_name: surnameFirst(a.full_name) }).eq('id', a.id));
          btn.textContent = `${++done} / ${todo.length}`;
        }
        dlg.close();
        toast(`Змінено: ${done}`, false, { label: 'Скасувати', fn: async () => {
          for (const a of todo) await q(db.from('athletes').update({ full_name: a.full_name }).eq('id', a.id));
          toast('Повернуто'); render();
        } });
        render();
      } catch (err) { dlg.close(); render(); }
    };
    draw();
    dlg.showModal();
  }

  // ----- Рейтинг: тренер сам додає спортсменів і розставляє місця -----
  // Місця завжди 1, 2, 3… без пропусків
  async function renumberRating(list) {
    const rated = list || await q(db.from('athletes').select('id, rating_place').not('rating_place', 'is', null).order('rating_place'));
    for (let i = 0; i < rated.length; i++) {
      if (rated[i].rating_place !== i + 1) await q(db.from('athletes').update({ rating_place: i + 1 }).eq('id', rated[i].id));
    }
  }
  // Рейтинг для батьків і спортсменів: лише перегляд

    noteSection(ath);
    if (!state.hasMerits) {
      setActions('');

      <div class="list rating">${rated.map((a, i) => {
        const body = `<span class="rank ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</span>
          ${avatarHtml(a, urlOf(a.photo))}
          <div class="grow"><strong>${beltTag(a.belt)}${esc(a.full_name)}</strong>

                <button type="button" data-down="${i}" ${i < rated.length - 1 ? '' : 'disabled'} aria-label="Нижче">↓</button>
                <button type="button" class="x" data-out="${i}" aria-label="Прибрати">✕</button></div></div>`
          : `<a class="row" href="#athlete/${encodeURIComponent(a.id)}">${body}<span class="chev">›</span></a>`;
      }).join('') || `<div class="empty">У рейтингу ще нікого немає. Натисніть «Редагувати» → «+ Додати спортсмена», або відкрийте картку спортсмена → «🏆 Додати до рейтингу».</div>`}</div>

  // Вибір спортсменів, яких додати в кінець рейтингу
  function addToRating(people, count) {
    const dlg = $('#dlg');
    const chosen = [];
    let search = '';
    dlg.innerHTML = `<form><h3>Додати до рейтингу</h3>
      <input type="search" id="rSearch" placeholder="Пошук за імʼям" style="margin-top:10px">

  // Швидко розподілити спортсменів без секції
  function assignSections(people) {
    const dlg = $('#dlg');
    const choice = new Map();
    dlg.innerHTML = `<form><h3>Розподілити по секціях</h3>
      <p class="muted small" style="margin:4px 0 8px">Натисніть секцію для кожного. Кого не відмітите — залишиться без змін.</p>
      ${people.map(a => `<div class="assign-row"><span><b>${esc(a.full_name)}</b><br><span class="muted small">${esc(a.group_name || '')}</span></span>
        <div class="chips">${SECTIONS.map(x => `<button type="button" class="chip" data-aid="${esc(a.id)}" data-sec="${x}">${x}</button>`).join('')}</div></div>`).join('')}
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn">Зберегти</button></div></form>`;
    const form = dlg.querySelector('form');
    form.onclick = e => {
      const b = e.target.closest('[data-sec]');
      if (b) {
        choice.set(b.dataset.aid, b.dataset.sec);
        b.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
      }
      if (e.target.closest('[data-act=cancel]')) dlg.close();
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector('[type=submit]');
      btn.disabled = true;
      try {
        for (const [id, sec] of choice) await q(db.from('athletes').update({ section: sec }).eq('id', people.find(a => String(a.id) === id).id));
        dlg.close(); toast(`Збережено: ${choice.size}`); render();
      } catch (err) { btn.disabled = false; }
    };
    dlg.showModal();
  }

  async function athleteForm(a) {
    let lastWeight = null;
    if (a) {
      const { data } = await db.from('weights').select('weight').eq('athlete_id', a.id).order('date', { ascending: false }).limit(1);
      lastWeight = data && data[0] ? Number(data[0].weight) : null;
    }
    // Фото: нове (blob), «прибрати» або без змін
    let photoNew = null, photoRemove = false;
    const curUrl = a && a.photo ? (await photoUrls([a.photo]).catch(() => () => ''))(a.photo) : '';
    const top = state.hasPhoto === false
      ? `<div class="photo-note">📷 Щоб додавати фото, один раз увімкніть їх у Supabase.
           <button type="button" class="linkbtn" id="phSql">Скопіювати SQL</button></div>`
      : `<div class="photo-edit">${avatarHtml(a || { full_name: '?' }, curUrl, 'avatar')}
          <div class="acts"><label class="btn light sm">📷 ${a && a.photo ? 'Змінити фото' : 'Додати фото'}
            <input type="file" accept="image/*" id="phFile" hidden></label>
          ${a && a.photo ? '<button type="button" class="linkbtn" id="phDel">Прибрати фото</button>' : ''}</div></div>`;
    openForm({
      top,
      title: a ? a.full_name + (ageOf(a) !== null ? `, ${birthLabel(a)}` : '') : 'Новий спортсмен',
      values: a ? { ...a, weight: lastWeight } : { group_name: state.group !== 'Усі' ? state.group : '',
                                                     section: state.section !== 'Усі' ? state.section : '', active: true },
      fields: [
        { name: 'full_name', label: 'Прізвище та імʼя', required: true, attrs: 'placeholder="Петренко Іван"' },
        ...(state.hasSection ? [{ name: 'section', label: 'Секція', type: 'select', options: SECTIONS, required: true }] : []),
        { name: 'group_name', label: 'Група', type: 'select', options: GROUPS, required: true },
        { name: 'birth_date', label: 'Дата народження' + (a && !a.birth_date && a.birth_year ? ` (зараз вказано лише рік: ${a.birth_year})` : ''), type: 'date', attrs: 'min="1990-01-01" max="' + today() + '"' },
        { name: 'weight', label: 'Вага, кг (зберігається в історію на сьогодні)', type: 'number', attrs: 'min="10" max="200" step="0.1" inputmode="decimal"' },
        { name: 'belt', label: 'Пояс / кю', type: 'select', options: beltOptions(a && a.belt) },
        { name: 'parent_name', label: 'Батьки (імʼя)' },
        { name: 'phone', label: 'Телефон', type: 'tel' },
        ...(state.hasMerits ? [{ name: 'achievements', label: '🏆 Заслуги (медалі, турніри, досягнення)', type: 'textarea', rows: 4,
            attrs: 'placeholder="напр. 🥇 Чемпіонат області 2026, куміте\n🥈 Кубок України 2025, ката"' }] : []),
        { name: 'notes', label: 'Нотатки', type: 'textarea' },
        { name: 'active', label: 'Активний (ходить на тренування)', type: 'checkbox' },
      ],
      onSave: async obj => {
        const weight = obj.weight;
        delete obj.weight;
        obj.birth_year = obj.birth_date ? Number(obj.birth_date.slice(0, 4)) : (a ? a.birth_year : null);
        let id = a && a.id;
        if (a) await q(db.from('athletes').update(obj).eq('id', a.id));
        else id = (await q(db.from('athletes').insert(obj).select('id').single())).id;
        if (weight !== null && weight !== lastWeight) {
          await write('weights', 'upsert', [{ athlete_id: id, date: today(), weight }]);
        }
        // Фото зберігаємо окремо: якщо не вийде, решта анкети вже збережена
        if (photoNew || photoRemove) {
          try {
            let path = null;
            if (photoNew) {
              path = `${id}/${Date.now()}.jpg`;
              const { error } = await db.storage.from(PHOTO_BUCKET).upload(path, photoNew, { contentType: 'image/jpeg' });
              if (error) throw error;
            }
            await q(db.from('athletes').update({ photo: path }).eq('id', id));
            if (a && a.photo) db.storage.from(PHOTO_BUCKET).remove([a.photo]);
          } catch (err) { toast('Анкету збережено, але фото — ні: ' + (err.message || err), true); }
        }
      },
      onDelete: a ? async () => { await q(db.from('athletes').delete().eq('id', a.id)); location.hash = '#athletes'; } : null,
      deleteText: 'Видалити спортсмена разом з усією історією відвідувань, оплат і ваги?\n\nЯкщо він просто перестав ходити — краще зніміть галочку «Активний».',
    });
    const fileIn = $('#phFile');
    if (fileIn) fileIn.onchange = async () => {
      const f = fileIn.files[0];
      fileIn.value = '';
      if (!f) return;
      try {
        const blob = await compressPhoto(f);
        if (!blob) return;
        photoNew = blob; photoRemove = false;
        $('#dlg .photo-edit .avatar').innerHTML = `<img src="${URL.createObjectURL(photoNew)}" alt="">`;
      } catch (e) { toast('Не вдалося відкрити фото', true); }
    };
    const delPh = $('#phDel');
    if (delPh) delPh.onclick = () => { photoRemove = true; photoNew = null; $('#dlg .photo-edit .avatar').textContent = initialsOf(a.full_name); };
    const sqlBtn = $('#phSql');
    if (sqlBtn) sqlBtn.onclick = () => copyText(PHOTO_SQL, 'SQL скопійовано — вставте в Supabase → SQL Editor');
  }

  // ----- Сторінка спортсмена -----
  async function athleteView() {
    setActions('');
    const found = await q(db.from('athletes').select('*').eq('id', state.param));
    noteSection(found);
    const a = found[0];
    if (!a) {
      $('#view').innerHTML = '<div class="empty">Спортсмена не знайдено. <a class="link" href="#athletes">До списку</a></div>';
      return;
    }
    const coach = isCoach();
    if (coach) {
      setActions('<button class="btn light" id="editBtn">Змінити</button>');
      $('#editBtn').onclick = () => athleteForm(a);
    }

    const t = today(), ym = t.slice(0, 7), monthStart = ym + '-01';
    const firstMonth = shiftMonth(ym, -5);
    const [att0, pays0, grs, wts0, sch] = await Promise.all([
      q(db.from('attendance').select('athlete_id, date').eq('athlete_id', a.id).eq('present', true).gte('date', firstMonth + '-01')),
      coach ? q(db.from('payments').select('athlete_id, month, amount, paid_at').eq('athlete_id', a.id).gte('month', firstMonth + '-01')) : [],
      q(db.from('gradings').select('*').eq('athlete_id', a.id).order('date', { ascending: false })),
      q(db.from('weights').select('athlete_id, date, weight').eq('athlete_id', a.id).order('date', { ascending: false }).limit(20)),
      q(db.from('schedule').select('weekday, group_name')),
    ]);
    // Для батьків місце в рейтингу беремо із загального рейтингу
    if (!coach && !a.rating_place) {
      const r = await db.rpc('team_rating');
      a.rating_place = ((r.data || []).find(x => String(x.id) === String(a.id)) || {}).rating_place || null;
    }
    const evs = ((await db.from('events').select('*').gte('date', today()).order('date')).data || [])
      .filter(e => Array.isArray(e.participants) && e.participants.map(String).includes(String(a.id)));
    const mine = r => String(r.athlete_id) === String(a.id);
    const att = withPending('attendance', att0, r => mine(r) && r.date >= firstMonth + '-01').filter(r => r.present !== false);
    const pays = withPending('payments', pays0, r => mine(r) && r.month >= firstMonth + '-01');
    const wts = withPending('weights', wts0, mine).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 20);

    // Відвідування цього місяця і % від тренувань за розкладом його групи
    const visits = att.filter(x => x.date >= monthStart).length;
    const days = new Set(sch.filter(s => s.group_name === a.group_name).map(s => s.weekday));
    let planned = 0;
    for (let d = monthStart; d <= t; d = shiftDate(d, 1)) if (days.has(weekdayOf(d))) planned++;
    const pct = planned ? Math.min(100, Math.round(visits / planned * 100)) : null;
    const payOf = new Map(pays.map(p => [p.month.slice(0, 7), p]));
    const paidNow = payOf.has(ym);

    // Шапка
    const photoUrl = a.photo ? (await photoUrls([a.photo]).catch(() => () => ''))(a.photo) : '';
    const nb = nextBirthday(a);
    const bdayLine = nb && nb.days <= 7 ? (nb.days === 0 ? ' · 🎉 сьогодні ДН!' : ` · 🎂 ${fmtDate(nb.date)}`) : '';
    const sub = [a.section, a.group_name || 'Без групи', birthLabel(a), isActive(a) ? '' : 'неактивний'].filter(Boolean).join(' · ');
    const phone = a.phone ? a.phone.replace(/[^\d+]/g, '') : '';

    // Відвідування за 6 місяців
    const months = [...Array(6)].map((_, i) => shiftMonth(firstMonth, i));
    const perMonth = months.map(m => att.filter(x => x.date.startsWith(m)).length);
    const maxV = Math.max(1, ...perMonth);
    const short = m => MONTHS[Number(m.slice(5)) - 1].slice(0, 3);

    // Графік ваги (від старих до нових)
    const wl = wts.slice().reverse().map(w => ({ date: w.date, kg: Number(w.weight) }));
    const lastW = wl[wl.length - 1];
    let weightHtml = '<div class="empty" style="padding:0">Зважувань ще немає. Натисніть «+ Записати вагу».</div>';
    if (wl.length === 1) weightHtml = `<p style="margin:0"><b>${fmtKg(wl[0].kg)}</b> <span class="muted small">· ${fmtDate(wl[0].date)}</span>
      <button type="button" class="linkbtn" data-wedit="0" style="margin-left:6px">змінити</button></p>`;
    if (wl.length > 1) {
      const W = 320, H = 150, L = 34, R = 14, T = 22, B = 24;
      let lo = Math.min(...wl.map(w => w.kg)), hi = Math.max(...wl.map(w => w.kg));
      if (hi - lo < 2) { lo -= 1; hi += 1; }
      const x = i => L + (W - L - R) * i / (wl.length - 1);
      const y = kg => T + (H - T - B) * (1 - (kg - lo) / (hi - lo));
      const kgTxt = n => n.toLocaleString('uk-UA', { maximumFractionDigits: 1 });
      const ticks = [hi, (hi + lo) / 2, lo];
      const last = wl[wl.length - 1];
      weightHtml = `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік ваги">
          ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
            <text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kgTxt(v)}</text>`).join('')}
          <text class="axis" x="${L}" y="${H - 6}">${fmtDate(wl[0].date, { day: '2-digit', month: '2-digit' })}</text>
          <text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last.date, { day: '2-digit', month: '2-digit' })}</text>
          <polyline class="line" points="${wl.map((w, i) => `${x(i)},${y(w.kg)}`).join(' ')}"/>
          ${wl.map((w, i) => `<circle class="pt" r="4" cx="${x(i)}" cy="${y(w.kg)}" data-i="${i}"/>`).join('')}
          <text class="lbl" x="${x(wl.length - 1)}" y="${y(last.kg) - 10}" text-anchor="end">${kgTxt(last.kg)} кг</text>
          ${wl.map((w, i) => `<rect class="hit" x="${x(i) - 14}" y="0" width="28" height="${H}" data-i="${i}"/>`).join('')}
        </svg>
        <div class="wcap" id="wcap">Натисніть на точку, щоб побачити дату й вагу або виправити її</div>`;
    }

    const grHtml = grs.length ? grs.map(g => `<div class="row" data-gid="${esc(g.id)}">
        <div><strong>${beltTag(g.belt)}${esc(g.belt)}</strong><span>${fmtDate(g.date)} ${g.date.slice(0, 4)}${g.note ? ' · ' + esc(g.note) : ''}</span></div>
        <span class="badge ${g.passed ? 'ok' : 'bad'}">${g.passed ? 'здав ✓' : 'не здав'}</span>
      </div>`).join('') : '<div class="empty">Атестацій ще не було</div>';

    $('#view').innerHTML = `
      <div class="hero">
        <div class="hero-top">${coach ? avatarHtml(a, photoUrl, 'avatar') : `<label class="av-edit" title="Змінити фото">${avatarHtml(a, photoUrl, 'avatar')}
            <span class="av-cam">📷</span><input type="file" accept="image/*" id="myPhoto" hidden></label>`}
          <div><h2>${esc(a.full_name)}</h2><span>${esc(sub)}${bdayLine}</span>
          ${coach ? '' : `<label class="link small" style="display:inline-block;margin-top:4px;cursor:pointer" for="myPhoto">${a.photo ? 'Змінити фото' : '📷 Додати фото'}</label>`}</div></div>
        <div class="hero-belt">${a.belt ? beltTag(a.belt, true) + esc(a.belt) : '<span class="muted">Пояс не вказано</span>'}</div>
        <div class="hero-w">⚖️ ${lastW ? `<b>${fmtKg(lastW.kg)}</b> <span class="muted small">· ${fmtDate(lastW.date)}${lastW.date.slice(0, 4) !== t.slice(0, 4) ? ' ' + lastW.date.slice(0, 4) : ''}</span>` : '<span class="muted">Вага не вказана</span>'}</div>
        ${coach && a.parent_name ? `<div class="note">Батьки: ${esc(a.parent_name)}${a.phone ? ' · ' + esc(a.phone) : ''}</div>` : ''}
        ${coach && a.notes ? `<div class="note">${esc(a.notes)}</div>` : ''}
        ${a.achievements ? `<div class="merits-full"><b>🏆 ЗАСЛУГИ</b>${esc(a.achievements)}</div>` : ''}
        ${!coach && a.rating_place ? `<div style="margin-top:12px"><a class="badge gold" href="#rating" style="text-decoration:none">🏆 ${a.rating_place} місце в рейтингу</a></div>` : ''}
        ${coach && state.hasMerits ? `<div style="margin-top:12px">${a.rating_place
            ? `<a class="badge gold" href="#rating" style="text-decoration:none">🏆 ${a.rating_place} місце в рейтингу</a>
               <button type="button" class="linkbtn" id="rateOut" style="margin-left:8px">Прибрати з рейтингу</button>`
            : '<button type="button" class="btn light sm" id="rateIn">🏆 Додати до рейтингу</button>'}</div>` : ''}
        ${coach && phone ? `<a class="btn light wide" href="tel:${esc(phone)}">📞 Подзвонити${a.parent_name ? ' батькам' : ''}</a>` : ''}
      </div>
      <div class="stats">
        <div class="stat"><b>${visits}</b><span>тренувань у ${MONTHS_IN[Number(ym.slice(5)) - 1]}</span></div>
        <div class="stat"><b>${pct === null ? '—' : pct + '%'}</b><span>${pct === null ? 'немає розкладу групи' : `з ${planned} за розкладом`}</span></div>
        ${coach ? `<a class="stat ${paidNow ? '' : 'warn'}" href="#payments" data-month="${ym}"><b>${paidNow ? '✓' : '✗'}</b><span>${paidNow ? 'оплачено' : 'не оплачено'} за місяць</span></a>`
          : `<a class="stat" href="#rating"><b>${a.rating_place || '—'}</b><span>місце в рейтингу</span></a>`}
      </div>
      <h3>Відвідування за пів року</h3>
      <div class="panel">
        <div class="bars">${perMonth.map(n => `<div class="bcol ${n ? '' : 'zero'}"><span class="bval">${n}</span><div class="bbar" style="height:${n / maxV * 100}%"></div></div>`).join('')}</div>
        <div class="blabs">${months.map(m => `<span>${short(m)}</span>`).join('')}</div>
      </div>
      <div class="sec"><h3>Вага</h3>${coach ? '<button type="button" class="btn light sm" id="addW">+ Записати вагу</button>' : ''}</div>
      <div class="panel">${weightHtml}</div>
      ${coach ? `<h3>Оплати</h3>
      <div class="months">${months.map(m => {
        const p = payOf.get(m);
        return `<a class="mcell ${p ? 'ok' : 'bad'}" href="#payments" data-month="${m}">${short(m)}<b>${p ? '✓' : '✗'}</b></a>`;
      }).join('')}</div>` : ''}
      ${evs.length ? `<h3>Найближчі події</h3><div class="list">${evs.map(e => `<a class="row" href="#event/${encodeURIComponent(e.id)}">
          <div><strong>${esc(e.title)}</strong><span>${fmtDate(e.date, { weekday: 'short', day: 'numeric', month: 'long' })}${e.place ? ' · ' + esc(e.place) : ''}</span></div>
          <span class="chev">›</span></a>`).join('')}</div>` : ''}
      <div class="sec"><h3>Атестації</h3>${coach ? '<button type="button" class="btn light sm" id="addG">+ Атестація</button>' : ''}</div>
      <div class="list">${grHtml}</div>
      ${coach ? '<h3>Доступ до застосунку</h3><div id="accessBox" class="panel"><span class="muted small">Завантаження…</span></div>' : ''}`;

    if (!coach) {
      const ph = $('#myPhoto');
      if (ph) ph.onchange = () => { const f = ph.files[0]; ph.value = ''; if (f) memberPhotoUpload(a, f); };
      // Батьки: лише перегляд (графік ваги можна потицяти)
      if ($('#wcap')) $('#wcap').textContent = 'Натисніть на точку, щоб побачити дату й вагу';
      $('#view').querySelectorAll('[data-wedit]').forEach(b => b.remove());
      $('#view').querySelectorAll('a[href^="#event/"]').forEach(l => l.setAttribute('href', '#events'));
      $('#view').onclick = e => {
        const pt = e.target.closest('[data-i]');
        if (pt && wl.length > 1) {
          const i = Number(pt.dataset.i), w = wl[i], prev = wl[i - 1], diff = prev ? w.kg - prev.kg : 0;
          $('#wcap').innerHTML = `<b style="color:var(--ink)">${fmtKg(w.kg)}</b> · ${fmtDate(w.date)} ${w.date.slice(0, 4)}` +
            (prev && diff ? ` · ${diff > 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')} кг` : '');
          document.querySelectorAll('.wchart .pt').forEach(c => c.classList.toggle('on', c.dataset.i === String(i)));
        }
      };
      return;
    }
    $('#addW').onclick = () => weightForm(a);
    drawAccess(a);
    const rIn = $('#rateIn'), rOut = $('#rateOut');
    if (rIn) rIn.onclick = async () => {
      const top = await q(db.from('athletes').select('rating_place').not('rating_place', 'is', null).order('rating_place', { ascending: false }).limit(1));
      await q(db.from('athletes').update({ rating_place: (top[0]?.rating_place || 0) + 1 }).eq('id', a.id));
      toast('Додано до рейтингу — порядок можна змінити у вкладці «Рейтинг»'); render();
    };
    if (rOut) rOut.onclick = async () => {
      await q(db.from('athletes').update({ rating_place: null }).eq('id', a.id));
      await renumberRating(); toast('Прибрано з рейтингу'); render();
    };
    $('#addG').onclick = () => gradingForm([a]);
    $('#view').onclick = e => {
      const m = e.target.closest('[data-month]');
      if (m) { state.month = m.dataset.month; state.group = a.group_name || 'Усі'; if (a.section) state.section = a.section; return; }
      const gr = e.target.closest('[data-gid]');
      if (gr) { gradingForm([a], grs.find(x => String(x.id) === gr.dataset.gid)); return; }
      const we = e.target.closest('[data-wedit]');
      if (we) { weightForm(a, wl[Number(we.dataset.wedit)]); return; }
      const pt = e.target.closest('[data-i]');
      if (pt && wl.length > 1) {
        const i = Number(pt.dataset.i), w = wl[i], prev = wl[i - 1];
        const diff = prev ? w.kg - prev.kg : 0;
        $('#wcap').innerHTML = `<b style="color:var(--ink)">${fmtKg(w.kg)}</b> · ${fmtDate(w.date)} ${w.date.slice(0, 4)}` +
          (prev && diff ? ` · ${diff > 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')} кг` : '') +
          ` · <button type="button" class="linkbtn" data-wedit="${i}">змінити</button>`;
        document.querySelectorAll('.wchart .pt').forEach(c => c.classList.toggle('on', c.dataset.i === String(i)));
      }
    };
  }

  // ----- Доступ до застосунку: хто привʼязаний + посилання-запрошення -----
  async function drawAccess(a) {
    const box = $('#accessBox'); if (!box) return;
    const [links, inv] = await Promise.all([
      db.from('member_athletes').select('email').eq('athlete_id', a.id),
      db.from('invites').select('code').limit(1),
    ]);
    if (inv.error || links.error) { box.innerHTML = sqlCard('Запрошення за посиланням', ACCESS_SQL); return; }
    const emails = (links.data || []).map(l => l.email);
    const people = emails.length ? await q(db.from('members').select('email, full_name, role').in('email', emails)) : [];
    box.innerHTML = `${people.length ? people.map(m => `<div style="margin-bottom:6px">
        ${m.role === 'athlete' ? '🥋' : '👪'} <b>${esc(m.full_name)}</b> <span class="muted small">· ${ROLES[m.role] || m.role} · ${esc(m.email)}</span></div>`).join('')
        : '<p class="muted small" style="margin:0 0 8px">Ще ніхто не має доступу до цієї картки.</p>'}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button type="button" class="btn light sm" data-invite="parent">👪 Запросити батьків</button>
        <button type="button" class="btn light sm" data-invite="athlete">🥋 Запросити спортсмена</button>
      </div>`;
    box.onclick = e => { const b = e.target.closest('[data-invite]'); if (b) makeInvite(a, b.dataset.invite); };
  }
  async function makeInvite(a, role) {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const rnd = crypto.getRandomValues(new Uint32Array(8));
    const code = [...rnd].map(n => abc[n % abc.length]).join('');
    try { await q(db.from('invites').insert({ code, athlete_id: a.id, role, uses_left: role === 'parent' ? 2 : 1 })); }
    catch (e) { return; }
    const link = location.origin + location.pathname + '#join/' + code;
    const who = role === 'parent' ? 'батьків' : 'спортсмена';
    const first = firstNameOf(a.full_name);
    const text = role === 'parent'
      ? `Вітаю! Це застосунок нашої команди Ferents Team. Тут ви бачитимете відвідування ${first}, пояси, рейтинг і події. Відкрийте посилання і зареєструйтесь:\n${link}`
      : `Привіт! Це застосунок Ferents Team: розклад, завдання на тренування, відео і чат команди. Відкрий посилання і зареєструйся:\n${link}`;
    const dlg = $('#dlg');
    dlg.innerHTML = `<form><h3>Запрошення для ${who}</h3>
      <p class="muted small" style="margin:4px 0 8px">${esc(a.full_name)} · діє 30 днів · ${role === 'parent' ? 'для 2 людей (мама й тато)' : 'для 1 людини'}</p>
      <textarea readonly rows="5" style="width:100%">${esc(text)}</textarea>
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Закрити</button>
        ${navigator.share ? '<button type="button" class="btn light" data-act="share">Надіслати…</button>' : ''}
        <button type="button" class="btn" data-act="copy">Скопіювати</button></div></form>`;
    dlg.querySelector('form').onclick = async e => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'cancel') dlg.close();
      if (act === 'copy') copyText(text, 'Скопійовано — вставте у Viber чи Telegram');
      if (act === 'share') { try { await navigator.share({ text }); } catch (err) {} }
    };
    dlg.showModal();
  }

  // Запис ваги спортсмена (нова або виправлення наявної)
  function weightForm(a, w) {
    openForm({
      title: (w ? 'Виправити вагу: ' : 'Вага: ') + a.full_name,
      values: w ? { weight: w.kg, date: w.date } : { date: today() },
      fields: [
        { name: 'weight', label: 'Вага, кг', type: 'number', required: true, attrs: 'min="10" max="200" step="0.1" inputmode="decimal" autofocus' },

      },

  // ----- Атестація (додається зі сторінки спортсмена) -----
  function gradingForm(ath, g) {
    const options = ath.filter(a => isActive(a) || (g && String(a.id) === String(g.athlete_id)))
      .filter(a => g || ath.length === 1 || inFilter(a))
      .map(a => [a.id, a.full_name + (a.belt ? ` (зараз: ${a.belt})` : '')]);
    const numericId = ath.length && typeof ath[0].id === 'number';
    openForm({
      title: g ? 'Редагувати атестацію' : 'Нова атестація',
      values: g ? { ...g, passed: g.passed ? 'yes' : 'no' }
                : { date: today(), passed: 'yes', ...(ath.length === 1 ? { athlete_id: ath[0].id, belt: nextBelt(ath[0].belt) } : {}) },
      fields: [
        { name: 'athlete_id', label: 'Спортсмен', type: 'select', options, required: true, cast: numericId ? 'number' : '' },
        { name: 'date', label: 'Дата атестації', type: 'date', required: true },
        { name: 'belt', label: 'На який пояс / кю', type: 'select', required: true, options: beltOptions(g && g.belt) },
        { name: 'passed', label: 'Результат', type: 'select', required: true, options: [['yes', 'Здав'], ['no', 'Не здав']] },
        { name: 'note', label: 'Примітка (екзаменатор, оцінка…)' },
      ],
      extra: 'Якщо спортсмен здав, його пояс у картці оновиться автоматично.',
      onSave: async obj => {
        obj.passed = obj.passed === 'yes';
        if (g) await q(db.from('gradings').update(obj).eq('id', g.id));
        else await q(db.from('gradings').insert(obj));
        if (obj.passed) {
          // пояс у картці = пояс з найсвіжішої успішної атестації
          const last = await q(db.from('gradings').select('belt').eq('athlete_id', obj.athlete_id)
            .eq('passed', true).order('date', { ascending: false }).limit(1));
          if (last[0]) await q(db.from('athletes').update({ belt: last[0].belt }).eq('id', obj.athlete_id));
        }
      },
      onDelete: g ? () => q(db.from('gradings').delete().eq('id', g.id)) : null,
      onUndo: g ? () => { const { id, ...rest } = g; return q(db.from('gradings').insert(rest)); } : null,
    });
    // Для нової атестації: при виборі спортсмена одразу підставляємо наступний пояс
    if (!g) {
      const sel = $('#dlg [name=athlete_id]'), belt = $('#dlg [name=belt]');
      sel.onchange = () => {
        const a = ath.find(x => String(x.id) === sel.value);
        if (a) belt.value = nextBelt(a.belt);
      };
    }
  }

  // ----- Відвідування -----
  async function attendanceView() {
    setActions('');
    const monthStart = state.date.slice(0, 7) + '-01';
    const monthEnd = shiftMonth(state.date.slice(0, 7), 1) + '-01';

    const [ath, marks0, monthMarks0] = await Promise.all([
      q(db.from('athletes').select('*').order('full_name')),
      q(db.from('attendance').select('athlete_id, date, present').eq('date', state.date)),
      q(db.from('attendance').select('athlete_id, date').eq('present', true).gte('date', monthStart).lt('date', monthEnd)),
    ]);
    const marks = withPending('attendance', marks0, r => r.date === state.date);
    const monthMarks = withPending('attendance', monthMarks0, r => r.date >= monthStart && r.date < monthEnd).filter(m => m.present !== false);
    const waiting = new Set(withPending('attendance', [], r => r.date === state.date).map(m => String(m.athlete_id)));
    noteSection(ath);
    const rows = ath.filter(a => isActive(a) && inFilter(a));
    const byId = new Map(rows.map(a => [String(a.id), a]));
    const present = new Set(marks.filter(m => m.present).map(m => String(m.athlete_id)));

    $('#view').innerHTML = `
      <div class="bar">
        <button class="btn light sq" data-shift="-1" aria-label="Попередній день">‹</button>
        <label class="picker"><span>${fmtDate(state.date, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })}</span>
          <input type="date" id="attDate" value="${state.date}" aria-label="Обрати дату"></label>
        <button class="btn light sq" data-shift="1" aria-label="Наступний день">›</button>
      </div>
      ${chips(true)}
      <p class="summary" id="attSum"></p>
      <div class="list" id="attList">
        ${rows.map(a => `
          <label class="row tick">
            <span><strong>${beltTag(a.belt)}${esc(a.full_name)}</strong><span>${esc([groupLabel(a), beltShort(a.belt)].filter(Boolean).join(' · '))}<i class="wait" ${waiting.has(String(a.id)) ? '' : 'hidden'}> · ⏳ чекає відправки</i></span></span>
            <input type="checkbox" data-id="${esc(a.id)}" ${present.has(String(a.id)) ? 'checked' : ''}>
          </label>`).join('') || '<div class="empty">У цій групі немає активних спортсменів</div>'}
      </div>
      ${rows.length ? '<button class="btn light wide" id="allBtn">Відмітити всіх присутніми</button>' : ''}
      <h3>${fmtMonth(state.date.slice(0, 7))}: відвідування</h3>
      <div class="list" id="stats"></div>`;

    const updateSum = () => {
      const n = $('#attList').querySelectorAll('input:checked').length;
      $('#attSum').innerHTML = `${fmtDate(state.date, { weekday: 'long', day: 'numeric', month: 'long' })} · присутні <b>${n}</b> з ${rows.length}`;
    };
    updateSum();

    // Статистика за місяць
    const counts = new Map();
    const days = new Set();
    monthMarks.forEach(m => {
      if (!byId.has(String(m.athlete_id))) return;
      counts.set(String(m.athlete_id), (counts.get(String(m.athlete_id)) || 0) + 1);
      days.add(m.date);
    });
    const ranked = rows.map(a => [a, counts.get(String(a.id)) || 0]).sort((x, y) => y[1] - x[1]);
    $('#stats').innerHTML = ranked.length
      ? `<div class="row" style="cursor:default"><span class="muted small">Днів з відмітками: ${days.size}</span></div>` +
        ranked.map(([a, n]) => `<a class="row" href="#athlete/${encodeURIComponent(a.id)}"><span>${esc(a.full_name)}</span><span class="badge ${n ? 'gold' : 'bad'}">${n}</span></a>`).join('')
      : '<div class="empty">Немає даних</div>';

    const save = async (ids, isPresent) => {
      const payload = ids.map(id => ({ athlete_id: byId.get(id).id, date: state.date, present: isPresent }));
      const res = await write('attendance', 'upsert', payload);
      ids.forEach(id => {
        const w = $('#attList').querySelector(`input[data-id="${id}"]`)?.closest('.row')?.querySelector('.wait');
        if (w) w.hidden = res !== 'queued';
      });
      return res;
    };

    $('#attList').onchange = async e => {
      const box = e.target;
      if (!box.dataset.id) return;
      updateSum();
      try { await save([box.dataset.id], box.checked); }
      catch (err) { box.checked = !box.checked; updateSum(); }
    };
    const allBtn = $('#allBtn');
    if (allBtn) allBtn.onclick = async () => {
      allBtn.disabled = true;
      try { const r = await save(rows.map(a => String(a.id)), true); toast(r === 'queued' ? '⏳ Всіх відмічено на телефоні — відправлю, коли буде інтернет' : 'Всіх відмічено'); render(); }
      catch (err) { allBtn.disabled = false; }
    };
    $('#attDate').onchange = e => { if (e.target.value) { state.date = e.target.value; render(); } };
    document.querySelectorAll('[data-shift]').forEach(b =>
      b.onclick = () => { state.date = shiftDate(state.date, Number(b.dataset.shift)); render(); });
  }

  // ----- Оплати -----
  async function paymentsView() {
    setActions('');
    const monthStart = state.month + '-01';
    const waitPay = pendingKeys('payments');
    let reminded = {};
    try { reminded = JSON.parse(localStorage.getItem(remindedKey(state.month)) || '{}'); } catch (e) {}
    const [ath, pays] = await Promise.all([
      q(db.from('athletes').select('*').order('full_name')),
      q(db.from('payments').select('*').eq('month', monthStart)),
    ]).then(([a, p]) => [a, withPending('payments', p, r => r.month === monthStart)]);
    noteSection(ath);
    const rows = ath.filter(a => isActive(a) && inFilter(a));
    const payOf = new Map(pays.map(p => [String(p.athlete_id), p]));
    // Підсумок окремо по кожній секції, коли вибрано обидві
    const secSum = state.hasSection && state.section === 'Усі' ? SECTIONS.map(x => {
      const inS = rows.filter(a => a.section === x), paidS = inS.filter(a => payOf.has(String(a.id)));
      const sum = paidS.reduce((t, a) => t + Number(payOf.get(String(a.id)).amount || 0), 0);
      return inS.length ? `<div class="sum-sec"><b>${x}</b><span>оплатили <b>${paidS.length}</b> з ${inS.length} · ${fmtMoney(sum)}</span></div>` : '';
    }).join('') : '';
    const secTitle = state.hasSection && state.section !== 'Усі' ? state.section + ' · ' : '';
    const paidRows = rows.filter(a => payOf.has(String(a.id)));
    const debtors = rows.filter(a => !payOf.has(String(a.id)));
    const total = paidRows.reduce((s, a) => s + Number(payOf.get(String(a.id)).amount || 0), 0);

    $('#view').innerHTML = `
      <div class="bar">
        <button class="btn light sq" data-mshift="-1" aria-label="Попередній місяць">‹</button>
        <div class="picker"><span>${fmtMonth(state.month)}</span></div>
        <button class="btn light sq" data-mshift="1" aria-label="Наступний місяць">›</button>
      </div>
      ${state.hasSection === false ? sectionSetupCard() : ''}
      ${chips(true)}
      <p class="summary">${secTitle}${fmtMonth(state.month)} · оплатили <b>${paidRows.length}</b> з ${rows.length} · ${fmtMoney(total)}</p>
      ${secSum ? `<div class="panel" style="padding:4px 16px;margin-bottom:10px">${secSum}</div>` : ''}
      <div class="list" id="payList">
        ${[...debtors, ...paidRows].map(a => {
          const p = payOf.get(String(a.id));
          return `<button class="row" data-id="${esc(a.id)}">
            <div><strong>${esc(a.full_name)}</strong><span>${esc(groupLabel(a))}${p && p.note ? ' · ' + esc(p.note) : ''}${!p && reminded[a.id] ? ` · <i class="rem-done">📨 нагадано ${esc(reminded[a.id])}</i>` : ''}</span></div>
            ${waitPay.has(opKey('payments', { athlete_id: a.id, month: monthStart })) ? '<span class="badge gold">⏳</span>' : ''}
            ${p ? `<span class="badge ok">✓ ${fmtMoney(p.amount)} · ${fmtDate(p.paid_at, { day: '2-digit', month: '2-digit' })}</span>`
                : '<span class="badge bad">Не оплачено</span>'}
          </button>`;
        }).join('') || '<div class="empty">У цій групі немає активних спортсменів</div>'}
      </div>
      ${debtors.length ? `<button class="btn wide" id="remindBtn">📨 Нагадати батькам (${debtors.length})</button>
        <button class="btn light wide" id="copyDebtors" style="margin-top:8px">Скопіювати список боржників</button>` : ''}`;
    const rb = $('#remindBtn');
    if (rb) rb.onclick = () => remindSheet(debtors, state.month);

    $('#payList').onclick = e => {
      const r = e.target.closest('[data-id]');
      if (!r) return;
      const a = rows.find(x => String(x.id) === r.dataset.id);
      const p = payOf.get(r.dataset.id);
      let lastAmount = '';
      try { lastAmount = localStorage.getItem('ft_last_amount') || ''; } catch (err) {}
      openForm({
        title: `${a.full_name} — ${fmtMonth(state.month).toLowerCase()}`,
        values: p || { amount: lastAmount, paid_at: today() },
        fields: [
          { name: 'amount', label: 'Сума, грн', type: 'number', required: true, attrs: 'min="0" step="1" inputmode="numeric"' },
          { name: 'paid_at', label: 'Дата оплати', type: 'date', required: true },
          { name: 'note', label: 'Примітка (готівка, картка, знижка…)' },
