
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ferents Team">
  <title>Ferents Team Training</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 20px;
      border-bottom: 4px solid #d1a84b;
    }

    header p { color: #d1d5db; margin-bottom: 0; }
    header h1 { margin: 10px 0; font-size: 30px; }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 14px;
      background: white;
      padding: 20px;
      margin: 12px 0;
      color: #111827;
      font: inherit;
      box-shadow: 0 2px 8px #0000000d;
      cursor: pointer;
    }

    .card strong { display: block; font-size: 18px; }

    .card span {
      display: block;
      color: #6b7280;
      margin-top: 7px;
      font-size: 14px;
    }

    .card:active { background: #e5e7eb; }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <p>FERENTS TEAM</p>
    <h1>Training</h1>
    <p>Дисципліна. Праця. Результат.</p>
  </header>

  <main>
    <h2>Особистий кабінет</h2>

   <button class="card" onclick="window.openAthletes()">
  <strong>Мої спортсмени</strong>
  <span>Перегляд і додавання спортсменів</span>
</button>

<section id="athletesPanel" hidden>
  <h2>Мої спортсмени</h2>

  <form id="athleteForm">
    <input
      id="athleteName"
      type="text"
      placeholder="Ім'я та прізвище спортсмена"
      required
    >

    <select id="athleteGroup" required>
      <option value="">Оберіть групу</option>
      <option value="Молодша">Молодша</option>
      <option value="Середня">Середня</option>
      <option value="Старша">Старша</option>
    </select>

    <input
      id="athleteYear"
      type="number"
      placeholder="Рік народження"
      min="2000"
      max="2026"
    >

    <button type="submit">Додати спортсмена</button>
  </form>

  <p id="athleteMessage"></p>
  <ul id="athletesList"></ul>
  <button type="button" onclick="closeAthletes()">Назад</button>
</section>

    <button class="card" onclick="alert('Розклад тренувань підключимо наступним етапом.')">
      <strong>Розклад тренувань</strong>
      <span>Молодша · Середня · Старша</span>
    </button>

    <button class="card" onclick="alert('Відвідування підключимо наступним етапом.')">
      <strong>Відвідування</strong>
      <span>Історія тренувань</span>
    </button>

    <button class="card" onclick="alert('Оплати підключимо наступним етапом.')">
      <strong>Оплати</strong>
      <span>Статус та історія платежів</span>
    </button>

    <button class="card" onclick="alert('Календар подій підключимо наступним етапом.')">
      <strong>Календар подій</strong>
      <span>Усі майбутні події команди</span>
    </button>

    <button class="card" onclick="alert('Матеріали підключимо наступним етапом.')">
      <strong>Матеріали</strong>
      <span>Відео, посилання та корисна інформація</span>
    </button>
  </main>

  <footer>
    FERENTS TEAM TRAINING · 2026
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = 'https://ntmtqkioqcfjxvaxyjge.supabase.co;
const SUPABASE_KEY = 'sb_publishable_wv9UNSUZvcVT7_orJkec3A_475LADpx';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

console.log('Supabase client initialized');
    
window.openAthletes = async function() {
  document.getElementById('athletesPanel').hidden = false;
  await loadAthletes();
}

function closeAthletes() {
  document.getElementById('athletesPanel').hidden = true;
}

async function loadAthletes() {
  const message = document.getElementById('athleteMessage');
  const list = document.getElementById('athletesList');

  message.textContent = 'Завантаження...';
  list.replaceChildren();

  const { data, error } = await supabaseClient
    .from('athletes')
    .select('id, full_name, group_name, birth_year')
    .order('full_name');

  if (error) {
    message.textContent = 'Помилка завантаження: ' + error.message;
    return;
  }

  message.textContent = data.length
    ? 'Спортсменів у базі: ' + data.length
    : 'Список поки порожній';

  data.forEach((athlete) => {
    const item = document.createElement('li');
    item.textContent =
      athlete.full_name + ' — ' +
      (athlete.group_name || 'Група не вказана') +
      (athlete.birth_year ? ', ' + athlete.birth_year : '');
    list.appendChild(item);
  });
}

document.getElementById('athleteForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const message = document.getElementById('athleteMessage');
  const full_name = document.getElementById('athleteName').value.trim();
  const group_name = document.getElementById('athleteGroup').value;
  const yearValue = document.getElementById('athleteYear').value;
  const birth_year = yearValue ? Number(yearValue) : null;

  message.textContent = 'Збереження...';

  const { error } = await supabaseClient
    .from('athletes')
    .insert([{ full_name, group_name, birth_year }]);

  if (error) {
    message.textContent = 'Не вдалося зберегти: ' + error.message;
    return;
  }

  document.getElementById('athleteForm').reset();
  message.textContent = 'Спортсмена успішно додано!';
  await loadAthletes();
});
