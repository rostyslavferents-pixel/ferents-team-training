  async function handleRequest(btn, reqs, ath) {
    const box = btn.closest('[data-req]');
    const r = reqs.find(x => String(x.id) === box.dataset.req);
    if (!r) return;
    if (btn.matches('[data-req-no]')) {

    btn.disabled = true;

      await q(db.from('member_athletes').upsert({ email: r.email, athlete_id: numeric ? Number(id) : id }, { onConflict: 'email,athlete_id', ignoreDuplicates: true }));
      await q(db.from('join_requests').delete().eq('id', r.id));
      const a = ath.find(x => String(x.id) === id);

  // ----- Заяви-анкети від батьків (тільки тренер) -----
  const APPLICATIONS_SQL = `-- Заяви-анкети від батьків (сторінка zayava.html, онлайн-підпис)
-- Батьки лише надсилають заяву без входу; читати й змінювати заяви може тільки тренер.
create table if not exists public.applications (
  id          bigint generated always as identity primary key,
  created_at  timestamptz not null default now(),
  child_name  text not null,
  section     text,
  group_name  text,
  signer_name text not null,
  data        jsonb not null,
  consents    jsonb not null,
  signature   text not null,
  status      text not null default 'new' check (status in ('new','accepted','archived')),
  athlete_id  text
);
alter table public.applications enable row level security;
drop policy if exists coach_all on public.applications;
create policy coach_all on public.applications for all to authenticated
  using (public.is_coach()) with check (public.is_coach());
revoke all on public.applications from anon;

-- Надіслати заяву (доступно без входу, лише додати — не читати)
create or replace function public.submit_application(p jsonb)
returns bigint language plpgsql security definer set search_path = public as $$
declare
  d   jsonb := coalesce(p -> 'data', '{}'::jsonb);
  c   jsonb := coalesce(p -> 'consents', '{}'::jsonb);
  sig text  := coalesce(p ->> 'signature', '');
  nm  text  := trim(coalesce(d ->> 'surname', '') || ' ' || coalesce(d ->> 'name', ''));
  who text  := trim(coalesce(p ->> 'signer_name', ''));
  new_id bigint;
begin
  if length(nm) < 3 or length(nm) > 80 or length(who) < 3 or length(who) > 100 then raise exception 'bad_input'; end if;
  if length(d::text) > 12000 then raise exception 'too_long'; end if;
  if sig not like 'data:image/png;base64,%' or length(sig) > 300000 then raise exception 'bad_signature'; end if;
  if coalesce((c ->> 'health')::boolean, false) is not true
     or coalesce((c ->> 'rules')::boolean, false) is not true
     or coalesce((c ->> 'data')::boolean, false) is not true then raise exception 'no_consent'; end if;
  if (select count(*) from public.applications where created_at > now() - interval '10 minutes') >= 30 then
    raise exception 'too_many';
  end if;
  insert into public.applications (child_name, section, group_name, signer_name, data, consents, signature)
  values (nm, nullif(d ->> 'section', ''), nullif(d ->> 'group', ''), who, d,
          c || jsonb_build_object('signed_at', now()), sig)
  returning id into new_id;
  return new_id;
end $$;
revoke execute on function public.submit_application(jsonb) from public;
grant execute on function public.submit_application(jsonb) to anon, authenticated;

notify pgrst, 'reload schema';`;
  const APP_STATUS = { new: ['Нова', 'gold'], accepted: ['Прийнята', 'ok'], archived: ['В архіві', ''] };

        </button>`).join('') : `<div class="empty">${show === 'new' ? 'Нових заяв немає. Надішліть батькам посилання вище.' : 'Тут поки порожньо'}</div>`}</div>`;
    $('#appCopy').onclick = () => copyText(link, 'Посилання скопійовано');
    $('#appShare').onclick = async () => {

  // Чи є ця дитина вже серед спортсменів: прізвище та імʼя в будь-якому порядку (+ дата народження, якщо є в обох)
  function appMatch(a, athletes) {
    const d = a.data || {};
    const norm = s => String(s || '').toLowerCase().replace(/['’ʼ`]/g, '').replace(/\s+/g, ' ').trim();
    const n = norm([d.surname, d.name].filter(Boolean).join(' ') || a.child_name);
    const rev = n.split(' ').reverse().join(' ');
    const hits = athletes.filter(x => [n, rev].includes(norm(x.full_name)) &&
      !(d.birth && x.birth_date && String(x.birth_date).slice(0, 10) !== d.birth));
    return hits.length === 1 ? hits[0] : null;
  }
  function appSheet(a) {
    const d = a.data || {};
    const m = a._match;
    const parentLine = ['mother', 'father'].map(p => d[p + '_name'] && d[p + '_phone'] ? `${d[p + '_name']}, ${d[p + '_phone']}` : '').filter(Boolean).join('\n');
    const dlg = $('#confirm');
    dlg.innerHTML = `<div class="confirm-body"><h3>${esc(a.child_name)}</h3>
      <p>${esc([d.birth && 'Народження: ' + fmtDate(d.birth, { day: 'numeric', month: 'long', year: 'numeric' }), [a.section, a.group_name].filter(Boolean).join(' · '), parentLine, d.health && 'Здоровʼя: ' + d.health].filter(Boolean).join('\n'))}</p>
      <div class="btns">
        <a class="btn" href="${ROOTP}zayava.html?id=${encodeURIComponent(a.id)}">Відкрити заяву</a>
        <a class="btn light" href="zayava.html?id=${encodeURIComponent(a.id)}&pdf=1">Завантажити PDF</a>
        ${a.athlete_id ? `<a class="btn light" href="#athlete/${encodeURIComponent(a.athlete_id)}">Картка спортсмена</a>`
          : m ? `<div class="info" style="margin:0;text-align:left">Ця дитина вже є в команді: <b>${esc(m.full_name)}</b>${[m.section, m.group_name].filter(Boolean).length ? ' (' + esc([m.section, m.group_name].filter(Boolean).join(' · ')) + ')' : ''}. Заява доповнить її картку, нова картка не створюється.</div>
              <button type="button" class="btn" data-act="link">Оновити картку «${esc(m.full_name)}»</button>
              <button type="button" class="btn light" data-act="athlete">Це інша дитина — створити нову картку</button>`
          : `<button type="button" class="btn light" data-act="athlete">Додати в спортсмени</button>`}
        ${a.status !== 'accepted' ? '<button type="button" class="btn light" data-act="accepted">Позначити прийнятою</button>' : ''}
        ${a.status !== 'archived' ? '<button type="button" class="btn light" data-act="archived">Перенести в архів</button>' : ''}
        <button type="button" class="btn danger" data-act="delete">Видалити заяву</button>
        <button type="button" class="btn light" data-no>Закрити</button>
      </div></div>`;
    dlg.querySelector('[data-no]').onclick = () => dlg.close();
    dlg.querySelectorAll('a.btn').forEach(x => x.addEventListener('click', () => dlg.close()));
    dlg.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const act = b.dataset.act;
      b.disabled = true;
      try {
        if (act === 'link') {
          // Доповнюємо лише порожні поля картки, нічого з уже записаного не перезаписуємо
          const parent = d.mother_name && d.mother_phone ? 'mother' : 'father';
          const upd = {};
          if (!m.birth_date && d.birth) { upd.birth_date = d.birth; upd.birth_year = Number(d.birth.slice(0, 4)); }
          if (!m.belt && d.belt) upd.belt = d.belt;
          if (!m.parent_name && d[parent + '_name']) upd.parent_name = d[parent + '_name'];
          if (!m.phone && d[parent + '_phone']) upd.phone = d[parent + '_phone'];
          if ('section' in m && !m.section && d.section) upd.section = d.section;
          const health = d.health && d.health.toLowerCase() !== 'немає' ? 'Здоровʼя: ' + d.health : '';
          const add = [health, 'Заява № ' + a.id + ' підписана ' + fmtDate(a.created_at.slice(0, 10), { day: 'numeric', month: 'long', year: 'numeric' })]
            .filter(x => x && !String(m.notes || '').includes(x));
          if (add.length) upd.notes = [m.notes, ...add].filter(Boolean).join('\n');
          if (Object.keys(upd).length) await q(db.from('athletes').update(upd).eq('id', m.id));
          await q(db.from('applications').update({ athlete_id: String(m.id), status: 'accepted' }).eq('id', a.id));
          dlg.close(); toast('Картку оновлено: ' + m.full_name); render();
        } else if (act === 'athlete') {
          const name = [d.surname, d.name].filter(Boolean).join(' ').trim() || a.child_name;
          const parent = d.mother_name && d.mother_phone ? 'mother' : 'father';
          const obj = {
            full_name: name, birth_date: d.birth || null, birth_year: d.birth ? Number(d.birth.slice(0, 4)) : null,
            group_name: GROUPS.includes(d.group) ? d.group : (GROUPS[0] || null),
            belt: d.belt || null, parent_name: d[parent + '_name'] || null, phone: d[parent + '_phone'] || null,
            notes: [d.health && d.health.toLowerCase() !== 'немає' ? 'Здоровʼя: ' + d.health : '', 'З заяви № ' + a.id].filter(Boolean).join('\n'),
          };
          if (d.section) obj.section = d.section;
          let ins = await db.from('athletes').insert(obj).select('id').single();
          if (ins.error && /section/.test(ins.error.message || '')) { delete obj.section; ins = await db.from('athletes').insert(obj).select('id').single(); }
          if (ins.error) throw ins.error;
          await q(db.from('applications').update({ athlete_id: String(ins.data.id), status: 'accepted' }).eq('id', a.id));
          dlg.close(); toast('Додано в спортсмени: ' + name); render();
        } else if (act === 'delete') {
          dlg.close();
          if (!await confirmSheet({ title: 'Видалити заяву?', text: 'Підписану заяву ' + a.child_name + ' буде видалено назавжди.' })) return;
          await q(db.from('applications').delete().eq('id', a.id));
          toast('Заяву видалено'); render();
        } else {
          await q(db.from('applications').update({ status: act }).eq('id', a.id));
          dlg.close(); toast(act === 'accepted' ? 'Заяву прийнято' : 'Заяву перенесено в архів'); render();
        }
      } catch (err) { b.disabled = false; toast('Помилка: ' + (err.message || err), true); }
    });
    dlg.showModal();
  }

        <b>батьки</b> — свою дитину (відвідування, пояси, вагу), рейтинг і події; <b>спортсмени</b> — ще розклад і завдання своєї групи, відео та чат. Тренери бачать усе.<br>

      <div class="list">${list.map(m => {

      if (e.target.closest('#teamShareBtn')) {

        (async () => {
          if (navigator.share) { try { await navigator.share({ title: 'Ferents Team', text, url: teamUrl }); return; } catch (err) { if (err && err.name === 'AbortError') return; } }
          copyText(text + teamUrl, 'Текст із посиланням скопійовано');
        })();
        return;
      }
      if (e.target.closest('#reqSqlBtn')) { copyText(REQUEST_PUSH_SQL, 'SQL скопійовано — вставте в Supabase → SQL Editor'); return; }
      if (e.target.closest('#reqFnBtn')) { copyText(NOTIFY_FN_CODE, 'Код скопійовано — вставте в Edge Functions → notify → Code'); return; }

      const r = e.target.closest('.row[data-email]');
      if (r) memberForm(list.find(m => m.email === r.dataset.email), ath, kidsOf(r.dataset.email), linksOk);
    };

  function memberForm(m, ath = [], kids = [], linksOk = false) {
    const chosen = new Set(kids.map(String));
    const people = ath.filter(a => a.active !== false || chosen.has(String(a.id)));
    const picker = linksOk ? `<div style="margin-top:4px"><b>Чия дитина / хто це</b>
        <p class="muted small" style="margin:2px 0 6px">Батьки й спортсмен бачитимуть лише вибраних. Можна кількох (брати, сестри).</p>
        <input type="search" id="kSearch" placeholder="Пошук за імʼям">
        <div class="list pick-list" id="kList" style="max-height:260px;overflow:auto"></div></div>` : '';
    openForm({
      title: m ? m.full_name : 'Новий учасник',
      values: m || { role: 'parent' },
      fields: [
        { name: 'full_name', label: 'Імʼя (так буде видно в чаті)', required: true, attrs: 'placeholder="напр. Олена (мама Івана)"' },
        { name: 'email', label: 'Email', type: 'email', required: true },
        { name: 'role', label: 'Роль', type: 'select', required: true, options: Object.entries(ROLES) },
      ],
      extra: picker,
      onSave: async obj => {
        obj.email = obj.email.toLowerCase();
        if (m) await q(db.from('members').update(obj).eq('email', m.email));
        else await q(db.from('members').insert(obj));
        if (linksOk) {
          await q(db.from('member_athletes').delete().eq('email', obj.email));
          const ids = [...chosen];
          if (ids.length && obj.role !== 'coach') {
            const numeric = ath.length && typeof ath[0].id === 'number';
            await q(db.from('member_athletes').insert(ids.map(id => ({ email: obj.email, athlete_id: numeric ? Number(id) : id }))));
          }
        }
      },
      onDelete: m ? () => q(db.from('members').delete().eq('email', m.email)) : null,
      deleteText: 'Забрати доступ у цієї людини?',
    });
    if (!linksOk) return;
    let search = '';
    const draw = () => {
      const s = search.toLowerCase();
      const rows = people.filter(a => chosen.has(String(a.id)) || !s || a.full_name.toLowerCase().includes(s))
        .sort((x, y) => (chosen.has(String(y.id)) - chosen.has(String(x.id))) || x.full_name.localeCompare(y.full_name));
      $('#kList').innerHTML = rows.map(a => `<label class="row tick">
          <span><strong>${esc(a.full_name)}</strong><span>${esc([a.section, a.group_name].filter(Boolean).join(' · '))}</span></span>
          <input type="checkbox" data-kid="${esc(a.id)}" ${chosen.has(String(a.id)) ? 'checked' : ''}></label>`).join('') || '<div class="empty">Нікого не знайдено</div>';
    };
    $('#kSearch').oninput = e => { search = e.target.value; draw(); };
    $('#kSearch').onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
    $('#kList').onchange = e => {
      const b = e.target.closest('[data-kid]'); if (!b) return;
      if (b.checked) chosen.add(b.dataset.kid); else chosen.delete(b.dataset.kid);
    };
    draw();
  }

        <p class="muted small">Від найнижчого до найвищого. Колір береться зі слова (білий, синій, зелений…), «зі смужкою» додає смужку.</p></div>

      <div class="set-block"><h3>${icon('eye')}Хто що бачить</h3>
        <table class="acc"><thead><tr><th style="text-align:left">Розділ</th><th>Батьки</th><th>Спортсмени</th></tr></thead><tbody>
        ${ACCESS_PARTS.map(([k, l]) => `<tr><td>${icon(ACCESS_IC[k])}${l}</td>
          <td class="c"><input type="checkbox" data-acc="parent" data-part="${k}" ${T.access.parent[k] ? 'checked' : ''} aria-label="${esc(l)} — батьки"></td>
          <td class="c"><input type="checkbox" data-acc="athlete" data-part="${k}" ${T.access.athlete[k] ? 'checked' : ''} aria-label="${esc(l)} — спортсмени"></td></tr>`).join('')}
        </tbody></table>
        <p class="muted small">Головна, картка своєї дитини та налаштування видно завжди. Списки груп і оплати бачите тільки ви.</p></div>
      <button type="button" class="btn wide team-save" id="tSave">${icon('save')}Зберегти</button>`;

    $('#view').onclick = e => {
      const add = e.target.closest('[data-add]');
      if (add) {
        const box = $(`[data-list="${add.dataset.add}"]`);
        box.insertAdjacentHTML('beforeend', rowEd('', '', add.dataset.ph));
        box.lastElementChild.querySelector('input').focus();
        return;
      }
      const row = e.target.closest('.trow');
      if (!row) return;
      if (e.target.closest('[data-del]')) row.remove();
      else if (e.target.closest('[data-up]') && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
    };

    $('#tSave').onclick = async () => {
      const btn = $('#tSave');
      const read = key => [...document.querySelectorAll(`[data-list="${key}"] input`)]
        .map(i => ({ v: i.value.trim().replace(/\s+/g, ' '), old: i.dataset.old })).filter(x => x.v);
      const lists = { sections: read('sections'), groups: read('groups'), belts: read('belts') };
      for (const [k, name] of [['sections', 'секцію'], ['groups', 'групу'], ['belts', 'пояс']]) {
        if (!lists[k].length) { toast(`Додайте хоча б одну ${name}`, true); return; }
        const vals = lists[k].map(x => x.v.toLowerCase());
        if (new Set(vals).size !== vals.length) { toast(`Дві однакові назви в «${{ sections: 'Секції', groups: 'Групи', belts: 'Пояси' }[k]}»`, true); return; }
      }
      const access = { parent: {}, athlete: {} };
      document.querySelectorAll('[data-acc]').forEach(c => { access[c.dataset.acc][c.dataset.part] = c.checked; });
      const value = {
        brand: $('#tBrand').value.trim(), title: $('#tTitle').value.trim(), motto: $('#tMotto').value.trim(),
        welcome: $('#tWelcome').value.trim() || TEAM_DEFAULTS.welcome,
        sections: lists.sections.map(x => x.v), groups: lists.groups.map(x => x.v), belts: lists.belts.map(x => x.v),
        amount: $('#tAmount').value.trim(), access,
      };
      const renames = k => lists[k].filter(x => x.old && x.old !== x.v);
      const ren = { sections: renames('sections'), groups: renames('groups'), belts: renames('belts') };
      const nRen = ren.sections.length + ren.groups.length + ren.belts.length;
      if (nRen && !(await confirmSheet({ title: 'Перейменувати?', ok: 'Так, перейменувати', danger: false,
        text: [...ren.sections, ...ren.groups, ...ren.belts].map(x => `${x.old} → ${x.v}`).join(' · ') + '. Це оновить усі записи з цією назвою.' }))) return;
      btn.disabled = true; btn.textContent = '⏳ Зберігаю…';
      try {
        const { error } = await db.from('team_settings').upsert({ key: 'team', value, updated_at: new Date().toISOString() });
        if (error) throw error;
        // Перейменування в усіх записах (таблиць, яких ще немає, просто пропускаємо)
        const upd = async (table, col, from, to) => { const r = await db.from(table).update({ [col]: to }).eq(col, from); if (r.error && table === 'athletes') throw r.error; };
        for (const x of ren.sections) for (const t of ['athletes', 'schedule', 'announcements']) await upd(t, 'section', x.old, x.v);
        for (const x of ren.groups) for (const t of ['athletes', 'schedule', 'training_plans', 'announcements']) await upd(t, 'group_name', x.old, x.v);
        for (const x of ren.belts) for (const t of ['athletes', 'gradings']) await upd(t, 'belt', x.old, x.v);
        if (state.group !== 'Усі' && !value.groups.includes(state.group)) state.group = 'Усі';
        if (state.section && state.section !== 'Усі' && !value.sections.includes(state.section)) state.section = 'Усі';
        await loadTeam();
        toast('Збережено для всіх');
        teamView();
      } catch (e) {
        btn.disabled = false; btn.innerHTML = icon('save') + 'Зберегти';
        toast(isNetErr(e) ? 'Немає інтернету' : 'Не вдалося: ' + (e.message || e), true);
      }
    };
  }

  // ===== Резервна копія в Excel (.xlsx без сторонніх бібліотек) =====
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  // ZIP без стиснення (метод «store») — xlsx саме так і пакується
  function zipStore(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    let off = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
        .forEach(([o, v, s]) => s === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2],
       [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
        .forEach(([o, v, s]) => s === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, x) => s + x.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, off, 4], [20, 0, 2]]
      .forEach(([o, v, s]) => s === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  // sheets: [{ name, rows: [[заголовки], [значення…], …] }] → Blob .xlsx
  function makeXlsx(sheets) {
    const x = v => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
    const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const sheetXml = rows => {
      const widths = [];
      rows.forEach(r => r.forEach((v, i) => { widths[i] = Math.min(50, Math.max(widths[i] || 6, String(v ?? '').split('\n')[0].length + 2)); }));
      const data = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
        const ref = col(ci) + (ri + 1);
        if (v === null || v === undefined || v === '') return '';
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${ri ? '' : ' s="1"'}><v>${v}</v></c>`;
        return `<c r="${ref}" t="inlineStr"${ri ? '' : ' s="1"'}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
      }).join('')}</row>`).join('');
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
        `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${data}</sheetData></worksheet>`;
    };
    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${R}"><sheets>${sheets.map((s, i) => `<sheet name="${x(s.name.replace(/[\[\]:*?\/\\]/g, '').slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${R}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${R}/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s.rows) })),
    ];
    return zipStore(files);
  }
  // Усі рядки таблиці (Supabase віддає максимум 1000 за раз)
  async function fetchAll(table, select, order) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      let req = db.from(table).select(select).range(from, from + 999);
      if (order) req = req.order(order);
      const { data, error } = await req;
      if (error) return out.length ? out : null;
      out.push(...(data || []));
      if (!data || data.length < 1000) return out;
    }
  }
  async function saveFile(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }

  function topoOrder(deps) {
    const out = [], seen = new Set(), visit = (t, stack = new Set()) => {
      if (seen.has(t) || stack.has(t)) return; stack.add(t);
      (deps[t] || []).forEach(d => visit(d, stack)); seen.add(t); out.push(t);
    };
    Object.keys(deps).sort().forEach(t => visit(t));
    return out;
  }

  // ----- Додаток на телефоні: встановлення, робота без інтернету -----
  let installEvent = null;

  function installCard() {

  // Нова версія: перевіряємо при поверненні в додаток (не частіше, ніж раз на 5 хв)
  let lastCheck = 0;
  async function checkUpdate(force = false) {
    if (!navigator.onLine || (!force && Date.now() - lastCheck < 5 * 60e3)) return;
    lastCheck = Date.now();
    try {
      const html = await (await fetch('index.html?check=' + Date.now(), { cache: 'no-store' })).text();
      const m = html.match(/const APP_VERSION = '([^']+)'/);

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setTimeout(() => checkUpdate(true), 8000);

  // Потягни сторінку вниз, щоб оновити
  (function pullToRefresh() {
    const ind = $('#ptr');
    let y0 = null, dy = 0;
    const reset = () => { ind.style.transform = ''; ind.style.opacity = ''; ind.classList.remove('ready', 'spin'); };
    addEventListener('touchstart', e => {
      if (window.scrollY > 0 || !signedIn || document.querySelector('dialog[open]') || e.target.closest('.chat, .pick-list, input, textarea')) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    addEventListener('touchmove', e => {
      if (y0 === null) return;
      dy = (e.touches[0].clientY - y0) * 0.5;
      if (dy <= 0) { reset(); return; }
      const d = Math.min(dy, 90);
      ind.style.transform = `translate(-50%, ${d - 44}px) rotate(${d * 4}deg)`;
      ind.style.opacity = Math.min(1, d / 50);
      ind.classList.toggle('ready', dy > 70);
    }, { passive: true });
    addEventListener('touchend', async () => {
      if (y0 === null) return;
      y0 = null;
      if (dy > 70) {
        ind.classList.add('spin');
        ind.style.transform = 'translate(-50%, 20px)';
        try { await flushQueue(); await render(); } catch (e) {}
      }
      reset();
    });
  })();

  // =====================================================================
  //  ТАЙМЕР: інтервали, табата, EMOM, секундомір, зворотний відлік
  //  Бачать тренер і спортсмени. Налаштування зберігаються на телефоні.
  // =====================================================================
  const TM_KEY = 'ft-timer-v1';
  const TM_MODES = [['interval', 'Інтервали'], ['tabata', 'Табата'], ['emom', 'EMOM'], ['stopwatch', 'Секундомір'], ['countdown', 'Відлік']];
  const TM_DEF = {
    mode: 'interval', sound: true, snd: 'bell', vibro: true, prep: 10,
    interval: { work: 40, rest: 20, rounds: 8, sets: 1, setRest: 60 },
    tabata: { work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60 },
    emom: { every: 60, rounds: 10 },
    countdown: { time: 180 },
    presets: [],
  };
  // [поле, підпис, тип (t — час, n — кількість), мінімум, максимум, колір крапки]
  const TM_FIELDS = {
    interval: [['work', 'Робота', 't', 5, 3600, 'w'], ['rest', 'Відпочинок', 't', 0, 3600, 'r'], ['rounds', 'Раунди', 'n', 1, 99], ['sets', 'Сети', 'n', 1, 20], ['setRest', 'Відпочинок між сетами', 't', 0, 1800, 's']],
    tabata: [['work', 'Робота', 't', 5, 600, 'w'], ['rest', 'Відпочинок', 't', 0, 600, 'r'], ['rounds', 'Раунди', 'n', 1, 99], ['sets', 'Кількість табат', 'n', 1, 20], ['setRest', 'Пауза між табатами', 't', 0, 1800, 's']],
    emom: [['every', 'Кожні', 't', 10, 600, 'w'], ['rounds', 'Раундів', 'n', 1, 99]],
    countdown: [['time', 'Час', 't', 5, 5999, 'w']],
  };
  const TM_PH = { prep: 'Приготуйся', work: 'Робота', rest: 'Відпочинок', setrest: 'Відпочинок між сетами', done: 'Готово' };
  let tmS = (() => {
    const d = JSON.parse(JSON.stringify(TM_DEF));
    try { const s = JSON.parse(localStorage.getItem(TM_KEY) || 'null');
      if (s) for (const k in d) if (k in s) d[k] = (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) ? { ...d[k], ...s[k] } : s[k];
    } catch (e) {}
    if (!TM_MODES.some(([k]) => k === d.mode)) d.mode = 'interval';
    return d;
  })();
  function tmSave() { try { localStorage.setItem(TM_KEY, JSON.stringify(tmS)); } catch (e) {} }
  // 0:45, 2:00, 1:05:30
  function tmFmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
  }
  function tmStepOf(v, up) { const x = up ? v : v - 1; return x < 60 ? 5 : x < 600 ? 15 : 60; }
  function tmPhases(mode, c, prep) {
    const P = [];
    if (prep) P.push({ k: 'prep', d: prep });
    if (mode === 'interval' || mode === 'tabata') {
      for (let s = 1; s <= c.sets; s++) for (let r = 1; r <= c.rounds; r++) {
        P.push({ k: 'work', d: c.work, r, s });
        if (r < c.rounds) { if (c.rest) P.push({ k: 'rest', d: c.rest, r, s }); }
        else if (s < c.sets) { if (c.setRest) P.push({ k: 'setrest', d: c.setRest, r, s }); else if (c.rest) P.push({ k: 'rest', d: c.rest, r, s }); }
      }
    } else if (mode === 'emom') { for (let r = 1; r <= c.rounds; r++) P.push({ k: 'work', d: c.every, r }); }
    else if (mode === 'countdown') P.push({ k: 'work', d: c.time });
    return P;
  }
  function tmTotal(mode) { return tmPhases(mode, tmS[mode], 0).reduce((a, p) => a + p.d, 0); }
  function tmSummary(mode) {
    const c = tmS[mode];
    if (mode === 'emom') return `${c.rounds} × кожні ${tmFmt(c.every)}`;
    if (mode === 'countdown') return 'Зворотний відлік';
    return `${c.rounds} × (${tmFmt(c.work)} + ${tmFmt(c.rest)})${c.sets > 1 ? ` × ${c.sets} ${mode === 'tabata' ? 'табати' : 'сети'}` : ''}`;
  }
  function tmPresetName(mode, c) {
    if (mode === 'emom') return `EMOM ${tmFmt(c.every)} × ${c.rounds}`;
    if (mode === 'countdown') return tmFmt(c.time);
    return `${tmFmt(c.work)}/${tmFmt(c.rest)} × ${c.rounds}${c.sets > 1 ? ' × ' + c.sets : ''}`;
  }

  // ----- Звук: м'які «дзвіночки» через Web Audio -----
  let tmAC = null;
  function tmAudio() {
    try {
      tmAC = tmAC || new (window.AudioContext || window.webkitAudioContext)();
      if (tmAC.state === 'suspended') tmAC.resume();
      // Тихий звук відкриває аудіо на iPhone
      const o = tmAC.createOscillator(), g = tmAC.createGain(); g.gain.value = 0.0001;
      o.connect(g).connect(tmAC.destination); o.start(); o.stop(tmAC.currentTime + 0.02);
    } catch (e) {}
  }
  function tmTone(f, dur, at, vol, type, vib) {
    const ac = tmAC; if (!ac) return;
    const t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib; lg.gain.value = f * .035; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + .05); }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function tmBell(f, dur, at, vol) { tmTone(f, dur, at, vol); tmTone(f * 2, dur * .6, at, vol * .22); tmTone(f * 3, dur * .3, at, vol * .08); }
  // Боксерський гонг: «металеві» негармонічні обертони і довгий хвіст
  function tmGong(f, at, vol, dur = 1.8) { [[1, 1], [2.76, .5], [5.4, .25], [8.9, .12]].forEach(([k, v]) => tmTone(f * k, dur / Math.sqrt(k), at, vol * v)); }
  function tmWhistle(dur, at, vol) { tmTone(2700, dur, at, vol, 'sine', 38); tmTone(5400, dur, at, vol * .12, 'sine', 38); }
  function tmMarimba(f, at, vol, dur = .45) { tmTone(f, dur, at, vol, 'triangle'); tmTone(f * 4, dur * .25, at, vol * .25); }
  const TM_SOUNDS = {
    bell: { name: 'Дзвіночок',
      tick: () => tmBell(880, .18, 0, .35),

  // Завжди доступні; решта — за перемикачами в «Керування командою»
  function memberRoutes() { return ['home', 'athlete', 'settings', 'join', ...(isAthleteM() ? ['nutrition', 'sleep', 'timer'] : []), ...ACCESS_PARTS.map(([p]) => p).filter(canSee)]; }
  const PARENT_ROUTE = { timer: 'training', readiness: 'home', sleep: 'readiness', recipes: 'home', stats: 'home', connections: 'home', manage: 'home', athlete: 'athletes', event: 'events', schedule: 'training', plans: 'training', tests: 'training', materials: 'home' };
  // Нижня панель для тренера: вкладка → які екрани до неї належать
  const TABS = [['home', 'Головна'], ['attendance', 'Відмітки'], ['payments', 'Оплати'], ['athletes', 'Спортсмени'], ['chat', 'Чат']];
  const TAB_OF = { athlete: 'athletes', rating: 'athletes' };
  // Нижня панель для батьків і спортсменів: [посилання, підпис, іконка]
  function memberTabs() {
    const ids = state.kidIds || [];
    const kid = ids.length ? 'athlete/' + encodeURIComponent(ids[0]) : 'home';
    const extra = (isAthleteM()
      ? [['plans', 'Завдання', 'plans'], ['chat', 'Чат', 'chat'], ['events', 'Події', 'training'], ['news', 'Оголошення', 'news']]
      : [['events', 'Події', 'training'], ['news', 'Оголошення', 'news'], ['plans', 'Завдання', 'plans'], ['chat', 'Чат', 'chat']])
      .filter(([r]) => canSee(r)).slice(0, 3);
    return [['home', 'Головна', 'home'], [kid, isAthleteM() ? 'Я' : ids.length > 1 ? 'Діти' : 'Дитина', 'kid'], ...extra];
  }
  const MEMBER_TAB_OF = { rating: 'home', schedule: 'home', links: 'home', join: 'home', settings: 'home', plans: 'home', chat: 'home', events: 'home', news: 'home' };
  function tabsNow() { return isCoach() ? TABS.map(([r, l]) => [r, l, r]) : state.role === 'member' ? memberTabs() : null; }
  function drawTabbar(route) {
    const bar = $('#tabbar'), tabs = tabsNow(), on = !!tabs;
    bar.hidden = !on;
    document.body.classList.toggle('has-tabs', on);
    if (!on) return;
    const keys = tabs.map(([href]) => href.split('/')[0]);
    const cur = keys.includes(route) ? route : ((isCoach() ? TAB_OF : MEMBER_TAB_OF)[route] || 'home');
    bar.firstElementChild.innerHTML = tabs.map(([href, label, ic], i) => { const on = keys[i] === cur;
      return `<a class="tab ${on ? 'on' : ''}" href="#${href}" data-tab="${keys[i]}" ${on ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></a>`; }).join('');
  }
  function isTabRoute(route) { const t = tabsNow(); return !!t && t.some(([href]) => href.split('/')[0] === route); }
  // Вкладка завжди відкриває «сьогодні» і поточний місяць
  $('#tabbar').addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (!t) return;
    if (t.dataset.tab === 'attendance') state.date = today();
    if (t.dataset.tab === 'payments') state.month = today().slice(0, 7);
    if (location.hash === t.getAttribute('href')) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
  });

  // Цифри на головній «докручуються» від нуля
  function countUp() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('#view .stat b').forEach(el => {
      const end = Number(el.textContent); if (!Number.isFinite(end) || end <= 0) return;
      const t0 = performance.now(), dur = 700;
      const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = Math.round(end * e); if (k < 1) requestAnimationFrame(step); };
      el.textContent = '0'; requestAnimationFrame(step);
    });
  }

  let renderId = 0;
  async function render() {
    const [key, param] = location.hash.slice(1).split('/');
    let route = VIEWS[key] ? key : 'home';
    state.param = param ? decodeURIComponent(param) : null;
    if (!isCoach() && !memberRoutes().includes(route)) route = 'home';
    if (!state.role && route !== 'settings' && route !== 'join') route = 'home';
    const id = ++renderId;
    if (chatChannel) { db.removeChannel(chatChannel); chatChannel = null; }
    $('#pageTitle').textContent = route === 'rating' && !isCoach() ? 'Рейтинг спортсменів'
      : route === 'athlete' && !isCoach() ? (isAthleteM() ? 'Моя картка' : 'Моя дитина') : TITLES[route];
    document.body.classList.toggle('inner', route !== 'home');
    document.body.dataset.route = route;
    $('#searchBtn').hidden = !isCoach();
    drawTabbar(route);
    const isTab = isCoach() ? (TABS.some(([r]) => r === route) || route === 'rating') : isTabRoute(route);
    $('#backLink').hidden = route === 'home' || isTab;
    const parent = isCoach() ? PARENT_ROUTE[route] : (route !== 'home' && route !== 'settings' ? 'home' : null);
    $('#backLink').href = '#' + (parent || 'home');
    $('#view').onclick = null;
    const viewKey = location.hash;
    const fresh = !$('#view').innerHTML.trim() || $('#view').dataset.key !== viewKey;
    if (fresh) { $('#view').classList.remove('enter'); $('#view').innerHTML = skeleton(); }
    $('#view').dataset.route = route;
    $('#view').dataset.key = viewKey;
    try {
      await VIEWS[route]();
    } catch (err) {
      if (id === renderId) $('#view').innerHTML = `<p class="err">Не вдалося завантажити: ${esc(err.message)}</p>`;
    }
    if (fresh && id === renderId) { void $('#view').offsetWidth; $('#view').classList.add('enter'); countUp(); hideSplash(); }
  }

  // Клік по фільтру групи
  document.addEventListener('click', e => {
    const chip = e.target.closest('[data-group]');
    if (chip) { state.group = chip.dataset.group; render(); }
    const sec = e.target.closest('[data-section]');
    if (sec) {
      state.section = sec.dataset.section;
      try { localStorage.setItem('ft_section', state.section); } catch (err) {}
      render();
    }
  });
  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

  // Хто зайшов: тренер, учасник (батьки/спортсмен) чи ще ніхто
  async function detectRole() {
    const { data: coach, error } = await db.rpc('is_coach');
    // Без інтернету беремо роль, збережену минулого разу
    if (error && !navigator.onLine) {
      try { const c = JSON.parse(localStorage.getItem('ft_role') || 'null'); if (c && c.email === state.email) { state.name = c.name; state.memberRole = c.memberRole || 'parent'; return c.role; } } catch (e) {}
    }
    const { data: name } = await db.rpc('my_name');
    state.name = name || '';
    let role = null;
    if (coach) role = 'coach';
    else { const { data: member } = await db.rpc('is_member'); role = member ? 'member' : null; }
    state.memberRole = 'parent';
    if (role === 'member') {
      const [{ data: r }, { data: ks }] = await Promise.all([db.rpc('my_role'), db.from('athletes').select('id, active').order('full_name')]);
      if (r === 'athlete') state.memberRole = 'athlete';
      const act = (ks || []).filter(isActive);
      state.kidIds = (act.length ? act : ks || []).map(x => String(x.id));
    }
    try { localStorage.setItem('ft_role', JSON.stringify({ email: state.email, role, name: state.name, memberRole: state.memberRole })); } catch (e) {}
    return role;
  }

  // Заставка: ховаємо, щойно є що показати (мінімум пів секунди, максимум 4 с)
  const splashT0 = Date.now();
  function hideSplash() {
    const el = $('#splash'); if (!el || el.classList.contains('out')) return;
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, Math.max(0, 500 - (Date.now() - splashT0)));
  }
  setTimeout(hideSplash, 4000);

  let signedIn = null;
  async function showApp(session) {
    const on = !!session;
    if (signedIn === on) return;
    signedIn = on;
    $('#loginSection').hidden = on;
    $('#appSection').hidden = !on;
    $('#menuBtn').hidden = !on;
    if (!on) $('#searchBtn').hidden = true;
    if (on) {
      state.email = (session.user.email || '').toLowerCase();
      $('#view').innerHTML = skeleton();
      state.role = await detectRole();
      if (pendingJoin() && state.role !== 'coach') await claimJoin();
      render();
      flushQueue();
    } else {
      hideSplash();
      state.role = null;
      drawTabbar('home');
      document.body.classList.remove('inner');
    }
  }

  // ===== Запрошення за посиланням: …/#join/КОД =====
  function pendingJoin() { try { return localStorage.getItem('ft_join') || ''; } catch (e) { return ''; } }
  function setJoin(code) { try { code ? localStorage.setItem('ft_join', code) : localStorage.removeItem('ft_join'); } catch (e) {} }
  // Спільне посилання для всіх: …/#team — одразу відкриваємо реєстрацію
  let teamLink = false;
  if (location.hash === '#team') { teamLink = true; history.replaceState(null, '', location.pathname); }
  if (location.hash.startsWith('#join/')) {
    setJoin(decodeURIComponent(location.hash.slice(6)).toUpperCase());
    history.replaceState(null, '', location.pathname);
  }
  // Після входу: питаємо імʼя і привʼязуємо акаунт до спортсмена
  function claimJoin() {
    return new Promise(resolve => {
      const dlg = $('#dlg');
      dlg.innerHTML = `<form><h3>Ласкаво просимо в Ferents Team</h3>
        <p class="muted small" style="margin:4px 0 10px">Вас запросив тренер. Як вас звати?</p>
        <label>Імʼя<input name="name" required maxlength="60" placeholder="напр. Олена, мама Івана" value="${esc(state.name || '')}"></label>
        <p class="err small" id="joinErr"></p>
        <div class="dlg-actions"><span class="spacer"></span>
          <button type="button" class="btn light" data-act="cancel">Пізніше</button>
          <button type="submit" class="btn">Готово</button></div></form>`;
      const form = dlg.querySelector('form');
      const done = () => { dlg.close(); resolve(); };
      form.querySelector('[data-act=cancel]').onclick = done;
      form.onsubmit = async e => {
        e.preventDefault();
        const btn = form.querySelector('[type=submit]'); btn.disabled = true;
        const { data, error } = await db.rpc('claim_invite', { p_code: pendingJoin(), p_name: form.name.value });
        if (error) {
          btn.disabled = false;
          const m = error.message || '';
          $('#joinErr').textContent = /expired/.test(m) ? 'Посилання вже не діє. Попросіть тренера надіслати нове.'
            : /not_found/.test(m) ? 'Посилання неправильне. Попросіть тренера надіслати нове.' : 'Не вдалося: ' + m;
          if (/expired|not_found/.test(m)) setJoin('');
          return;
        }
        setJoin('');
        state.role = await detectRole();
        toast(`Готово! Ваш акаунт привʼязано: ${data || 'спортсмен'}`);
        notify('joined', { title: '👋 Новий учасник', body: `${form.name.value.trim()} → ${data || ''}`, url: './#members' });
        done();
      };
      dlg.showModal();
    });
  }

  // Вхід / реєстрація / відновлення пароля
  let loginMode = 'login';
  let codeType = 'signup'; // для якого листа чекаємо код: реєстрація чи новий пароль
  function setLoginMode(mode) {
    loginMode = mode;
    const t = { login: ['Вхід', 'Увійти', 'Для тренерів, батьків і спортсменів команди.'],
                signup: ['Реєстрація', 'Зареєструватися', 'Використайте email, який ви дали тренеру. Пароль — мінімум 6 символів.'],
                reset: ['Відновлення пароля', 'Надіслати лист', 'Ми надішлемо на пошту посилання для нового пароля.'],
                code: ['Код із пошти', 'Підтвердити', 'Ми надіслали лист із кодом. Введіть код нижче (якщо листа немає — гляньте в «Спам»).'] }[mode];
    $('#loginTitle').textContent = t[0];
    $('#loginBtn').textContent = t[1];
    $('#loginHint').textContent = t[2];
    $('#pwLabel').hidden = mode === 'reset' || mode === 'code';
    $('#loginPassword').required = mode === 'login' || mode === 'signup';
    $('#email2Label').hidden = mode !== 'signup';
    $('#loginEmail2').required = mode === 'signup';
    $('#codeLabel').hidden = mode !== 'code';
    $('#loginCode').required = mode === 'code';
    $('#resendBtn').hidden = mode !== 'code';
    if (mode === 'code') { $('#loginCode').value = ''; setTimeout(() => $('#loginCode').focus(), 50); }
    $('#loginPassword').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    document.querySelectorAll('[data-mode]').forEach(b => { b.hidden = b.dataset.mode === mode || (mode !== 'login' && b.dataset.mode !== 'login'); });
    $('#loginMessage').textContent = '';
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setLoginMode(b.dataset.mode));
  $('#resendBtn').onclick = async () => {
    const email = $('#loginEmail').value.trim().toLowerCase();
    const msg = $('#loginMessage');
    const { error } = codeType === 'signup'
      ? await db.auth.resend({ type: 'signup', email })
      : await db.auth.resetPasswordForEmail(email);
    msg.textContent = error ? 'Помилка: ' + error.message : 'Надіслали новий код на ' + email;
    msg.className = 'small ' + (error ? 'err' : 'msg-ok');
  };

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#loginMessage');
    const say = (text, ok) => {
      if (/rate limit|too many/i.test(text)) text = 'Забагато листів за короткий час. Зачекайте близько години й спробуйте ще раз.';
      msg.textContent = text; msg.className = 'small ' + (ok ? 'msg-ok' : 'err');
    };
    const email = $('#loginEmail').value.trim().toLowerCase();
    const password = $('#loginPassword').value;
    const redirect = location.origin + location.pathname;
    const btn = $('#loginBtn');
    btn.disabled = true;
    try {
      if (loginMode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error && /confirm/i.test(error.message)) {
          // Пошту ще не підтверджено — надсилаємо лист ще раз
          await db.auth.resend({ type: 'signup', email, options: { emailRedirectTo: redirect } });
          say('Пошту ще не підтверджено. Ми надіслали лист на ' + email + ' — відкрийте посилання з нього.', true);
        } else if (error) say('Невірний email або пароль');
      } else if (loginMode === 'signup') {
        if ($('#loginEmail2').value.trim().toLowerCase() !== email) {
          say('Email не збігається. Перевірте адресу — на неї прийде лист, якщо забудете пароль.');
          return;
        }
        const { data, error } = await db.auth.signUp({ email, password, options: { emailRedirectTo: redirect } });
        if (error) say(/registered|exists/i.test(error.message) ? 'Цей email уже зареєстрований — увійдіть' : 'Помилка: ' + error.message);
        else if (!data.session) say(`Готово! Ми надіслали лист на ${email}. Відкрийте посилання з листа, щоб підтвердити пошту.`, true);
      } else if (loginMode === 'reset') {
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: redirect });
        if (error) say('Помилка: ' + error.message);
        else say('Лист надіслано на ' + email + '. Відкрийте посилання з листа на цьому пристрої — і задайте новий пароль.', true);
      } else {
        const token = $('#loginCode').value.replace(/\D/g, '');
        const { error } = await db.auth.verifyOtp({ email, token, type: codeType });
        if (error) say(/expired/i.test(error.message) ? 'Код застарів — натисніть «Надіслати ще раз»' : 'Невірний код. Перевірте й спробуйте ще раз');
        else if (codeType === 'recovery') setTimeout(newPasswordForm, 300);
      }
    } finally { btn.disabled = false; }
  });

  if (pendingJoin()) {
    setLoginMode('signup');
    $('#loginHint').textContent = 'Вас запросив тренер. Введіть свою пошту (двічі, щоб не помилитися) й придумайте пароль (мінімум 6 символів). Якщо акаунт уже є — натисніть «Назад до входу».';
  } else if (teamLink) {
    setLoginMode('signup');
    $('#loginHint').textContent = 'Ласкаво просимо в Ferents Team! Введіть свою пошту (двічі, щоб не помилитися) й придумайте пароль (мінімум 6 символів). Далі вкажете свою дитину — і тренер підтвердить. Якщо акаунт уже є — натисніть «Назад до входу».';
  }
  applyTeam();
  (async function boot() {
    const { data: { session } } = await db.auth.getSession();
    loadTeam().then(changed => { if (changed && signedIn) render(); }).catch(() => {});
    showApp(session);
    db.auth.onAuthStateChange((event, s) => {
      setTimeout(() => {
        showApp(s);
        if (event === 'PASSWORD_RECOVERY') newPasswordForm();
      }, 0);
    });
  })();
  function newPasswordForm() {
          openForm({
            title: 'Новий пароль',
            fields: [{ name: 'password', label: 'Новий пароль (мінімум 6 символів)', type: 'password', required: true, attrs: 'minlength="6" autocomplete="new-password"' }],
            onSave: async obj => {
              const { error } = await db.auth.updateUser({ password: obj.password });
              if (error) { toast('Помилка: ' + error.message, true); throw error; }
            },
          });
  }
  </script>
</body>
</html>
