  // ----- Головний -----
  async function homeView() {
    setActions('');
    if (state.role === 'member') return memberHomeView();
    if (state.role !== 'coach') return joinView();

    const t = today();
    const reqP = db.from('join_requests').select('id', { count: 'exact', head: true });
    const appP = db.from('applications').select('id', { count: 'exact', head: true }).eq('status', 'new');
    const recP = db.from('recipes').select('id', { count: 'exact', head: true }).eq('status', 'pending');
    let [ath, att, pay, sch, ev, pl] = await Promise.all([
      q(db.from('athletes').select('*')),
      q(db.from('attendance').select('athlete_id, date').eq('date', t).eq('present', true)),
      q(db.from('payments').select('athlete_id, month').eq('month', t.slice(0, 7) + '-01')),
      q(db.from('schedule').select('*').order('start_time')),
      q(db.from('events').select('title, date').gte('date', t).order('date').limit(1)),
      db.from('training_plans').select('group_name, title').eq('date', t),
    ]).then(([a1, a2, a3, a4, a5, a6]) => [a1,
      withPending('attendance', a2, r => r.date === t).filter(r => r.present !== false),
      withPending('payments', a3, r => r.month === t.slice(0, 7) + '-01'), a4, a5, a6]);
    const schAll = sch;
    sch = schAll.filter(s => Number(s.weekday) === weekdayOf(t));
    const plansToday = (pl.data || []);
    const active = ath.filter(isActive);
    const paid = new Set(pay.map(p => p.athlete_id));
    const unpaid = active.filter(a => !paid.has(a.id)).length;
    const presentIds = new Set(att.map(m => String(m.athlete_id)));

    // Тренування, яке йде зараз (за 30 хв до початку і 30 хв після кінця), або наступне сьогодні
    const mins = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
    const nowD = new Date(), nowM = nowD.getHours() * 60 + nowD.getMinutes();
    const slots = sch.map(s => {
      const st = mins(s.start_time), en = s.end_time ? mins(s.end_time) : st + 90;
      return { s, st, en };
    });
    // Якщо вікна груп перекриваються — беремо ту, що вже почалася найпізніше
    const inWin = slots.filter(x => nowM >= x.st - 30 && nowM <= x.en + 30);
    const current = inWin.filter(x => x.st <= nowM).sort((a, b) => b.st - a.st)[0] || inWin[0];
    // Наступна група сьогодні після поточної
    const after = current && slots.filter(x => x.st > current.st).sort((a, b) => a.st - b.st)[0];
    let next = !current && slots.find(x => x.st > nowM);
    if (next) next.date = t;
    // Сьогодні більше немає — шукаємо найближчий день за розкладом (до тижня вперед)
    if (!current && !next) {
      for (let d = 1; d <= 7 && !next; d++) {
        const date = shiftDate(t, d);
        const s = schAll.filter(x => Number(x.weekday) === weekdayOf(date))
          .sort((a, b) => mins(a.start_time) - mins(b.start_time))[0];
        if (s) next = { s, st: mins(s.start_time), date, days: d };
      }
    }
    const groupCount = (g, sec) => {
      const inG = active.filter(a => (!g || a.group_name === g) && (!sec || !('section' in a) || a.section === sec));
      return [inG.filter(a => presentIds.has(String(a.id))).length, inG.length];
    };
    let nowBlock = '';
    if (current) {
      const [n, total] = groupCount(current.s.group_name, current.s.section);
      const curLabel = esc([current.s.section, current.s.group_name].filter(Boolean).join(' · '));
      if (n > 0 && after) {
        // Поточну групу вже відмічено — пропонуємо наступну
        const [n2, total2] = groupCount(after.s.group_name, after.s.section);
        nowBlock = `<a class="now" href="#attendance" data-now-group="${esc(after.s.group_name || '')}" data-now-section="${esc(after.s.section || '')}">
          <i class="dot"></i>
          <div><b>Відмітити наступну групу</b><span>${esc([after.s.section, after.s.group_name].filter(Boolean).join(' · '))} · ${hhmm(after.s.start_time)}${after.s.place ? ' · ' + esc(after.s.place) : ''} · відмічено ${n2} з ${total2}</span>
          <span>${icon('check')}${curLabel}: відмічено ${n} з ${total}</span></div>
          <i class="go">›</i></a>`;
      } else if (n > 0) {
        // Остання група на сьогодні вже відмічена
        nowBlock = `<a class="now soon" href="#attendance" data-now-group="${esc(current.s.group_name || '')}" data-now-section="${esc(current.s.section || '')}">
          <i class="dot"></i>
          <div><b>${icon('check')}Відмічено: ${curLabel}</b><span>${n} з ${total} · на сьогодні все</span></div>
          <i class="go">›</i></a>`;
      } else {
        nowBlock = `<a class="now" href="#attendance" data-now-group="${esc(current.s.group_name || '')}" data-now-section="${esc(current.s.section || '')}">
          <i class="dot"></i>
          <div><b>Відмітити присутніх</b><span>${curLabel} · ${hhmm(current.s.start_time)}${current.s.place ? ' · ' + esc(current.s.place) : ''} · відмічено ${n} з ${total}</span></div>
          <i class="go">›</i></a>`;
      }
    } else if (next) {
      let inTxt;
      if (next.days) {
        inTxt = next.days === 1 ? 'завтра' : fmtDate(next.date, { weekday: 'long', day: 'numeric', month: 'long' });
      } else {
        const at = new Date(t + 'T' + hhmm(next.s.start_time));
        inTxt = `<span data-countdown="${at.toISOString()}">${cdText(at - Date.now())}</span>`;
      }
      nowBlock = `<a class="now soon" href="#attendance" data-now-group="${esc(next.s.group_name || '')}" data-now-section="${esc(next.s.section || '')}">
        <i class="dot"></i>
        <div><b>Наступне: ${hhmm(next.s.start_time)} — ${esc([next.s.section, next.s.group_name].filter(Boolean).join(' · '))}</b><span>${inTxt}${next.s.place ? ' · ' + esc(next.s.place) : ''}</span></div>
        <i class="go">›</i></a>`;
    }

    const todayText = sch.length
      ? sch.map(s => `${hhmm(s.start_time)} — ${esc(schedLabel(s))}`).join('<br>')
      : 'Тренувань за розкладом немає';
    const plansText = plansToday.length
      ? '<br><br><b>Завдання:</b> ' + plansToday.map(p => `${esc(p.group_name || 'всі групи')} — ${esc(p.title)}`).join('; ') +
        ' <a class="link" href="#plans">відкрити</a>'
      : '';
    // Дні народження: сьогодні та найближчі 14 днів
    const bdays = active.map(a => ({ a, b: nextBirthday(a) }))
      .filter(x => x.b && x.b.days <= 14).sort((x, y) => x.b.days - y.b.days);
    const who = a => `<a class="link" style="color:inherit" href="#athlete/${encodeURIComponent(a.id)}">${esc(a.full_name)}</a>`;
    const bdayBlock = bdays.length ? `<div class="bday">
        <strong>${icon('cake')}ДНІ НАРОДЖЕННЯ</strong>
        ${bdays.map(({ a, b }) => b.days === 0
          ? `<div class="bday-today">${icon('party')}Сьогодні день народження: <b>${who(a)}</b> — ${b.age} ${yearsWord(b.age)}!</div>`
          : `<div>${fmtDate(b.date)} — ${who(a)}, виповнюється ${b.age} <span class="muted">(${b.days === 1 ? 'завтра' : 'через ' + b.days + ' дн.'})</span></div>`
        ).join('')}
      </div>` : '';
    const nextEvent = ev[0]
      ? `<br><br><b>Найближча подія:</b> ${esc(ev[0].title)}, ${fmtDate(ev[0].date)}`
      : '';

    const tile = (route, ic, title, sub, cls = '', n = 0) =>
      `<a class="tile ${cls}" href="#${route}"><span class="ic">${icon(ic)}${n ? `<em class="cnt">${n}</em>` : ''}</span><span><strong>${title}</strong><small>${sub}</small></span></a>`;

    const pushC = await pushCard();
    const ls = await linkStatus().catch(() => null);
    let linkBlock = '';
    if (ls && active.length) {
      const nApp = active.filter(a => ls.by.has(String(a.id))).length;
      const nTg = active.filter(a => ls.by.get(String(a.id))?.tg).length;
      if (nApp < active.length || !ls.tgOk || nTg < active.length) linkBlock = `<a class="now soon" href="#connections"><i class="dot"></i>
        <div><b>Хто підключився</b><span>${icon('phone')}Застосунок: ${nApp} з ${active.length} · ${icon('send')}Telegram: ${ls.tgOk ? nTg + ' з ' + active.length : 'потрібен SQL'}</span></div><i class="go">›</i></a>`;
    }
    const { count: reqN } = await reqP;
    const reqBlock = reqN ? `<a class="now soon" href="#members"><i class="dot"></i>
        <div><b>${icon('hand')}Запити на доступ: ${reqN}</b><span>Чекають вашого підтвердження</span></div><i class="go">›</i></a>` : '';
    const { count: appN } = await appP;
    const { count: recN } = await Promise.resolve(recP).catch(() => ({ count: 0 }));
    const recBlock = recN ? `<a class="now soon" href="#recipes"><i class="dot"></i>
        <div><b>${icon('note')}Нові рецепти від спортсменів: ${recN}</b><span>Перегляньте й схваліть — тоді їх побачить уся старша група</span></div><i class="go">›</i></a>` : '';
    const dayN = Number(t.slice(8, 10));
    const payBlock = unpaid && dayN >= 8 && dayN <= 10 ? `<a class="now soon" href="#payments" data-reset="payments"><i class="dot"></i>
        <div><b>Нагадати про оплату: ${unpaid} не оплатили</b><span>${dayN === 10 ? 'Сьогодні останній день оплати' : 'Оплата до 10 числа'} · Оплати → Нагадати батькам</span></div><i class="go">›</i></a>` : '';
    const appBlock = appN ? `<a class="now soon" href="#applications"><i class="dot"></i>
        <div><b>Нові заяви від батьків: ${appN}</b><span>Перегляньте й додайте дітей у спортсмени</span></div><i class="go">›</i></a>` : '';
    const le = lastExport();
    const expBlock = active.length && (!le || (Date.now() - new Date(le + 'T12:00')) > 30 * 864e5)
      ? `<a class="install" href="#settings" style="text-decoration:none;color:inherit"><span class="ic-box">${icon('box')}</span>
          <div><b>Час зробити резервну копію</b>${le ? 'Остання — ' + fmtDate(le, { day: 'numeric', month: 'long' }) : 'Збережіть усю базу в Excel'} · Налаштування →</div></a>` : '';
    // Пробна версія: верх у стилі Monobank, готовність старшої групи, групи сьогодні
    let monoTop = '', monoReady = '', monoToday = '';
    if (BETA) {

          <em class="${unpaid ? 'bad' : 'ok'}">${unpaid ? `${unpaid} ще не оплатили · до 10 числа` : 'Усі оплатили'}</em></div>
        <div class="m-acts">${[['attendance', 'attendance', 'Відмітки', '#22c55e', 0], ['payments', 'payments', 'Оплати', '#3b82f6', unpaid && dayN <= 10 ? unpaid : 0],
          ['members', 'members', 'Запити', '#d946ef', reqN || 0], ['applications', 'form', 'Заяви', '#14b8a6', appN || 0]].map(([r, ic, l, c, n]) =>
          `<a href="#${r}" data-reset="${r}" style="--mc:${c}"><span>${icon(ic)}${n ? `<em>${n}</em>` : ''}</span>${l}</a>`).join('')}</div>`;

    }
    if (BETA) {
      monoToday = sch.length ? `<h3>Сьогодні в залі</h3><div class="list m-feed">${sch.map(s => {

          return `<a class="row" href="#attendance" data-now-group="${esc(s.group_name || '')}" data-now-section="${esc(s.section || '')}"><span class="m-ic${nowM >= st && nowM <= en ? ' on' : ''}">${hhmm(s.start_time)}</span>
            <div class="grow"><strong>${esc(s.group_name || '')}</strong><span>${esc([s.section, stat].filter(Boolean).join(' · '))}</span></div><b class="m-val">${n}/${total}</b></a>`; }).join('')}</div>` : '';

      ${monoTop}
      ${installCard()}
      ${pushC}
      ${BETA ? '' : reqBlock}
      ${linkBlock}
      ${BETA ? '' : appBlock}
      ${recBlock}
      ${payBlock}
      ${expBlock}
      ${nowBlock}
      ${monoReady}
      ${monoToday}

      </div>` : ''}
      ${settings.showToday && !BETA ? `<div class="today"><strong>СЬОГОДНІ, ${fmtDate(t, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase()}</strong>${todayText}${plansText}${nextEvent}</div>` : ''}
      ${settings.showBdays ? bdayBlock : ''}
      ${BETA ? '<h3>Розділи</h3>' : ''}
      <div class="tiles">
        ${tile('training', 'training', 'Тренування', 'Розклад, завдання, тести')}
        ${tile('events', 'events', 'Календар подій', 'Змагання, збори')}
        ${tile('links', 'links', 'Відео', 'Ката, техніка, посилання')}
        ${tile('members', 'members', 'Учасники', 'Доступ для батьків', '', reqN || 0)}
        ${tile('stats', 'stats', 'Статистика', 'Таблиці відміток і оплат')}
        ${tile('applications', 'form', 'Заяви', 'Анкети вступу з підписом', '', appN || 0)}
      </div>`;

    // Перед переходом готуємо фільтри: сьогоднішня дата, поточний місяць, потрібна група
    $('#view').onclick = e => {
      const nowLink = e.target.closest('[data-now-group]');
      const reset = e.target.closest('[data-reset]');
      if (nowLink) {
        state.date = today(); state.group = GROUPS.includes(nowLink.dataset.nowGroup) ? nowLink.dataset.nowGroup : 'Усі';
        if (SECTIONS.includes(nowLink.dataset.nowSection)) state.section = nowLink.dataset.nowSection;
      }
      if (reset) { state.group = 'Усі'; state.search = ''; state.date = today(); state.month = today().slice(0, 7); }
    };
  }

  // ----- Головна для батьків і спортсменів -----
  async function memberHomeView() {
    const t = today(), ym = t.slice(0, 7), monthStart = ym + '-01';
    // База сама віддає лише «своїх» спортсменів (прив'язку робить тренер в «Учасниках»)
    const [kids0, schAll, ev, att, rating, news, pushC] = await Promise.all([
      q(db.from('athletes').select('*').order('full_name')),
      q(db.from('schedule').select('*').order('start_time')),
      q(db.from('events').select('*').gte('date', t).order('date')),
      q(db.from('attendance').select('athlete_id, date').eq('present', true).gte('date', monthStart)),
      db.rpc('team_rating').then(r => r.data || []),
      db.from('announcements').select('*').gte('created_at', new Date(Date.now() - 21 * 864e5).toISOString())
        .order('created_at', { ascending: false }).limit(3).then(r => r.data || []),
      pushCard(),
    ]);
    const pollsNow = canSee('news') ? ((await loadPolls(10).catch(() => null)) || []).filter(p => !p.closed && !p.mine) : [];
    const kids = kids0.filter(isActive).length ? kids0.filter(isActive) : kids0;
    state.kidIds = kids.map(a => String(a.id));
    drawTabbar('home');
    const urlOf = await photoUrls(kids.map(a => a.photo)).catch(() => () => '');
    const placeOf = new Map(rating.map(r => [String(r.id), r.rating_place]));

    const mins = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
    const nowD = new Date(), nowM = nowD.getHours() * 60 + nowD.getMinutes();
    const forKid = (s, a) => s.group_name === a.group_name && (!s.section || !a.section || s.section === a.section);
    const mine = s => kids.some(a => forKid(s, a));

    // Найближче тренування груп моїх спортсменів
    let nextDay = null;
    for (let d = 0; d <= 7 && kids.length && !nextDay; d++) {
      const date = shiftDate(t, d);
      const list = schAll.filter(s => Number(s.weekday) === weekdayOf(date) && mine(s))
        .filter(s => d > 0 || (s.end_time ? mins(s.end_time) : mins(s.start_time) + 90) > nowM)
        .sort((a, b) => mins(a.start_time) - mins(b.start_time));
      if (list.length) nextDay = { date, d, list };
    }
    let nextBlock = '';
    if (nextDay) {
      const st = mins(nextDay.list[0].start_time);
      let when;
      if (nextDay.d === 0) {
        if (nowM >= st) when = 'зараз іде';
        else { const at = new Date(nextDay.date + 'T' + hhmm(nextDay.list[0].start_time)); when = `сьогодні, <span data-countdown="${at.toISOString()}">${cdText(at - Date.now())}</span>`; }
      } else when = nextDay.d === 1 ? 'завтра, ' + fmtDate(nextDay.date, { weekday: 'long' }) : fmtDate(nextDay.date, { weekday: 'long', day: 'numeric', month: 'long' });
      const lines = nextDay.list.map(s => `${hhmm(s.start_time)}${s.end_time ? '–' + hhmm(s.end_time) : ''} — ${esc([kids.length > 1 ? s.group_name : '', s.place].filter(Boolean).join(' · ') || s.group_name)}`).join('<br>');
      nextBlock = `<div class="now soon"><i class="dot"></i>
        <div><b>Наступне тренування: ${when}</b><span>${lines}</span></div></div>`;
    }

    // Картка кожного спортсмена: пояс, група, відвідування цього місяця, місце в рейтингу
    const kidCard = a => {
      const visits = att.filter(x => String(x.athlete_id) === String(a.id)).length;
      const days = new Set(schAll.filter(s => forKid(s, a)).map(s => Number(s.weekday)));
      let planned = 0;
      for (let d = monthStart; d <= t; d = shiftDate(d, 1)) if (days.has(weekdayOf(d))) planned++;
      const place = placeOf.get(String(a.id));
      return `<a class="row" href="#athlete/${encodeURIComponent(a.id)}">
        ${avatarHtml(a, urlOf(a.photo), 'av av-lg')}
        <div class="grow"><strong>${beltTag(a.belt)}${esc(a.full_name)}</strong>
          <span>${esc([a.section, a.group_name, beltShort(a.belt)].filter(Boolean).join(' · '))}</span>
          <span>${icon('check')}${visits}${planned ? ' з ' + planned : ''} тренувань у ${MONTHS_IN[Number(ym.slice(5)) - 1]}${place ? ` · ${trophy()} ${place} місце в рейтингу` : ''}</span></div>
        <span class="chev">›</span></a>`;
    };
    const noKids = `<div class="info">Тренер ще не привʼязав ваш акаунт до спортсмена. Коли це буде зроблено,
      тут зʼявляться його відвідування, пояси та найближчі тренування.</div>`;

    const going = e => (Array.isArray(e.participants) ? e.participants.map(String) : []).filter(id => state.kidIds.includes(id));
    // Найближча подія, в списку учасників якої є мій спортсмен
    const myEv = canSee('events') ? ev.find(e => going(e).length) : null;
    let myEvBlock = '';
    if (myEv) {
      const dd = Math.round((new Date(myEv.date + 'T12:00') - new Date(t + 'T12:00')) / 864e5);
      const whenEv = dd === 0 ? 'сьогодні' : dd === 1 ? 'завтра' : `через ${dd} дн.`;
      const who = kids.length > 1 || !isAthleteM()
        ? going(myEv).map(id => kids.find(a => String(a.id) === id)?.full_name).filter(Boolean).map(firstNameOf).join(', ') : '';
      myEvBlock = `<a class="now${dd <= 7 ? '' : ' soon'}" href="#events"><i class="dot"></i>
        <div><b>${icon('belt')}${isAthleteM() && kids.length === 1 ? 'Твоя наступна подія' : 'Наступна подія'}: ${whenEv}</b>
          <span>${esc(myEv.title)} · ${fmtDate(myEv.date, { weekday: 'short', day: 'numeric', month: 'long' })}${myEv.place ? ' · ' + esc(myEv.place) : ''}${who ? '<br>Бере участь: ' + esc(who) : ''}</span></div><i class="go">›</i></a>`;
    }
    const evHtml = ev.length && canSee('events') ? `<h3>Найближчі події</h3><div class="list">${ev.slice(0, 3).map(e => {
        const g = going(e).map(id => kids.find(a => String(a.id) === id)?.full_name).filter(Boolean).map(firstNameOf);
        return `<a class="row" href="#events"><div><strong>${esc(e.title)}</strong>
          <span>${fmtDate(e.date, { weekday: 'short', day: 'numeric', month: 'long' })}${e.place ? ' · ' + esc(e.place) : ''}</span>
          ${g.length ? `<span style="color:var(--ok)">${icon('belt')}бере участь: ${esc(g.join(', '))}</span>` : ''}</div><span class="chev">›</span></a>`;
      }).join('')}</div>` : '';
    // Оголошення: важливі за 3 тижні + звичайні за тиждень, максимум 2; решта — у вкладці «Оголошення»
    const fresh = news.filter(n => n.important || Date.now() - new Date(n.created_at) < 7 * 864e5).slice(0, 2);
    const newsHtml = fresh.length && canSee('news') ? `<div class="sec"><h3>Оголошення</h3><a class="link small" href="#news">усі ›</a></div>
      <div class="list">${fresh.map(n => annItem(n, false)).join('')}</div>` : '';
    const tile = (route, ic, title, sub) =>
      `<a class="tile" href="#${route}"><span class="ic">${icon(ic)}</span><span><strong>${title}</strong><small>${sub}</small></span></a>`;

    // Пробна версія: стиль Monobank + «Готовність» для старшої групи
    let monoTop = '', readyHtml = '', monoFeed = '';
    if (kids.length && isAthleteM() && canReady(kids[0])) readyHtml = await readyCardHtml(kids[0]).catch(() => '');
    if (BETA && kids.length) {
      const k = kids[0];
      const visits = att.filter(x => String(x.athlete_id) === String(k.id)).length;
      const days = new Set(schAll.filter(s => forKid(s, k)).map(s => Number(s.weekday)));
      let planned = 0; for (let d = monthStart; d <= t; d = shiftDate(d, 1)) if (days.has(weekdayOf(d))) planned++;
      const pct = planned ? Math.min(100, Math.round(visits / planned * 100)) : null, place = placeOf.get(String(k.id));
      const main = beltMain(k.belt) || '#3a3d44', stripe = /смуж/i.test(k.belt || '') ? (/^\s*1\s*кю/i.test(k.belt) ? BELT_GOLD : BELT_SILVER) : main;
      monoTop = `<div class="m-hero"><span>Тренувань у ${MONTHS_IN[Number(ym.slice(5)) - 1]}</span>
          <b>${visits}${planned ? `<small> / ${planned}</small>` : ''}</b>
          <em class="ok">${[pct !== null ? pct + '% відвідуваність' : '', place ? place + ' місце в рейтингу' : ''].filter(Boolean).join(' · ')}</em></div>
        <a class="m-card" href="#athlete/${encodeURIComponent(k.id)}"><i class="m-belt" style="background:${main}"></i><i class="m-stripe" style="background:${stripe}"></i>
          <div class="m-card-top"><span>${esc(TEAM.brand || 'FERENTS TEAM')}</span><span>${esc([k.section, k.group_name].filter(Boolean).join(' · '))}</span></div>
          <div class="m-card-bot"><div><b>${esc(k.full_name)}</b><span>${esc(k.belt || 'Пояс не вказано')}</span></div>${kids.length > 1 ? `<span>+${kids.length - 1}</span>` : ''}</div></a>
        <div class="m-acts">${[canSee('schedule') && ['schedule', 'training', 'Розклад', '#3b82f6'], canSee('rating') && ['rating', 'events', 'Рейтинг', '#eab308'],
          canNutri(k) && ['nutrition/' + encodeURIComponent(k.id), 'drop', 'Харчування', '#22c55e'], canSee('news') && ['news', 'news', 'Новини', '#d946ef'],
          canSee('events') && ['events', 'calendar', 'Події', '#f97316']].filter(Boolean).slice(0, 4).map(([r, ic, l, c]) =>
          `<a href="#${r}" style="--mc:${c}"><span>${icon(ic)}</span>${l}</a>`).join('')}</div>`;
      const visitsList = att.filter(x => String(x.athlete_id) === String(k.id)).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 3);
      const feed = [
        ...ev.filter(e => going(e).length).slice(0, 2).map(e => ({ d: e.date, ic: 'trophy', c: '#eab308', t: e.title, s: fmtDate(e.date, { day: 'numeric', month: 'long' }) + (e.place ? ' · ' + e.place : ''), v: (() => { const dd = Math.round((new Date(e.date + 'T12:00') - new Date(t + 'T12:00')) / 864e5); return dd === 0 ? 'сьогодні' : dd === 1 ? 'завтра' : 'через ' + dd + ' дн'; })(), vc: '#eab308', href: '#events' })),
        ...visitsList.map(x => ({ d: x.date, ic: 'check', c: '#22c55e', t: 'Тренування', s: fmtDate(x.date, { weekday: 'long', day: 'numeric', month: 'long' }), v: '+1', vc: '#22c55e', href: '#athlete/' + encodeURIComponent(k.id) })),
      ];
      monoFeed = feed.length ? `<h3>Історія</h3><div class="list m-feed">${feed.map(f => `<a class="row" href="${f.href}"><span class="m-ic" style="--mc:${f.c}">${icon(f.ic)}</span>
          <div class="grow"><strong>${esc(f.t)}</strong><span>${esc(f.s)}</span></div><b class="m-val" style="color:${f.vc}">${f.v}</b></a>`).join('')}</div>` : '';
    }
    $('#view').innerHTML = `
      ${monoTop}
      ${readyHtml}
      ${installCard()}
      ${pushC}
      ${myEvBlock}
      ${nextBlock}
      ${monoFeed}
      ${kids.length ? `<h3>${kids.length > 1 ? 'Мої спортсмени' : (isAthleteM() ? 'Моя картка' : 'Мій спортсмен')}</h3><div class="list">${kids.map(kidCard).join('')}</div>` : noKids}
      ${pollsNow.length ? `<a class="now soon" href="#news"><i class="dot"></i>
        <div><b>${icon('chart')}Нове опитування${pollsNow.length > 1 ? ' (' + pollsNow.length + ')' : ''}</b><span>${esc(pollsNow[0].question)} · відповісти ›</span></div><i class="go">›</i></a>` : ''}
      ${newsHtml}
      ${evHtml}
      <div class="tiles">
        ${canSee('schedule') ? tile('schedule', 'training', 'Розклад', 'Дні, час і зал') : ''}
        ${canSee('links') ? tile('links', 'links', 'Відео', 'Ката і техніка') : ''}
        ${canSee('plans') && !isAthleteM() ? tile('plans', 'plans', 'Завдання', 'На тренування') : ''}
        ${canSee('chat') && !isAthleteM() ? tile('chat', 'chat', 'Чат', 'Чат команди') : ''}
        ${canSee('rating') ? tile('rating', 'events', 'Рейтинг', 'Місця та заслуги') : ''}
        ${isAthleteM() ? tile('timer', 'timer', 'Таймер', 'Табата, EMOM, секундомір') : ''}
        ${canSee('news') ? tile('news', 'news', 'Оголошення', 'Усі новини') : ''}
        ${kids.filter(canNutri).slice(0, 1).map(a => tile('nutrition/' + encodeURIComponent(a.id), 'drop', 'Харчування і сон', 'БЖВ, рецепти, відновлення')).join('')}
      </div>`;
  }

  // Вік і підпис дати народження
  function ageOf(a) {
    if (!a.birth_date) return null;
    const b = new Date(a.birth_date + 'T12:00'), n = new Date();
    let age = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) age--;
    return age;
  }
  function yearsWord(n) {
    const d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return 'рік';
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return 'роки';
    return 'років';
  }
  // Найближчий день народження: { days, age, date }
  function nextBirthday(a) {
    if (!a.birth_date) return null;
    const [y, m, d] = a.birth_date.split('-').map(Number);
    const t = today(), ty = Number(t.slice(0, 4));
    const mk = yr => {
      // 29 лютого в невисокосний рік святкуємо 28-го
      const leap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0;
      const dd = (m === 2 && d === 29 && !leap) ? 28 : d;
      return `${yr}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
    };
    let date = mk(ty), yr = ty;
    if (date < t) { yr = ty + 1; date = mk(yr); }
    const days = Math.round((new Date(date + 'T12:00') - new Date(t + 'T12:00')) / 864e5);
    return { days, age: yr - y, date };
  }
  function bdayMark(a) {
    const b = nextBirthday(a);
    if (!b || b.days > 7) return '';
    return b.days === 0 ? ' ' + icon('cake') + 'сьогодні!' : ' ' + icon('cake');
  }

  function birthLabel(a) {
    const age = ageOf(a);
    if (age !== null) return `${age} ${yearsWord(age)}`;
    return a.birth_year ? a.birth_year + ' р.н.' : '';
  }
  function fmtKg(w) { return Number(w).toLocaleString('uk-UA', { maximumFractionDigits: 1 }) + ' кг'; }

  // Остання вага кожного спортсмена: Map(id → {weight, date})
  async function lastWeights() {
    const { data } = await db.from('weights').select('athlete_id, weight, date').order('date', { ascending: false });
    const m = new Map();
    (data || []).forEach(w => { if (!m.has(String(w.athlete_id))) m.set(String(w.athlete_id), w); });
    return m;
  }

  // ----- Спортсмени -----
  // ----- Додати спортсменів списком (вставити з нотаток, Excel, Google Таблиць) -----
  // Рядок: «Імʼя Прізвище» + за бажання через кому/Tab: рік або дата народження, група, секція
  function parseAthleteLines(text, defGroup, defSection) {
    const norm = s => s.toLowerCase().replace(/[’'`ʼ]/g, '');
    const groupOf = s => GROUPS.find(g => norm(s).startsWith(norm(g).slice(0, 5)));
    const sectionOf = s => SECTIONS.find(x => norm(s).startsWith(norm(x).slice(0, 4)));
    return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.split(/\t|;|,/).map(s => s.trim()).filter(Boolean);
      const row = { full_name: '', group_name: defGroup || null, section: defSection || null, birth_date: null, birth_year: null };
      const nameParts = [];
      for (const p of parts) {
        let m;
        if ((m = p.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/))) {
          row.birth_date = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; row.birth_year = Number(m[3]);
        } else if ((m = p.match(/^(\d{4})-(\d{2})-(\d{2})$/))) { row.birth_date = p; row.birth_year = Number(m[1]); }
        else if (/^(19|20)\d{2}( ?р\.?(н\.?)?)?$/i.test(p)) row.birth_year = Number(p.slice(0, 4));
        else if (groupOf(p)) row.group_name = groupOf(p);
        else if (sectionOf(p)) row.section = sectionOf(p);
        else if (/^\d+[.)]?$/.test(p)) continue; // номер рядка «1.»
        else nameParts.push(p);
      }
      row.full_name = nameParts.join(' ').replace(/^\d+[.)]\s*/, '').replace(/\s+/g, ' ').trim();
      return row;
    }).filter(r => r.full_name.length > 1);
  }

  function bulkAthletes(existing) {
    const have = new Set(existing.map(a => a.full_name.toLowerCase().replace(/\s+/g, ' ').trim()));
    const dlg = $('#dlg');
    dlg.innerHTML = `<form><h3>Додати списком</h3>
      <p class="muted small" style="margin:4px 0 8px">Вставте список: <b>одна людина — один рядок</b>. Можна скопіювати з нотаток, Viber, Excel чи Google Таблиць.
        Після імені через кому можна дописати рік або дату народження, групу й секцію — або вибрати їх нижче для всіх одразу.</p>
      <textarea id="bulkText" rows="8" style="width:100%" placeholder="Петренко Іван, 2015\nКоваль Марія, 03.05.2014\nШевчук Олег"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        ${state.hasSection !== false ? `<label style="flex:1;min-width:130px">Секція<select id="bulkSec"><option value="">— з рядка —</option>${SECTIONS.map(s => `<option ${state.section === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}
        <label style="flex:1;min-width:130px">Група<select id="bulkGroup"><option value="">— з рядка —</option>${GROUPS.map(g => `<option ${state.group === g ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
      </div>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="bulkSwap">У списку спочатку імʼя — переставити, щоб першим було прізвище</label>
      <div id="bulkPrev" class="small" style="margin-top:10px"></div>
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn" id="bulkGo" disabled>Додати</button></div></form>`;
    const form = dlg.querySelector('form');
    let rows = [];
    const preview = () => {
      const all = parseAthleteLines($('#bulkText').value, $('#bulkGroup').value, $('#bulkSec') ? $('#bulkSec').value : '');
      if ($('#bulkSwap').checked) all.forEach(r => { r.full_name = surnameFirst(r.full_name); });
      const seen = new Set();
      rows = all.filter(r => { const k = r.full_name.toLowerCase(); if (have.has(k) || seen.has(k)) return false; seen.add(k); return true; });
      const dup = all.length - rows.length;
      const noGroup = rows.filter(r => !r.group_name).length;
      const noSec = $('#bulkSec') ? rows.filter(r => !r.section).length : 0;
      $('#bulkPrev').innerHTML = all.length ? `
        <b>Буде додано: ${rows.length}</b>${dup ? ` <span class="muted">· пропущено ${dup} (вже є в списку або повтор)</span>` : ''}
        ${noGroup || noSec ? `<div class="err" style="margin-top:4px">${icon('alert')}${noGroup ? `Без групи: ${noGroup}. ` : ''}${noSec ? `Без секції: ${noSec}. ` : ''}Виберіть вище для всіх або допишіть у рядки.</div>` : ''}
        <div class="list" style="margin-top:6px;max-height:200px;overflow:auto">${rows.map(r => `<div class="row" style="cursor:default;padding:6px 10px">
          <div><strong style="font-size:14px">${esc(r.full_name)}</strong><span>${esc([r.section, r.group_name, r.birth_date ? fmtDate(r.birth_date, { day: '2-digit', month: '2-digit', year: 'numeric' }) : r.birth_year].filter(Boolean).join(' · '))}</span></div></div>`).join('')}</div>` : '';
      $('#bulkGo').disabled = !rows.length || noGroup > 0 || noSec > 0;
      $('#bulkGo').textContent = rows.length ? `Додати ${rows.length}` : 'Додати';
    };
    form.oninput = preview; form.onchange = preview;
    form.querySelector('[data-act=cancel]').onclick = () => dlg.close();
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = $('#bulkGo'); btn.disabled = true;
      try {
        const data = rows.map(r => {
          const o = { full_name: r.full_name, group_name: r.group_name, active: true };
          if ($('#bulkSec')) o.section = r.section;
          if (r.birth_date) o.birth_date = r.birth_date;
          if (r.birth_year) o.birth_year = r.birth_year;
          return o;
        });
        await q(db.from('athletes').insert(data));
        dlg.close(); toast(`Додано спортсменів: ${data.length}`); render();
      } catch (err) { btn.disabled = false; }
    };
    dlg.showModal();
    setTimeout(() => $('#bulkText').focus(), 50);
  }

  // ----- Імʼя ↔ прізвище: «Іван Петренко» → «Петренко Іван» -----
  // Останнє слово стає першим (по батькові, якщо є, лишається після імені)
  function surnameFirst(name) {
    const p = String(name || '').trim().split(/\s+/);
    return p.length > 1 ? [p[p.length - 1], ...p.slice(0, -1)].join(' ') : p.join(' ');
  }
  // Імʼя для звертання (у базі тепер «Прізвище Імʼя»)
  function firstNameOf(full) {
    const p = String(full || '').trim().split(/\s+/);
    return p.length > 1 ? p[1] : p[0];
  }
  function swapNames(list) {
    const people = list.filter(a => a.full_name.trim().split(/\s+/).length > 1);
    const on = new Set(people.map(a => String(a.id)));
    const dlg = $('#dlg');
    dlg.innerHTML = `<form><h3>Спочатку прізвище</h3>
      <p class="muted small" style="margin:4px 0 8px">Перевірте список. <b>Зніміть галочку</b> з тих, у кого прізвище вже стоїть першим — їх не буде змінено.</p>
      <div class="pick-tools"><span class="muted small" id="swCount"></span>
        <button type="button" class="linkbtn" id="swAll">усі</button> · <button type="button" class="linkbtn" id="swNone">жодного</button></div>
      <div class="list pick-list" id="swList" style="max-height:50vh;overflow:auto"></div>
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn" id="swGo">Змінити</button></div></form>`;
    const draw = () => {
      $('#swList').innerHTML = people.map(a => `<label class="row tick">
          <span><strong>${esc(on.has(String(a.id)) ? surnameFirst(a.full_name) : a.full_name)}</strong>
            <span>${on.has(String(a.id)) ? 'було: ' + esc(a.full_name) : 'без змін'}</span></span>
          <input type="checkbox" data-sw="${esc(a.id)}" ${on.has(String(a.id)) ? 'checked' : ''}></label>`).join('') || '<div class="empty">Немає кого змінювати</div>';
      $('#swCount').textContent = `Буде змінено: ${on.size} з ${people.length}`;
      $('#swGo').disabled = !on.size;
    };
    const form = dlg.querySelector('form');
    form.onchange = e => {
      const b = e.target.closest('[data-sw]'); if (!b) return;
      b.checked ? on.add(b.dataset.sw) : on.delete(b.dataset.sw); draw();
    };
    form.onclick = e => {
      if (e.target.closest('[data-act=cancel]')) dlg.close();

    };
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = $('#swGo'); btn.disabled = true;
      const todo = people.filter(a => on.has(String(a.id)));
      let done = 0;
      try {
        for (const a of todo) {
          await q(db.from('athletes').update({ full_name: surnameFirst(a.full_name) }).eq('id', a.id));
          btn.textContent = `${++done} / ${todo.length}`;
        }
        dlg.close();
        toast(`Змінено: ${done}`, false, { label: 'Скасувати', fn: async () => {
          for (const a of todo) await q(db.from('athletes').update({ full_name: a.full_name }).eq('id', a.id));
          toast('Повернуто'); render();

        render();
      } catch (err) { dlg.close(); render(); }
    };

  }

  // ===== Хто підключився: застосунок і Telegram (лише тренер) =====
  async function linkStatus() {
    const [mem, ma, tg] = await Promise.all([
      db.from('members').select('email, role, full_name'),
      db.from('member_athletes').select('email, athlete_id'),
      db.rpc('coach_tg_links'),
    ]);
    if (mem.error || ma.error) return null;
    const tgAt = tg.error ? null : new Map((tg.data || []).map(r => [String(r.email).toLowerCase(), r.connected_at]));
    const memOf = new Map((mem.data || []).map(m => [String(m.email).toLowerCase(), m]));
    const by = new Map(); // athlete_id → { app, tg, people: [{ email, role, name, tgAt }] }
    for (const r of ma.data || []) {
      const e = String(r.email).toLowerCase();
      const m = memOf.get(e);
      if (m && m.role === 'coach') continue;
      const id = String(r.athlete_id);
      const st = by.get(id) || { app: false, tg: false, people: [] };
      const at = tgAt ? tgAt.get(e) : null;
      st.app = true;
      if (at) st.tg = true;
      st.people.push({ email: e, role: m?.role || '', name: m?.full_name || e, tgAt: at || null });
      by.set(id, st);
    }
    return { by, tgOk: !!tgAt };
  }
  function linkMarks(st) {
    if (!st) return '';
    return ` <span class="lk" title="${st.tg ? 'Застосунок і Telegram' : 'Є акаунт у застосунку'}">${icon('phone')}${st.tg ? icon('send') : ''}</span>`;
  }
  async function connectionsView() {
    setActions('');
    const [ath, ls] = await Promise.all([q(db.from('athletes').select('*').order('full_name')), linkStatus()]);
    if (!ls) { $('#view').innerHTML = sqlCard('Батьки бачать лише свою дитину', KIDS_SQL); return; }
    const active = ath.filter(isActive);
    const noApp = [], noTg = [], ok = [];
    for (const a of active) {
      const st = ls.by.get(String(a.id));
      (!st ? noApp : st.tg ? ok : noTg).push(a);
    }
    const nameOf = new Map(ath.map(a => [String(a.id), a.full_name]));
    const who = st => st ? st.people.map(p => `${ROLES[p.role] || 'Акаунт'}${p.tgAt ? ' ✈️' : ''}`).join(', ') : '';
    const row = a => {
      const st = ls.by.get(String(a.id));
      return `<a class="row" href="#athlete/${encodeURIComponent(a.id)}">
        <div class="grow"><strong>${esc(a.full_name)}${linkMarks(st)}</strong><span>${esc([groupLabel(a), who(st)].filter(Boolean).join(' · '))}</span></div>
        <span class="chev">›</span></a>`;
    };
    const block = (title, list, hint) => list.length ? `<h3 style="margin:18px 0 6px">${title} — ${list.length}</h3>
      ${hint ? `<p class="muted small" style="margin:0 0 8px">${hint}</p>` : ''}
      <div class="list">${list.map(row).join('')}</div>` : '';
    // Останні підключення Telegram
    const recent = [];
    for (const [id, st] of ls.by) for (const p of st.people) if (p.tgAt) recent.push({ id, p });
    recent.sort((x, y) => String(y.p.tgAt).localeCompare(String(x.p.tgAt)));
    const seen = new Set();
    const recentRows = recent.filter(r => { const k = r.p.email + '|' + r.id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 15)
      .map(r => `<div class="row" style="cursor:default"><div class="grow"><strong>${esc(nameOf.get(r.id) || '—')}</strong>
        <span>${esc(ROLES[r.p.role] || 'Акаунт')} · ${new Date(r.p.tgAt).toLocaleString('uk-UA', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}</span></div></div>`).join('');
    $('#view').innerHTML = `
      ${ls.tgOk ? '' : sqlCard('Бачити, хто підключив Telegram', STATUS_SQL)}
      <div class="stats">
        <div class="stat"><b>${active.length - noApp.length}/${active.length}</b><span>${icon('phone')}у застосунку</span></div>
        <div class="stat"><b>${ls.tgOk ? ok.length + '/' + active.length : '—'}</b><span>${icon('send')}з Telegram</span></div>
      </div>
      ${block('Без застосунку', noApp, 'Ніхто з батьків чи сам спортсмен ще не зареєструвався. Надішліть посилання з розділу «Учасники».')}
      ${ls.tgOk ? block('Без Telegram', noTg, 'Є акаунт, але Telegram не підключено: Налаштування → Підключити Telegram.') : ''}
      ${block(ls.tgOk ? 'Все підключено' : 'Є акаунт у застосунку', ls.tgOk ? ok : [...noTg, ...ok])}
      ${recentRows ? `<h3 style="margin:18px 0 6px">Останні підключення Telegram</h3><div class="list">${recentRows}</div>` : ''}`;
  }

  // ----- Рейтинг: тренер сам додає спортсменів і розставляє місця -----
  // Місця завжди 1, 2, 3… без пропусків
  async function renumberRating(list) {
    const rated = list || await q(db.from('athletes').select('id, rating_place').not('rating_place', 'is', null).order('rating_place'));
    for (let i = 0; i < rated.length; i++) {
      if (rated[i].rating_place !== i + 1) await q(db.from('athletes').update({ rating_place: i + 1 }).eq('id', rated[i].id));
    }
  }
  // Рейтинг для батьків і спортсменів: лише перегляд
  async function memberRatingView() {
    setActions('');
    const { data, error } = await db.rpc('team_rating');
    if (error) { $('#view').innerHTML = '<div class="empty">Рейтинг поки недоступний</div>'; return; }
    const mine = new Set((await q(db.from('athletes').select('id'))).map(a => String(a.id)));
    const rows = data || [];
    const pod = podiumHtml(rows, () => '', a => mine.has(String(a.id)) ? '#athlete/' + encodeURIComponent(a.id) : '');
    $('#view').innerHTML = `${pod}<div class="list rating">${rows.map((a, i) => {

                   : `<div class="row" style="cursor:default">${body}</div>`;

  async function ratingView() {
    if (!isCoach()) return memberRatingView();
    const ath = await q(db.from('athletes').select('*').order('full_name'));
    noteSection(ath);
    if (!state.hasMerits) {
      setActions('');
      $('#view').innerHTML = athTabs('rating') + sqlCard('Рейтинг і заслуги спортсменів', MERITS_SQL);
      return;
    }
    const edit = !!state.ratingEdit;
    setActions(`<button class="btn ${edit ? '' : 'light'}" id="editRating">${edit ? 'Готово' : 'Редагувати'}</button>`);
    $('#editRating').onclick = () => { state.ratingEdit = !edit; render(); };
    const rated = ath.filter(a => a.rating_place).sort((x, y) => x.rating_place - y.rating_place);
    const urlOf = state.hasPhoto ? await photoUrls(rated.map(a => a.photo)).catch(() => () => '') : () => '';

      <div class="list rating">${rated.map((a, i) => {
        if (!edit && rated.length >= 3 && i < 3) return '';
        const body = `<span class="rank ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</span>
          ${avatarHtml(a, urlOf(a.photo))}
          <div class="grow"><strong>${beltTag(a.belt)}${esc(a.full_name)}</strong>

        return edit
          ? `<div class="row" style="cursor:default">${body}
              <div class="rank-tools"><button type="button" data-up="${i}" ${i ? '' : 'disabled'} aria-label="Вище">↑</button>
                <button type="button" data-down="${i}" ${i < rated.length - 1 ? '' : 'disabled'} aria-label="Нижче">↓</button>
                <button type="button" class="x" data-out="${i}" aria-label="Прибрати">✕</button></div></div>`
          : `<a class="row" href="#athlete/${encodeURIComponent(a.id)}">${body}<span class="chev">›</span></a>`;
      }).join('') || `<div class="empty">У рейтингу ще нікого немає. Натисніть «Редагувати» → «+ Додати спортсмена», або відкрийте картку спортсмена → «${trophy()} Додати до рейтингу».</div>`}</div>
      ${!edit && rated.length ? '<p class="muted small" style="margin:12px 4px 0">Щоб змінити порядок, натисніть «Редагувати». Заслуги вписуються в анкеті спортсмена.</p>' : ''}`;

    const move = async (i, j) => {
      [rated[i], rated[j]] = [rated[j], rated[i]];
      await renumberRating(rated); render();
    };
    $('#view').onclick = async e => {
      const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]'), out = e.target.closest('[data-out]');
      if (up) return move(Number(up.dataset.up), Number(up.dataset.up) - 1);
      if (down) return move(Number(down.dataset.down), Number(down.dataset.down) + 1);
      if (out) {
        const a = rated[Number(out.dataset.out)];
        await q(db.from('athletes').update({ rating_place: null }).eq('id', a.id));
        await renumberRating(rated.filter(x => x !== a));
        toast('Прибрано з рейтингу', false, { label: 'Скасувати', fn: async () => {
          await q(db.from('athletes').update({ rating_place: rated.length + 1 }).eq('id', a.id)); await renumberRating(); render(); } });
        render();
      }
      if (e.target.closest('#addRated')) addToRating(ath.filter(a => !a.rating_place && isActive(a)), rated.length);
    };
  }
  // Вибір спортсменів, яких додати в кінець рейтингу
  function addToRating(people, count) {
    const dlg = $('#dlg');
    const chosen = [];
    let search = '';
    dlg.innerHTML = `<form><h3>Додати до рейтингу</h3>
      <input type="search" id="rSearch" placeholder="Пошук за імʼям" style="margin-top:10px">

        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn">Додати</button></div></form>`;
    const draw = () => {
      $('#rList').innerHTML = people.filter(a => !search || a.full_name.toLowerCase().includes(search.toLowerCase())).map(a => `<label class="row tick">
          <span><strong>${beltTag(a.belt)}${esc(a.full_name)}</strong><span>${esc([a.section, a.group_name, beltShort(a.belt)].filter(Boolean).join(' · '))}${a.achievements ? ' · ' + trophy() + ' є заслуги' : ''}</span></span>
          <input type="checkbox" data-rid="${esc(a.id)}" ${chosen.includes(String(a.id)) ? 'checked' : ''}></label>`).join('') || '<div class="empty">Нікого не знайдено</div>';
    };
    const form = dlg.querySelector('form');
    form.onchange = e => {
      const b = e.target.closest('[data-rid]'); if (!b) return;
      const i = chosen.indexOf(b.dataset.rid);
      if (b.checked && i < 0) chosen.push(b.dataset.rid); else if (!b.checked && i >= 0) chosen.splice(i, 1);
      $('#rCount').textContent = `Вибрано: ${chosen.length}`;
    };
    form.onclick = e => { if (e.target.closest('[data-act=cancel]')) dlg.close(); };
    $('#rSearch').oninput = e => { search = e.target.value; draw(); };
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector('[type=submit]'); btn.disabled = true;
      try {
        for (let i = 0; i < chosen.length; i++) {
          await q(db.from('athletes').update({ rating_place: count + i + 1 }).eq('id', people.find(a => String(a.id) === chosen[i]).id));

        dlg.close(); toast(`Додано: ${chosen.length}`); render();
      } catch (err) { btn.disabled = false; }
    };
    draw();
    dlg.showModal();
  }

        { name: 'notes', label: 'Нотатки', type: 'textarea' },
        { name: 'active', label: 'Активний (ходить на тренування)', type: 'checkbox' },
      ],
      onSave: async obj => {
        const weight = obj.weight;
        delete obj.weight;
        obj.birth_year = obj.birth_date ? Number(obj.birth_date.slice(0, 4)) : (a ? a.birth_year : null);
        let id = a && a.id;
        if (a) await q(db.from('athletes').update(obj).eq('id', a.id));
        else id = (await q(db.from('athletes').insert(obj).select('id').single())).id;
        if (weight !== null && weight !== lastWeight) {
          await write('weights', 'upsert', [{ athlete_id: id, date: today(), weight }]);
        }
        // Фото зберігаємо окремо: якщо не вийде, решта анкети вже збережена
        if (photoNew || photoRemove) {
          try {
            let path = null;
            if (photoNew) {
              path = `${id}/${Date.now()}.jpg`;
              const { error } = await db.storage.from(PHOTO_BUCKET).upload(path, photoNew, { contentType: 'image/jpeg' });
              if (error) throw error;
            }
            await q(db.from('athletes').update({ photo: path }).eq('id', id));
            if (a && a.photo) db.storage.from(PHOTO_BUCKET).remove([a.photo]);
          } catch (err) { toast('Анкету збережено, але фото — ні: ' + (err.message || err), true); }
        }
      },
      onDelete: a ? async () => { await q(db.from('athletes').delete().eq('id', a.id)); location.hash = '#athletes'; } : null,
      deleteText: 'Видалити спортсмена разом з усією історією відвідувань, оплат і ваги?\n\nЯкщо він просто перестав ходити — краще зніміть галочку «Активний».',
    });
    const fileIn = $('#phFile');
    if (fileIn) fileIn.onchange = async () => {
      const f = fileIn.files[0];
      fileIn.value = '';
      if (!f) return;
      try {
        const blob = await compressPhoto(f);
        if (!blob) return;
        photoNew = blob; photoRemove = false;
        $('#dlg .photo-edit .avatar').innerHTML = `<img src="${URL.createObjectURL(photoNew)}" alt="">`;
      } catch (e) { toast('Не вдалося відкрити фото', true); }
    };
    const delPh = $('#phDel');
    if (delPh) delPh.onclick = () => { photoRemove = true; photoNew = null; $('#dlg .photo-edit .avatar').textContent = initialsOf(a.full_name); };
    const sqlBtn = $('#phSql');
    if (sqlBtn) sqlBtn.onclick = () => copyText(PHOTO_SQL, 'SQL скопійовано — вставте в Supabase → SQL Editor');
  }

  // ----- Сторінка спортсмена -----
  async function athleteView() {
    setActions('');
    const found = await q(db.from('athletes').select('*').eq('id', state.param));
    noteSection(found);
    const a = found[0];
    if (!a) {
      $('#view').innerHTML = '<div class="empty">Спортсмена не знайдено. <a class="link" href="#athletes">До списку</a></div>';
      return;
    }
    const coach = isCoach();
    if (coach) {
      setActions('<button class="btn light" id="editBtn">Змінити</button>');
      $('#editBtn').onclick = () => athleteForm(a);
    }

    const t = today(), ym = t.slice(0, 7), monthStart = ym + '-01';
    const firstMonth = shiftMonth(ym, -5);
    const [att0, pays0, grs, wts0, sch] = await Promise.all([
      q(db.from('attendance').select('athlete_id, date').eq('athlete_id', a.id).eq('present', true).gte('date', firstMonth + '-01')),
      coach ? q(db.from('payments').select('athlete_id, month, amount, paid_at').eq('athlete_id', a.id).gte('month', firstMonth + '-01')) : [],
      q(db.from('gradings').select('*').eq('athlete_id', a.id).order('date', { ascending: false })),
      q(db.from('weights').select('athlete_id, date, weight').eq('athlete_id', a.id).order('date', { ascending: false }).limit(20)),
      q(db.from('schedule').select('weekday, group_name')),
    ]);
    // Для батьків місце в рейтингу беремо із загального рейтингу
    if (!coach && !a.rating_place) {
      const r = await db.rpc('team_rating');
      a.rating_place = ((r.data || []).find(x => String(x.id) === String(a.id)) || {}).rating_place || null;
    }
    const myEvs = ((await db.from('events').select('*').order('date')).data || [])
      .filter(e => Array.isArray(e.participants) && e.participants.map(String).includes(String(a.id)));
    const evs = myEvs.filter(e => e.date >= today());
    const resEvs = myEvs.filter(e => resultsOf(e, a.id).length).reverse();
    const medalN = p => resEvs.reduce((n, e) => n + resultsOf(e, a.id).filter(x => x.p === p).length, 0);
    const wlAll = winLoss(resEvs.flatMap(e => resultsOf(e, a.id)));
    const mine = r => String(r.athlete_id) === String(a.id);
    const att = withPending('attendance', att0, r => mine(r) && r.date >= firstMonth + '-01').filter(r => r.present !== false);
    const pays = withPending('payments', pays0, r => mine(r) && r.month >= firstMonth + '-01');
    const wts = withPending('weights', wts0, mine).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 20);

    // Відвідування цього місяця і % від тренувань за розкладом його групи
    const visits = att.filter(x => x.date >= monthStart).length;
    const days = new Set(sch.filter(s => s.group_name === a.group_name).map(s => s.weekday));
    let planned = 0;
    for (let d = monthStart; d <= t; d = shiftDate(d, 1)) if (days.has(weekdayOf(d))) planned++;
    const pct = planned ? Math.min(100, Math.round(visits / planned * 100)) : null;
    const payOf = new Map(pays.map(p => [p.month.slice(0, 7), p]));
    const paidNow = payOf.has(ym);

    // Шапка
    const photoUrl = a.photo ? (await photoUrls([a.photo]).catch(() => () => ''))(a.photo) : '';
    const nb = nextBirthday(a);
    const bdayLine = nb && nb.days <= 7 ? (nb.days === 0 ? ' · ' + icon('party') + 'сьогодні ДН!' : ` · ${icon('cake')}${fmtDate(nb.date)}`) : '';
    const sub = [a.section, a.group_name || 'Без групи', birthLabel(a), isActive(a) ? '' : 'неактивний'].filter(Boolean).join(' · ');
    const phone = a.phone ? a.phone.replace(/[^\d+]/g, '') : '';

    // Відвідування за 6 місяців
    const months = [...Array(6)].map((_, i) => shiftMonth(firstMonth, i));
    const perMonth = months.map(m => att.filter(x => x.date.startsWith(m)).length);
    const maxV = Math.max(1, ...perMonth);
    const short = m => MONTHS[Number(m.slice(5)) - 1].slice(0, 3);

    // Графік ваги (від старих до нових)
    const wl = wts.slice().reverse().map(w => ({ date: w.date, kg: Number(w.weight) }));
    const lastW = wl[wl.length - 1];
    let weightHtml = '<div class="empty" style="padding:0">Зважувань ще немає. Натисніть «+ Записати вагу».</div>';
    if (wl.length === 1) weightHtml = `<p style="margin:0"><b>${fmtKg(wl[0].kg)}</b> <span class="muted small">· ${fmtDate(wl[0].date)}</span>
      <button type="button" class="linkbtn" data-wedit="0" style="margin-left:6px">змінити</button></p>`;
    if (wl.length > 1) {
      const W = 320, H = 150, L = 34, R = 14, T = 22, B = 24;
      let lo = Math.min(...wl.map(w => w.kg)), hi = Math.max(...wl.map(w => w.kg));
      if (hi - lo < 2) { lo -= 1; hi += 1; }
      const x = i => L + (W - L - R) * i / (wl.length - 1);
      const y = kg => T + (H - T - B) * (1 - (kg - lo) / (hi - lo));
      const kgTxt = n => n.toLocaleString('uk-UA', { maximumFractionDigits: 1 });
      const ticks = [hi, (hi + lo) / 2, lo];
      const last = wl[wl.length - 1];
      weightHtml = `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік ваги">
          ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
            <text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kgTxt(v)}</text>`).join('')}
          <text class="axis" x="${L}" y="${H - 6}">${fmtDate(wl[0].date, { day: '2-digit', month: '2-digit' })}</text>
          <text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last.date, { day: '2-digit', month: '2-digit' })}</text>
          <polyline class="line" points="${wl.map((w, i) => `${x(i)},${y(w.kg)}`).join(' ')}"/>
          ${wl.map((w, i) => `<circle class="pt" r="4" cx="${x(i)}" cy="${y(w.kg)}" data-i="${i}"/>`).join('')}
          <text class="lbl" x="${x(wl.length - 1)}" y="${y(last.kg) - 10}" text-anchor="end">${kgTxt(last.kg)} кг</text>
          ${wl.map((w, i) => `<rect class="hit" x="${x(i) - 14}" y="0" width="28" height="${H}" data-i="${i}"/>`).join('')}
        </svg>
        <div class="wcap" id="wcap">Натисніть на точку, щоб побачити дату й вагу або виправити її</div>`;
    }

    const grHtml = grs.length ? grs.map(g => `<div class="row" data-gid="${esc(g.id)}">
        <div><strong>${beltTag(g.belt)}${esc(g.belt)}</strong><span>${fmtDate(g.date)} ${g.date.slice(0, 4)}${g.note ? ' · ' + esc(g.note) : ''}</span></div>
        <span class="badge ${g.passed ? 'ok' : 'bad'}">${g.passed ? 'здав ✓' : 'не здав'}</span>
      </div>`).join('') : '<div class="empty">Атестацій ще не було</div>';

    $('#view').innerHTML = `
      <div class="hero">
        <div class="hero-top">${coach ? avatarHtml(a, photoUrl, 'avatar') : `<label class="av-edit" title="Змінити фото">${avatarHtml(a, photoUrl, 'avatar')}
            <span class="av-cam">${icon('camera')}</span><input type="file" accept="image/*" id="myPhoto" hidden></label>`}
          <div><h2>${esc(a.full_name)}</h2><span>${esc(sub)}${bdayLine}</span>
          ${coach ? '' : `<label class="link small" style="display:inline-block;margin-top:4px;cursor:pointer" for="myPhoto">${a.photo ? 'Змінити фото' : icon('camera') + 'Додати фото'}</label>`}</div></div>
        <div class="hero-belt">${a.belt ? beltTag(a.belt, true) + esc(a.belt) : '<span class="muted">Пояс не вказано</span>'}</div>
        ${a.belt ? beltLadder(a.belt) : ''}
        <div class="hero-w">${icon('scale')}${lastW ? `<b>${fmtKg(lastW.kg)}</b> <span class="muted small">· ${fmtDate(lastW.date)}${lastW.date.slice(0, 4) !== t.slice(0, 4) ? ' ' + lastW.date.slice(0, 4) : ''}</span>` : '<span class="muted">Вага не вказана</span>'}</div>
        ${coach && a.parent_name ? `<div class="note">Батьки: ${esc(a.parent_name)}${a.phone ? ' · ' + esc(a.phone) : ''}</div>` : ''}
        ${coach && a.notes ? `<div class="note">${esc(a.notes)}</div>` : ''}
        ${a.achievements ? `<div class="merits-full"><b>${trophy()} ЗАСЛУГИ</b>${esc(a.achievements)}</div>` : ''}
        ${!coach && a.rating_place ? `<div style="margin-top:12px"><a class="badge gold" href="#rating" style="text-decoration:none">${trophy()} ${a.rating_place} місце в рейтингу</a></div>` : ''}
        ${coach && state.hasMerits ? `<div style="margin-top:12px">${a.rating_place
            ? `<a class="badge gold" href="#rating" style="text-decoration:none">${trophy()} ${a.rating_place} місце в рейтингу</a>
               <button type="button" class="linkbtn" id="rateOut" style="margin-left:8px">Прибрати з рейтингу</button>`
            : `<button type="button" class="btn light sm" id="rateIn">${trophy()} Додати до рейтингу</button>`}</div>` : ''}
        ${coach && phone ? `<a class="btn light wide" href="tel:${esc(phone)}">${icon('call')}Подзвонити${a.parent_name ? ' батькам' : ''}</a>` : ''}
      </div>
      <div class="stats">
        <div class="stat"><b>${visits}</b><span>тренувань у ${MONTHS_IN[Number(ym.slice(5)) - 1]}</span></div>
        <div class="stat ${pct === null ? '' : 'has-ring'}">${pct === null ? '<b>—</b>' : `<div class="ring-wrap">${ringHtml(pct)}<b>${pct}%</b></div>`}<span>${pct === null ? 'немає розкладу групи' : `відвідуваність з ${planned}`}</span></div>
        ${coach ? `<a class="stat ${paidNow ? '' : 'warn'}" href="#payments" data-month="${ym}"><b>${paidNow ? '✓' : '✗'}</b><span>${paidNow ? 'оплачено' : 'не оплачено'} за місяць</span></a>`
          : `<a class="stat" href="#rating"><b>${a.rating_place || '—'}</b><span>місце в рейтингу</span></a>`}
      </div>
      ${days.size ? `<h3>Відвідування у ${MONTHS_IN[Number(ym.slice(5)) - 1]}</h3><div class="panel">${attCalendar(ym, new Set(att.map(x => x.date)), new Set([...days].map(Number)), t)}</div>` : ''}
      ${canReady(a) && (coach || isAthleteM()) ? `<a class="card ncard" href="#sleep/${encodeURIComponent(a.id)}"><span class="ic-box">${icon('moon')}</span><span><strong>Сон і готовність</strong><span>Графіки сну й готовності за весь час, середні по місяцях, перед змаганнями</span></span><span class="chev">›</span></a>` : ''}
      ${canNutri(a) ? `<a class="card ncard" href="#nutrition/${encodeURIComponent(a.id)}"><span class="ic-box">${icon('drop')}</span><span><strong>Харчування і відновлення</strong><span>Білки, жири, вуглеводи на кожен день, рецепти, сон і поради з відновлення</span></span><span class="chev">›</span></a>` : ''}
      <h3>Відвідування за пів року</h3>
      <div class="panel">
        <div class="bars">${perMonth.map(n => `<div class="bcol ${n ? '' : 'zero'}"><span class="bval">${n}</span><div class="bbar" style="height:${n / maxV * 100}%"></div></div>`).join('')}</div>
        <div class="blabs">${months.map(m => `<span>${short(m)}</span>`).join('')}</div>
      </div>
      <div class="sec"><h3>Вага</h3>${coach ? '<button type="button" class="btn light sm" id="addW">+ Записати вагу</button>' : ''}</div>
      <div class="panel">${weightHtml}</div>
      ${coach ? `<h3>Оплати</h3>
      <div class="months">${months.map(m => {
        const p = payOf.get(m);
        return `<a class="mcell ${p ? 'ok' : 'bad'}" href="#payments" data-month="${m}">${short(m)}<b>${p ? '✓' : '✗'}</b></a>`;
      }).join('')}</div>` : ''}
      ${evs.length ? `<h3>Найближчі події</h3><div class="list">${evs.map(e => `<a class="row" href="#event/${encodeURIComponent(e.id)}">
          <div><strong>${esc(e.title)}</strong><span>${fmtDate(e.date, { weekday: 'short', day: 'numeric', month: 'long' })}${e.place ? ' · ' + esc(e.place) : ''}</span></div>
          <span class="chev">›</span></a>`).join('')}</div>` : ''}
      ${resEvs.length ? `<div class="sec"><h3>${trophy()} Результати змагань</h3><span class="muted small">${['1', '2', '3'].map(p => medalN(p) ? placeIcon(p) + '<span class="medal-n">×' + medalN(p) + '</span>' : '').filter(Boolean).join(' ')}</span></div>
        <div class="stats">
          <div class="stat"><b>${resEvs.length}</b><span>змагань</span></div>
          <div class="stat"><b>${wlAll.w}</b><span>перемог</span></div>
          <div class="stat"><b>${wlAll.l}</b><span>поразок</span></div>
        </div>
        <div class="list">${resEvs.map(e => `<a class="row" href="#event/${encodeURIComponent(e.id)}">
          <div><strong>${resultsOf(e, a.id).map(x => placeIcon(x.p)).join('')} ${esc(e.title)}</strong>
          <span>${fmtDate(e.date, { day: 'numeric', month: 'long', year: 'numeric' })} · ${esc(resultsOf(e, a.id).map(placeText).join('; '))}</span></div>
          <span class="chev">›</span></a>`).join('')}</div>` : ''}
      <div class="sec"><h3>Атестації</h3>${coach ? '<button type="button" class="btn light sm" id="addG">+ Атестація</button>' : ''}</div>
      <div class="list">${grHtml}</div>
      ${coach ? '<h3>Доступ до застосунку</h3><div id="accessBox" class="panel"><span class="muted small">Завантаження…</span></div>' : ''}`;

    if (!coach) {
      const ph = $('#myPhoto');
      if (ph) ph.onchange = () => { const f = ph.files[0]; ph.value = ''; if (f) memberPhotoUpload(a, f); };
      // Батьки: лише перегляд (графік ваги можна потицяти)
      if ($('#wcap')) $('#wcap').textContent = 'Натисніть на точку, щоб побачити дату й вагу';
      $('#view').querySelectorAll('[data-wedit]').forEach(b => b.remove());
      $('#view').querySelectorAll('a[href^="#event/"]').forEach(l => l.setAttribute('href', '#events'));
      $('#view').onclick = e => {
        const pt = e.target.closest('[data-i]');
        if (pt && wl.length > 1) {
          const i = Number(pt.dataset.i), w = wl[i], prev = wl[i - 1], diff = prev ? w.kg - prev.kg : 0;
          $('#wcap').innerHTML = `<b style="color:var(--ink)">${fmtKg(w.kg)}</b> · ${fmtDate(w.date)} ${w.date.slice(0, 4)}` +
            (prev && diff ? ` · ${diff > 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')} кг` : '');
          document.querySelectorAll('.wchart .pt').forEach(c => c.classList.toggle('on', c.dataset.i === String(i)));
        }
      };
      return;
    }
    $('#addW').onclick = () => weightForm(a);
    drawAccess(a);
    const rIn = $('#rateIn'), rOut = $('#rateOut');
    if (rIn) rIn.onclick = async () => {
      const top = await q(db.from('athletes').select('rating_place').not('rating_place', 'is', null).order('rating_place', { ascending: false }).limit(1));
      await q(db.from('athletes').update({ rating_place: (top[0]?.rating_place || 0) + 1 }).eq('id', a.id));
      toast('Додано до рейтингу — порядок можна змінити у вкладці «Рейтинг»'); render();
    };
    if (rOut) rOut.onclick = async () => {
      await q(db.from('athletes').update({ rating_place: null }).eq('id', a.id));
      await renumberRating(); toast('Прибрано з рейтингу'); render();
    };
    $('#addG').onclick = () => gradingForm([a]);
    $('#view').onclick = e => {
      const m = e.target.closest('[data-month]');
      if (m) { state.month = m.dataset.month; state.group = a.group_name || 'Усі'; if (a.section) state.section = a.section; return; }
      const gr = e.target.closest('[data-gid]');
      if (gr) { gradingForm([a], grs.find(x => String(x.id) === gr.dataset.gid)); return; }
      const we = e.target.closest('[data-wedit]');
      if (we) { weightForm(a, wl[Number(we.dataset.wedit)]); return; }
      const pt = e.target.closest('[data-i]');
      if (pt && wl.length > 1) {
        const i = Number(pt.dataset.i), w = wl[i], prev = wl[i - 1];
        const diff = prev ? w.kg - prev.kg : 0;
        $('#wcap').innerHTML = `<b style="color:var(--ink)">${fmtKg(w.kg)}</b> · ${fmtDate(w.date)} ${w.date.slice(0, 4)}` +
          (prev && diff ? ` · ${diff > 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')} кг` : '') +
          ` · <button type="button" class="linkbtn" data-wedit="${i}">змінити</button>`;
        document.querySelectorAll('.wchart .pt').forEach(c => c.classList.toggle('on', c.dataset.i === String(i)));
      }
    };
  }

  // =====================================================================
  //  ХАРЧУВАННЯ (БЖВ) — для спортсменів старшої групи. Бачать сам спортсмен і тренер.

    ['Хек або минтай, 150 г', 26, 3, 0], ['Яловичина, 100 г (готова)', 28, 10, 0], ['Грецький йогурт, 150 г', 15, 3, 6],
    ['Молоко 2,5%, склянка 250 мл', 7, 6, 12], ['Гречка, 200 г (варена)', 7, 1, 40], ['Рис, 200 г (варений)', 5, 1, 56],
    ['Макарони, 200 г (варені)', 10, 2, 50], ['Вівсянка, 60 г (суха)', 7, 4, 36], ['Картопля, 250 г (варена)', 5, 0, 42],

  ];
  // Рецепти: порція, Б/Ж/В, склад і як готувати

  function plateSvg(pl, on) {
    const R = 86, cx = 120, cy = 120, pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
    let a0 = 90; // овочі — ліва половина, далі за годинниковою стрілкою білок і крупи

  // Розрахунок: базовий обмін (Шофілд, ВООЗ) × побутова активність + витрата на тренування
  function nutriCalc(n, age) {
    const w = Number(n.weight_kg), male = n.sex !== 'f', a = age ?? 15;
    const bmr = a < 10 ? (male ? 22.706 * w + 504.3 : 20.315 * w + 485.9)
      : a < 18 ? (male ? 17.686 * w + 658.2 : 13.384 * w + 692.6)
      : (male ? 15.057 * w + 692.2 : 14.818 * w + 486.6);
    const met = { light: 5, moderate: 7, hard: 10 }[n.load] || 7;
    const session = Math.round(met * w * 1.5); // тренування ≈ 1,5 год
    // Поєднання: вуглеводи — за навантаженням у г/кг (спортивні норми: легкі 5, середні 6, важкі 7,5 г/кг),
    // з рамками гайду «Здорове харчування» (EFSA/ВООЗ): вуглеводи 45–60% енергії, жири 25–35%.
    // Білок: до 18 років 1,5 г/кг, дорослим активним — 1,8 г/кг хлопцям, 1,6 г/кг дівчатам.
    // Калорійність — НИЖНЯ межа: якщо після вуглеводів лишаються калорії, спершу доходять жири (до 35%), потім знову вуглеводи.
    const pk = a < 18 ? 1.5 : (male ? 1.8 : 1.6);
    const day = (E0, ck) => {
      const P = Math.round(pk * w);
      let E = Math.round(E0 / 10) * 10;
      let C = Math.round(Math.min(0.60 * E / 4, Math.max(0.45 * E / 4, ck * w)));
      let F = Math.round((E - 4 * P - 4 * C) / 9);
      if (F * 9 > 0.35 * E) { F = Math.round(0.35 * E / 9); C = Math.round((E - 4 * P - 9 * F) / 4); }
      if (F * 9 < 0.25 * E) F = Math.round(0.25 * E / 9);
      E = Math.max(E, Math.round((4 * P + 9 * F + 4 * C) / 10) * 10);
      const fib = a < 18 ? Math.round(E / 1000 * 14) : 30; // клітковина: дітям і підліткам 2 г/МДж ≈ 14 г на 1000 ккал, дорослим 25–35 г
      return { E, P, F, C, fib };
    };
    const carbK = { light: 5, moderate: 6, hard: 7.5 }[n.load] || 6;
    const base = bmr * 1.45;
    return {
      train: { ...day(base + session, carbK), water: Math.round((w * 35 + 750) / 50) * 50 },
      rest: { ...day(base, 4.5), water: Math.round(w * 35 / 50) * 50 },
      pre: { C: Math.round(w * 1), P: 15 }, post: { C: Math.round(w * 1), P: 25 },
      week: n.sessions,
    };
  }

  // (\b не працює з кирилицею, тому межі слова — пробіл, цифра або розділовий знак)
  const UNIT_G = [[/[\s\d]кг(?=[\s.,;)]|$)|кілограм/, 1000], [/ст\.?\s*л|столов/, 15], [/ч\.?\s*л|чайн/, 5], [/[\s\d]л(?=[\s.,;)]|$)|літр/, 1000],
    [/склян|чашк/, 250], [/жмен/, 30], [/шматоч|шматк|скибк|слайс/, 'piece'], [/[\s\d]шт(?=[\s.,;)]|$)|штук/, 'piece'], [/[\s\d](мл|г|гр|грам\S*)(?=[\s.,;)]|$)/, 1]];
  function parseIngredient(line) {
    const L = ' ' + line.toLowerCase().replace(/[’'`ʼ]/g, '').replace(/ё/g, 'е') + ' ';
    let best = null;
    for (const f of FOOD_DB) for (const al of f[0]) { const i = L.indexOf(al); if (i >= 0 && (!best || al.length > best.al.length)) best = { f, al }; }
    if (!best) return { line, ok: false };
    const [, p, fat, c, piece] = best.f;
    const num = (L.match(/(\d+(?:[.,]\d+)?)/) || [])[1];
    let n = num ? Number(num.replace(',', '.')) : null, grams = null;
    let unit = null;
    for (const [re, g] of UNIT_G) if (re.test(L)) { unit = g; break; }
    if (unit === 'piece') grams = (n || 1) * (piece || 50);
    else if (typeof unit === 'number') grams = (n || 1) * unit;
    else if (n != null) grams = piece && n <= 12 ? n * piece : n; // «2 яйця» → штуки, «200 гречки» → грами
    else if (piece) grams = piece;
    if (!grams) return { line, ok: false, need: true };
    const k = grams / 100;
    return { line, ok: true, g: Math.round(grams), p: p * k, f: fat * k, c: c * k };
  }

    return { items, tot };

          ${z ? `<span class="badge" style="background:${z.c}22;color:${z.c}">${Math.round(x.sc)}%</span>` : '<span class="chev">›</span>'}</a>`; }).join('') || '<div class="empty">У старшій групі немає спортсменів</div>'}</div>
      <p class="muted small" style="margin:12px 4px 0">Натисни на спортсмена в таблиці — відкриються графіки сну й готовності за весь час. Цифра рахується з того, що спортсмен вписав зранку: сон (45%), самопочуття (30%) і біль у мʼязах (25%). Це підказка для тренера, а не медичний показник.</p>`;

  // Читаємо порціями по 1000 рядків (ліміт Supabase на один запит)
  async function qAll(make) {
    const out = [];
    for (let i = 0; ; i += 1000) { const part = await q(make().range(i, i + 999)); out.push(...part); if (part.length < 1000) return out; }
  }
  // ----- Історія сну й готовності: тренер і сам спортсмен (батьки не бачать) -----
  const RD_PERIODS = [['30', '30 днів'], ['90', '3 місяці'], ['season', 'Сезон'], ['all', 'Увесь час']];
  const seasonStart = t => (Number(t.slice(5, 7)) >= 9 ? Number(t.slice(0, 4)) : Number(t.slice(0, 4)) - 1) + '-09-01';
  const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
  const hm = h => { const n = Number(h), H = Math.floor(n), M = Math.round((n - H) * 60); return H + ':' + String(M).padStart(2, '0'); };
  const avgOf = (rows, k) => rows.length ? rows.reduce((s, r) => s + Number(r[k]), 0) / rows.length : null;
  const n1 = v => v == null ? '—' : v.toLocaleString('uk-UA', { maximumFractionDigits: 1 });
  // Довгі періоди згладжуємо до середніх за тиждень
  function rdSeries(rows, from, key) {
    if (daysBetween(from, today()) <= 92) return rows.map(r => ({ d: r.date, v: Number(r[key]), n: 1 }));
    const wk = new Map();
    rows.forEach(r => { const k = Math.floor(daysBetween(from, r.date) / 7); const w = wk.get(k) || { s: 0, n: 0, d: r.date }; w.s += Number(r[key]); w.n++; wk.set(k, w); });
    return [...wk.values()].map(w => ({ d: w.d, v: w.s / w.n, n: w.n }));
  }
  function rdChart(id, pts, from, o) {
    if (!pts.length) return '<div class="empty" style="padding:0">За цей період відміток немає</div>';
    const W = 320, H = 160, L = 34, R = 12, T = 16, B = 24, span = Math.max(1, daysBetween(from, today()));
    const x = d => L + (W - L - R) * daysBetween(from, d) / span;
    const y = v => T + (H - T - B) * (1 - (v - o.min) / (o.max - o.min));
    const band = o.band ? `<rect class="rd-band" x="${L}" width="${W - L - R}" y="${y(o.band[1])}" height="${y(o.band[0]) - y(o.band[1])}"/>` : '';
    const zones = o.zones ? o.zones.map(([a, b, c]) => `<rect x="${L}" width="${W - L - R}" y="${y(b)}" height="${y(a) - y(b)}" fill="${c}" opacity=".08"/>`).join('') : '';
    const last = pts[pts.length - 1];
    return `<svg class="wchart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${zones}${band}
        ${o.ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${o.tick(v)}</text>`).join('')}
        <text class="axis" x="${L}" y="${H - 6}">${fmtDate(from, { day: '2-digit', month: '2-digit' })}</text>
        <text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(today(), { day: '2-digit', month: '2-digit' })}</text>
        ${pts.length > 1 ? `<polyline class="line" points="${pts.map(p => `${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>` : ''}
        ${pts.length <= 60 ? pts.map((p, i) => `<circle class="pt" r="3.5" cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" data-i="${i}" ${o.color ? `style="stroke:${o.color(p.v)}"` : ''}/>`).join('') : ''}
        <text class="lbl" x="${x(last.d)}" y="${y(last.v) - 9}" text-anchor="end">${o.tick(last.v)}</text>
        ${pts.map((p, i) => `<rect class="hit" x="${(x(p.d) - 8).toFixed(1)}" y="0" width="16" height="${H}" data-i="${i}"/>`).join('')}
      </svg><div class="wcap" data-cap="${id}">Натисни на графік, щоб побачити день</div>`;
  }
  async function sleepView() {
    setActions('');
    const a = (await q(db.from('athletes').select('*').eq('id', state.param)))[0];
    $('#backLink').href = '#athlete/' + encodeURIComponent(state.param || '');
    if (!a || !canReady(a) || !(isCoach() || isAthleteM())) { $('#view').innerHTML = '<div class="empty">Історія сну доступна спортсменам старшої групи і тренеру</div>'; return; }
    const [all, evs] = await Promise.all([
      qAll(() => db.from('readiness').select('date, sleep_h, feel, sore, score').eq('athlete_id', a.id).order('date')),
      db.from('events').select('id, title, date, participants').order('date').then(r => r.data || [], () => []),
    ]);
    all.sort((x, y) => x.date.localeCompare(y.date));
    const t = today(), per = state.rdPer || '30', [lo, hi] = sleepNeed(ageOf(a));
    let from = per === 'all' ? (all[0] ? all[0].date : t) : per === 'season' ? seasonStart(t) : shiftDate(t, -(Number(per) - 1));
    if (per === 'all' && daysBetween(from, t) < 6) from = shiftDate(t, -6);
    const rows = all.filter(r => r.date >= from), byDate = new Map(all.map(r => [r.date, r]));
    const firstDay = all[0] && all[0].date > from ? all[0].date : from;
    const possible = Math.max(1, daysBetween(firstDay, t) + 1);
    const short = rows.filter(r => Number(r.sleep_h) < lo).length;
    let streak = 0; for (let d = byDate.has(t) ? t : shiftDate(t, -1); byDate.has(d); d = shiftDate(d, -1)) streak++;
    let best = 0, run = 0, prev = null; all.forEach(r => { run = prev && daysBetween(prev, r.date) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = r.date; });
    const aS = avgOf(rows, 'sleep_h'), aR = avgOf(rows, 'score');
    const months = [...new Set(rows.map(r => r.date.slice(0, 7)))].reverse();
    const evRows = evs.filter(e => e.date <= t && e.date >= from && Array.isArray(e.participants) && e.participants.map(String).includes(String(a.id)))
      .map(e => ({ e, r: byDate.get(e.date) || byDate.get(shiftDate(e.date, -1)) })).filter(x => x.r).reverse();
    const sleepPts = rdSeries(rows, from, 'sleep_h'), scorePts = rdSeries(rows, from, 'score');
    const weekly = daysBetween(from, t) > 92;
    const maxS = Math.max(hi + 1, ...rows.map(r => Math.ceil(Number(r.sleep_h))));
    const minS = Math.min(5, ...rows.map(r => Math.floor(Number(r.sleep_h))));
    $('#view').innerHTML = `
      <p class="muted small" style="margin:0 2px 10px">${esc(a.full_name)} · норма сну ${lo}–${hi} год${isCoach() ? '' : ' · бачиш тільки ти і тренер'}</p>
      <div class="chips seg">${RD_PERIODS.map(([v, l]) => `<button type="button" class="chip ${per === v ? 'on' : ''}" data-rdper="${v}">${l}</button>`).join('')}</div>
      ${!all.length ? '<div class="empty">Ще немає жодної ранкової відмітки</div>' : `
      <div class="stats">
        <div class="stat"><b>${aS == null ? '—' : hm(aS)}</b><span>сон у середньому</span></div>
        <div class="stat"><b style="${aR == null ? '' : 'color:' + readyZone(Math.round(aR)).c}">${aR == null ? '—' : Math.round(aR) + '%'}</b><span>готовність</span></div>
        <div class="stat ${rows.length && short / rows.length > 0.3 ? 'warn' : ''}"><b>${short}</b><span>ночей менше ${lo} год</span></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${rows.length}</b><span>відміток з ${Math.min(possible, daysBetween(from, t) + 1)} днів</span></div>
        <div class="stat"><b>${streak}</b><span>днів поспіль зараз</span></div>
        <div class="stat"><b>${best}</b><span>рекорд поспіль</span></div>
      </div>
      <h3>${icon('moon')}Сон${weekly ? ' · середній за тиждень' : ''}</h3>
      <div class="panel">${rdChart('rdS', sleepPts, from, { label: 'Графік сну', min: minS, max: maxS, band: [lo, hi], tick: hm,
        ticks: [maxS, lo, minS].filter((v, i, s) => s.indexOf(v) === i) })}
        <p class="muted small" style="margin:6px 0 0">Зелена смуга — норма сну для його віку.</p></div>
      <h3>Готовність${weekly ? ' · середня за тиждень' : ''}</h3>
      <div class="panel">${rdChart('rdR', scorePts, from, { label: 'Графік готовності', min: 0, max: 100, tick: v => Math.round(v) + '%', ticks: [100, 67, 34, 0],
        zones: [[67, 100, '#22c55e'], [34, 67, '#eab308'], [0, 34, '#ef4444']], color: v => readyZone(Math.round(v)).c })}</div>
      <div class="stats">
        <div class="stat"><b>${n1(avgOf(rows, 'feel'))}<small class="muted">/5</small></b><span>самопочуття</span></div>
        <div class="stat"><b>${n1(avgOf(rows, 'sore'))}<small class="muted">/5</small></b><span>біль у мʼязах</span></div>
        <div class="stat"><b>${rows.length ? hm(Math.min(...rows.map(r => Number(r.sleep_h)))) : '—'}</b><span>найменше спав</span></div>
      </div>
      ${evRows.length ? `<h3>${trophy()} Перед змаганнями</h3><div class="list">${evRows.map(({ e, r }) => { const z = readyZone(r.score);
        return `<a class="row" href="#event/${encodeURIComponent(e.id)}"><div class="grow"><strong>${esc(e.title)}</strong>
          <span>${fmtDate(e.date, { day: 'numeric', month: 'long', year: 'numeric' })} · сон ${hm(r.sleep_h)}${r.date !== e.date ? ' (напередодні)' : ''}</span></div>
          <span class="badge" style="background:${z.c}22;color:${z.c}">${r.score}%</span></a>`; }).join('')}</div>` : ''}
      ${months.length ? `<h3>По місяцях</h3><div class="list">${months.map(m => { const mr = rows.filter(r => r.date.startsWith(m)), s = avgOf(mr, 'score');
        return `<div class="row"><div class="grow"><strong>${MONTHS[Number(m.slice(5)) - 1]} ${m.slice(0, 4)}</strong>
          <span>${mr.length} відміток · сон ${hm(avgOf(mr, 'sleep_h'))} · менше норми ${mr.filter(r => Number(r.sleep_h) < lo).length}</span></div>
          <span class="badge" style="background:${readyZone(Math.round(s)).c}22;color:${readyZone(Math.round(s)).c}">${Math.round(s)}%</span></div>`; }).join('')}</div>` : ''}`}`;
    $('#view').onclick = e => {
      const p = e.target.closest('[data-rdper]');
      if (p) { state.rdPer = p.dataset.rdper; render(); return; }
      const h = e.target.closest('.wchart .hit'); if (!h) return;
      const svg = h.closest('svg'), pts = svg.id === 'rdS' ? sleepPts : scorePts, pt = pts[Number(h.dataset.i)];
      svg.querySelectorAll('.pt').forEach(c => c.classList.toggle('on', c.dataset.i === h.dataset.i));
      const r = byDate.get(pt.d);
      $(`[data-cap="${svg.id}"]`).textContent = weekly
        ? `Тиждень від ${fmtDate(pt.d)}: ${svg.id === 'rdS' ? 'сон ' + hm(pt.v) : 'готовність ' + Math.round(pt.v) + '%'} (${pt.n} відм.)`
        : `${fmtDate(pt.d, { weekday: 'short', day: 'numeric', month: 'long' })}: сон ${hm(r.sleep_h)} · готовність ${r.score}% · самопочуття ${r.feel}/5 · мʼязи ${r.sore}/5`;
    };
  }

    return [8, 10];

  function wireRecovery() {
    const inp = $('#slWake'); if (!inp) return;

      const at = mins => { const t = ((h * 60 + m - mins - 15) % 1440 + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
      $('#slOut').innerHTML = `Лягай між <b>${at(hi * 60)}</b> і <b>${at(lo * 60)}</b><small>з урахуванням ~15 хв, щоб заснути</small>`;
      try { localStorage.setItem('ft_wake', inp.value); } catch (e) {}
    };
    inp.oninput = draw; draw();
  }
