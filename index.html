<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ferents Team">
  <title>Ferents Team Training</title>

  <style>
    :root {
      --bg: #f3f4f6; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --border: #d1d5db;
      --card: #ffffff; --head: #111827; --primary: #111827; --on-primary: #ffffff; --link: #1d4ed8;
      --gold: #d1a84b;
      --gold-soft: color-mix(in srgb, var(--gold) 20%, var(--card));
      --gold-ink: color-mix(in srgb, var(--gold) 60%, #000);
      --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0b0f17; --ink: #e5e7eb; --muted: #9ca3af; --line: #1f2937; --border: #374151;
      --card: #151b26; --head: #05080d; --primary: #e5e7eb; --on-primary: #111827; --link: #93c5fd;
      --gold-ink: color-mix(in srgb, var(--gold) 70%, #fff);
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1515;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    /* Шапка */
    header {
      background: var(--head); color: #fff;
      padding: 22px 16px 18px;
      padding-top: max(22px, env(safe-area-inset-top));
      border-bottom: 4px solid var(--gold);
    }
    .hwrap { max-width: 640px; margin: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .brand { color: #d1d5db; font-size: 12px; letter-spacing: .15em; margin: 0; }
    header h1 { margin: 6px 0 2px; font-size: 28px; }
    .motto { color: #9ca3af; margin: 0; font-size: 13px; }
    .ghost {
      background: transparent; border: 1px solid #374151; color: #d1d5db;
      border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
    }

    main { padding: 16px; max-width: 640px; margin: auto; }
    footer { text-align: center; color: var(--muted); padding: 25px; font-size: 12px; }

    /* Загальні елементи */
    h2 { margin: 4px 0; font-size: 22px; }
    h3 { margin: 24px 0 8px; font-size: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .err { color: var(--bad); }

    .topbar { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; min-height: 40px; }
    .topbar h2 { flex: 1; }
    .back { color: var(--ink); text-decoration: none; font-size: 15px; padding: 8px 10px 8px 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 0; border-radius: 12px; padding: 11px 16px;
      background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; font-size: 15px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .5; }
    .btn.light { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .btn.danger { background: var(--bad-bg); color: var(--bad); }
    .btn.wide { width: 100%; margin-top: 12px; }
    .btn.sq { width: 46px; padding: 11px 0; font-size: 20px; line-height: 1; }

    input, select, textarea {
      width: 100%; font: inherit; font-size: 16px; color: var(--ink);
      padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); border-color: transparent; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 0; }
    label > input, label > select, label > textarea { margin-top: 5px; }
    label.check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); }
    label.check input { width: 22px; height: 22px; margin: 0; }

    .search { margin-bottom: 10px; }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .picker {
      position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
      font-size: 16px; font-weight: 600; color: var(--ink);
    }
    label.picker { cursor: pointer; }
    .picker input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .picker input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; cursor: pointer; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .chip {
      flex: none; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
      background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
    }
    .chip.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }

    /* Головний екран */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; }
    .stat { background: var(--card); border-radius: 14px; padding: 14px 12px; box-shadow: 0 2px 8px #0000000d; }
    .stat b { display: block; font-size: 26px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat.warn b { color: var(--bad); }
    .bday { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 12px; font-size: 14px; line-height: 1.6; box-shadow: 0 2px 8px #0000000d; }
    .bday strong { display: block; font-size: 13px; letter-spacing: .05em; color: var(--gold-ink); margin-bottom: 2px; }
    .bday-today { background: var(--gold-soft); border-radius: 10px; padding: 8px 10px; margin: 4px 0; }
    .today { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
    .today strong { display: block; font-size: 13px; letter-spacing: .05em; color: var(--gold-ink); margin-bottom: 2px; }

    .card {
      display: block; width: 100%; text-align: left; text-decoration: none;
      border: 0; border-radius: 14px; background: var(--card); padding: 18px 20px; margin: 12px 0;
      color: var(--ink); font: inherit; box-shadow: 0 2px 8px #0000000d; cursor: pointer;
    }
    .card strong { display: block; font-size: 18px; }
    .card span { display: block; color: var(--muted); margin-top: 6px; font-size: 14px; }
    .card:active, .row:active { background: var(--line); }

    /* Списки */
    .list { background: var(--card); border-radius: 14px; box-shadow: 0 2px 8px #0000000d; overflow: hidden; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; border: 0; background: var(--card); color: var(--ink);
      font: inherit; padding: 13px 16px; margin: 0; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .row:last-child { border-bottom: 0; }
    .row strong { display: block; font-size: 16px; font-weight: 600; }
    .row span span, .row div span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .row.dim strong { color: var(--muted); }
    .row.tick input { width: 26px; height: 26px; flex: none; accent-color: var(--ok); }
    .chev { color: var(--muted); font-size: 22px; }
    .row.plan { align-items: flex-start; }
    .tasks { white-space: pre-line; font-size: 14px; color: var(--ink); margin-top: 8px; line-height: 1.5; }
    .row input.kg { width: 92px; flex: none; text-align: center; }
    .day-title { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 6px; }
    .empty { padding: 18px 16px; color: var(--muted); }

    .badge { flex: none; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.gold { background: var(--gold-soft); color: var(--gold-ink); }

    .summary { font-size: 15px; margin: 6px 2px 10px; }
    .summary b { font-size: 18px; }

    a.link { color: var(--link); word-break: break-all; }

    /* Вхід */
    .login { background: var(--card); border-radius: 16px; padding: 22px 20px; box-shadow: 0 2px 8px #0000000d; margin-top: 10px; }
    .login .btn { width: 100%; margin-top: 18px; }

    /* Діалог */
    dialog {
      border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100% - 24px));
      max-height: calc(100% - 40px); box-shadow: 0 20px 50px #0004; background: var(--card); color: var(--ink);
    }
    dialog::backdrop { background: #1118277a; }
    dialog form { padding: 20px; }
    dialog h3 { margin: 0 0 4px; font-size: 19px; }
    .dlg-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .dlg-actions .spacer { flex: 1; }
    .dlg-extra { margin-top: 12px; font-size: 14px; }

    /* Меню ☰ */
    .menu-btn {
      width: 44px; height: 44px; flex: none; border: 1px solid #374151; border-radius: 12px; background: transparent;
      display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center; cursor: pointer;
    }
    .menu-btn span { width: 20px; height: 2px; border-radius: 2px; background: #e5e7eb; }
    dialog#menu {
      margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(320px, 86%);
      border-radius: 18px 0 0 18px; padding: 0; display: none; flex-direction: column;
    }
    dialog#menu[open] { display: flex; }
    .menu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      padding: max(20px, env(safe-area-inset-top)) 18px 16px; background: var(--head); color: #fff; border-bottom: 4px solid var(--gold); }
    .menu-head span { display: block; color: #9ca3af; font-size: 13px; margin-top: 3px; }
    .menu-close { background: transparent; border: 0; color: #d1d5db; font-size: 20px; cursor: pointer; padding: 0 4px; }
    .menu-item {
      display: block; width: 100%; text-align: left; padding: 15px 18px; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; color: var(--ink); font: inherit; font-size: 16px; text-decoration: none; cursor: pointer;
    }
    .menu-item:active { background: var(--line); }
    .menu-foot { margin-top: auto; padding: 16px 18px; color: var(--muted); font-size: 12px; }

    /* Налаштування */
    .set-block { background: var(--card); border-radius: 14px; padding: 2px 16px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px #0000000d; }
    .set-block h3 { margin: 14px 0 10px; }
    .chip { background: var(--card); }
    .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; }
    .swatch.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }

    /* Чат */
    .chat {
      height: calc(100dvh - 330px); min-height: 300px; overflow-y: auto; background: var(--card);
      border-radius: 14px; padding: 12px; box-shadow: 0 2px 8px #0000000d; display: flex; flex-direction: column; gap: 6px;
    }
    .msg { max-width: 82%; align-self: flex-start; background: var(--bg); border-radius: 14px 14px 14px 4px; padding: 7px 12px; }
    .msg.mine { align-self: flex-end; background: var(--gold-soft); border-radius: 14px 14px 4px 14px; }
    .msg.can-del { cursor: pointer; }
    .msg-head { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .msg-head b { color: var(--gold-ink); font-weight: 600; }
    .msg-body { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.4; }
    .msg-day { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
    .chat-input { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
    .chat-input textarea { resize: none; max-height: 120px; margin: 0; }
    .chat-input .btn { flex: none; width: 52px; height: 46px; padding: 0; font-size: 20px; }

    /* Вхід */
    .login-links { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--link); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    .msg-ok { color: var(--ok); }
    .info { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.55; margin-bottom: 12px; }

    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--head); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px;
      max-width: calc(100% - 32px); box-shadow: 0 8px 24px #0003; z-index: 10;
    }
    .toast.bad { background: var(--bad); }
  </style>
</head>

<body>
  <header>
    <div class="hwrap">
      <div>
        <p class="brand">FERENTS TEAM</p>
        <h1>Training</h1>
        <p class="motto" id="motto">Дисципліна. Праця. Результат.</p>
      </div>
      <button id="menuBtn" class="menu-btn" aria-label="Меню" hidden><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <!-- Вхід тренера -->
    <section id="loginSection" hidden>
      <form id="loginForm" class="login">
        <h2 id="loginTitle">Вхід</h2>
        <p class="muted small" id="loginHint">Для тренерів, батьків і спортсменів команди.</p>
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label id="pwLabel">Пароль<input id="loginPassword" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="btn" type="submit" id="loginBtn">Увійти</button>
        <p id="loginMessage" class="small"></p>
        <div class="login-links">
          <button type="button" class="linkbtn" data-mode="signup">Немає акаунта? Зареєструватися</button>
          <button type="button" class="linkbtn" data-mode="reset">Забули пароль?</button>
          <button type="button" class="linkbtn" data-mode="login" hidden>← Назад до входу</button>
        </div>
      </form>
    </section>

    <!-- Основний додаток -->
    <section id="appSection" hidden>
      <div class="topbar">
        <a id="backLink" class="back" href="#home">← Назад</a>
        <h2 id="pageTitle"></h2>
        <div id="pageActions"></div>
      </div>
      <div id="view"></div>
    </section>
  </main>

  <footer>FERENTS TEAM TRAINING · 2026 · <span id="appVersion"></span></footer>

  <dialog id="dlg"></dialog>
  <dialog id="menu"></dialog>
  <div id="toast" class="toast" hidden></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  // ===== Налаштування =====
  const SUPABASE_URL = 'https://ntmtqkioqcfjxvaxyjge.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_wv9UNSUZvcVT7_orJkec3A_475LADpx';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const APP_VERSION = 'v2.0';
  document.getElementById('appVersion').textContent = APP_VERSION;

  // ===== Особисті налаштування (зберігаються на пристрої) =====
  const DEFAULT_SETTINGS = { theme: 'auto', accent: '#d1a84b', zoom: 1, motto: '', showStats: true, showToday: true, showBdays: true };
  const ACCENTS = [['#d1a84b', 'Золотий'], ['#dc2626', 'Червоний'], ['#2563eb', 'Синій'], ['#16a34a', 'Зелений'],
                   ['#ea580c', 'Помаранчевий'], ['#92400e', 'Коричневий'], ['#7c3aed', 'Фіолетовий']];
  let settings = (() => {
    try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('ft_settings') || '{}') }; }
    catch (e) { return { ...DEFAULT_SETTINGS }; }
  })();
  const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  function applySettings() {
    const dark = settings.theme === 'dark' || (settings.theme === 'auto' && darkMq.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.setProperty('--gold', settings.accent);
    document.body.style.zoom = settings.zoom;
    document.getElementById('motto').textContent = settings.motto || 'Дисципліна. Праця. Результат.';
    document.querySelector('meta[name=theme-color]').content = dark ? '#05080d' : '#111827';
  }
  function saveSettings() {
    try { localStorage.setItem('ft_settings', JSON.stringify(settings)); } catch (e) {}
    applySettings();
  }
  if (darkMq.addEventListener) darkMq.addEventListener('change', applySettings);
  applySettings();

  const GROUPS = ['Молодша', 'Середня', 'Старша'];
  // Пояси від найнижчого до найвищого
  const BELTS = [
    '0 кю — білий', '10 кю — помаранчевий', '9 кю — помаранчевий зі смужкою',
    '8 кю — синій', '7 кю — синій зі смужкою', '6 кю — жовтий', '5 кю — жовтий зі смужкою',
    '4 кю — зелений', '3 кю — зелений зі смужкою', '2 кю — коричневий', '1 кю — коричневий зі смужкою',
    '1 дан — чорний пояс',
  ];
  // Список для вибору; старе значення не зі списку теж лишається, щоб не загубилось
  function beltOptions(current) {
    return current && !BELTS.includes(current) ? [...BELTS, [current, current + ' (старий запис)']] : BELTS;
  }
  function nextBelt(current) {
    const i = BELTS.indexOf(current);
    return i >= 0 && i < BELTS.length - 1 ? BELTS[i + 1] : (i === -1 ? BELTS[0] : BELTS[i]);
  }
  const WEEKDAYS = ['', 'Понеділок', 'Вівторок', 'Середа', 'Четвер', 'Пʼятниця', 'Субота', 'Неділя'];
  const TITLES = {
    home: 'Особистий кабінет', athletes: 'Мої спортсмени', weights: 'Зважування', gradings: 'Атестації', attendance: 'Відвідування',
    payments: 'Оплати', links: 'Відео та посилання', chat: 'Чат команди', members: 'Учасники та доступ', settings: 'Налаштування', training: 'Тренування', plans: 'Завдання', tests: 'Тестування', schedule: 'Розклад тренувань', events: 'Календар подій', materials: 'Матеріали'
  };

  // Стан фільтрів (зберігається між екранами)
  const state = { group: 'Усі', search: '', date: today(), month: today().slice(0, 7), role: null, email: '' };
  function isCoach() { return state.role === 'coach'; }
  const ROLES = { coach: 'Тренер', parent: 'Батьки', athlete: 'Спортсмен' };

  // ===== Допоміжні функції =====
  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function today() { return new Date().toLocaleDateString('sv-SE'); } // YYYY-MM-DD
  function shiftDate(iso, days) {
    const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + days);
    return d.toLocaleDateString('sv-SE');
  }
  function shiftMonth(ym, n) {
    const d = new Date(ym + '-15T12:00'); d.setMonth(d.getMonth() + n);
    return d.toLocaleDateString('sv-SE').slice(0, 7);
  }
  function fmtDate(iso, opts = { day: 'numeric', month: 'long' }) {
    return new Date(iso + 'T12:00').toLocaleDateString('uk-UA', opts);
  }
  const MONTHS = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень',
                  'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
  function fmtMonth(ym) {
    const [y, m] = ym.split('-');
    return MONTHS[Number(m) - 1] + ' ' + y;
  }
  function fmtMoney(n) { return Number(n || 0).toLocaleString('uk-UA') + ' грн'; }
  function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }
  function weekdayOf(iso) { return ((new Date(iso + 'T12:00').getDay() + 6) % 7) + 1; }
  function inGroup(a) { return state.group === 'Усі' || a.group_name === state.group; }
  function isActive(a) { return a.active !== false; }

  let toastTimer;
  function toast(msg, bad = false) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), bad ? 5000 : 2200);
  }

  // Виконує запит до Supabase і показує помилку, якщо щось пішло не так
  async function q(request) {
    const { data, error } = await request;
    if (error) { toast('Помилка: ' + error.message, true); throw error; }
    return data;
  }

  function setActions(html) { $('#pageActions').innerHTML = html; }

  function chips() {
    return `<div class="chips">${['Усі', ...GROUPS].map(g =>
      `<button type="button" class="chip ${state.group === g ? 'on' : ''}" data-group="${g}">${g}</button>`).join('')}</div>`;
  }

  // ===== Універсальна форма у спливаючому вікні =====
  function openForm({ title, fields, values = {}, onSave, onDelete, deleteText, extra = '' }) {
    const dlg = $('#dlg');
    const field = f => {
      const v = values[f.name];
      const req = f.required ? 'required' : '';
      if (f.type === 'select') {
        return `<label>${f.label}<select name="${f.name}" ${req}><option value="">—</option>${f.options.map(o => {
          const [val, lab] = Array.isArray(o) ? o : [o, o];
          return `<option value="${esc(val)}" ${String(v ?? '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`;
        }).join('')}</select></label>`;
      }
      if (f.type === 'textarea') return `<label>${f.label}<textarea name="${f.name}" rows="${f.rows || 3}" ${req} ${f.attrs || ''}>${esc(v)}</textarea></label>`;
      if (f.type === 'checkbox') return `<label class="check"><input type="checkbox" name="${f.name}" ${v !== false ? 'checked' : ''}>${f.label}</label>`;
      return `<label>${f.label}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.attrs || ''}></label>`;
    };

    dlg.innerHTML = `<form>
        <h3>${esc(title)}</h3>
        ${fields.map(field).join('')}
        ${extra ? `<div class="dlg-extra">${extra}</div>` : ''}
        <div class="dlg-actions">
          ${onDelete ? '<button type="button" class="btn danger" data-act="delete">Видалити</button>' : ''}
          <span class="spacer"></span>
          <button type="button" class="btn light" data-act="cancel">Скасувати</button>
          <button type="submit" class="btn">Зберегти</button>
        </div>
      </form>`;

    const form = dlg.querySelector('form');
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const obj = {};
      for (const f of fields) {
        let v;
        if (f.type === 'checkbox') v = fd.has(f.name);
        else {
          v = String(fd.get(f.name) ?? '').trim();
          if (v === '') v = null;
          else if (f.type === 'number' || f.cast === 'number') v = Number(v);
        }
        obj[f.name] = v;
      }
      const btn = form.querySelector('[type=submit]');
      btn.disabled = true;
      try { await onSave(obj); dlg.close(); toast('Збережено'); render(); }
      catch (err) { /* помилку вже показано */ }
      finally { btn.disabled = false; }
    };
    form.querySelector('[data-act=cancel]').onclick = () => dlg.close();
    const del = form.querySelector('[data-act=delete]');
    if (del) del.onclick = async () => {
      if (!confirm(deleteText || 'Точно видалити?')) return;
      try { await onDelete(); dlg.close(); toast('Видалено'); render(); } catch (err) {}
    };
    dlg.showModal();
  }

  // Вік і підпис дати народження
  function ageOf(a) {
    if (!a.birth_date) return null;
    const b = new Date(a.birth_date + 'T12:00'), n = new Date();
    let age = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) age--;
    return age;
  }
  function yearsWord(n) {
    const d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return 'рік';
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return 'роки';
    return 'років';
  }
  // Найближчий день народження: { days, age, date }
  function nextBirthday(a) {
    if (!a.birth_date) return null;
    const [y, m, d] = a.birth_date.split('-').map(Number);
    const t = today(), ty = Number(t.slice(0, 4));
    const mk = yr => {
      // 29 лютого в невисокосний рік святкуємо 28-го
      const leap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0;
      const dd = (m === 2 && d === 29 && !leap) ? 28 : d;
      return `${yr}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
    };
    let date = mk(ty), yr = ty;
    if (date < t) { yr = ty + 1; date = mk(yr); }
    const days = Math.round((new Date(date + 'T12:00') - new Date(t + 'T12:00')) / 864e5);
    return { days, age: yr - y, date };
  }
  function bdayMark(a) {
    const b = nextBirthday(a);
    if (!b || b.days > 7) return '';
    return b.days === 0 ? ' 🎂 сьогодні!' : ' 🎂';
  }

  function birthLabel(a) {
    const age = ageOf(a);
    if (age !== null) return `${age} ${yearsWord(age)}`;
    return a.birth_year ? a.birth_year + ' р.н.' : '';
  }
  function fmtKg(w) { return Number(w).toLocaleString('uk-UA', { maximumFractionDigits: 1 }) + ' кг'; }

  }

  async function athleteForm(a) {
    let extra = '';
    let lastWeight = null;
    if (a) {
      const monthStart = today().slice(0, 7) + '-01';
      const [visits, pay, gr, wt] = await Promise.all([
        q(db.from('attendance').select('id').eq('athlete_id', a.id).eq('present', true).gte('date', monthStart)),
        q(db.from('payments').select('amount').eq('athlete_id', a.id).eq('month', monthStart)),
        db.from('gradings').select('date, belt, passed').eq('athlete_id', a.id).order('date', { ascending: false }).limit(5),
        db.from('weights').select('date, weight').eq('athlete_id', a.id).order('date', { ascending: false }).limit(6),
      ]);
      const weights = wt.data || [];
      lastWeight = weights[0] ? Number(weights[0].weight) : null;
      const dmy = d => fmtDate(d, { day: '2-digit', month: '2-digit', year: 'numeric' });
      const history = (gr.data || []).map(g => `${dmy(g.date)} — ${esc(g.belt)} ${g.passed ? '✓' : '✗'}`).join('<br>');
      const wHistory = weights.map((w, i) => {
        const prev = weights[i + 1];
        const diff = prev ? Number(w.weight) - Number(prev.weight) : 0;
        const d = prev && diff ? ` <span class="muted">(${diff > 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')})</span>` : '';
        return `${dmy(w.date)} — ${fmtKg(w.weight)}${d}`;
      }).join('<br>');
      const nb = nextBirthday(a);
      extra = `${nb && nb.days <= 7 ? (nb.days === 0 ? '🎉 <b>Сьогодні день народження!</b><br><br>' : `🎂 День народження ${fmtDate(nb.date)} — виповнюється ${nb.age}<br><br>`) : ''}Цього місяця: <b>${visits.length}</b> тренувань ·
        ${pay.length ? `<span class="badge ok">оплачено</span>` : `<span class="badge bad">не оплачено</span>`}
        ${wHistory ? `<br><br><b>Вага:</b><br>${wHistory}` : ''}
        ${history ? `<br><br><b>Атестації:</b><br>${history}` : ''}
        ${a.phone ? `<br><br><a class="link" href="tel:${esc(a.phone.replace(/[^\d+]/g, ''))}">📞 Подзвонити ${esc(a.parent_name || '')}</a>` : ''}`;

      values: a ? { ...a, weight: lastWeight } : { group_name: state.group !== 'Усі' ? state.group : '', active: true },
      fields: [
        { name: 'full_name', label: 'Імʼя та прізвище', required: true },
        { name: 'group_name', label: 'Група', type: 'select', options: GROUPS, required: true },
        { name: 'birth_date', label: 'Дата народження' + (a && !a.birth_date && a.birth_year ? ` (зараз вказано лише рік: ${a.birth_year})` : ''), type: 'date', attrs: 'min="1990-01-01" max="' + today() + '"' },
        { name: 'weight', label: 'Вага, кг (зберігається в історію на сьогодні)', type: 'number', attrs: 'min="10" max="200" step="0.1" inputmode="decimal"' },
        { name: 'belt', label: 'Пояс / кю', type: 'select', options: beltOptions(a && a.belt) },
        { name: 'parent_name', label: 'Батьки (імʼя)' },
        { name: 'phone', label: 'Телефон', type: 'tel' },
        { name: 'notes', label: 'Нотатки', type: 'textarea' },
        { name: 'active', label: 'Активний (ходить на тренування)', type: 'checkbox' },
      ],

        const weight = obj.weight;

        else id = (await q(db.from('athletes').insert(obj).select('id').single())).id;
        if (weight !== null && weight !== lastWeight) {
          await q(db.from('weights').upsert({ athlete_id: id, date: today(), weight }, { onConflict: 'athlete_id,date' }));

        }).join('')}</div>`;
    }).join('');
    if (!rows.length) html += '<p class="muted">Атестацій ще немає. Натисніть «+ Додати», щоб записати результат здачі.</p>';
    $('#view').innerHTML = html;
    $('#view').onclick = e => {
      const r = e.target.closest('.row[data-id]');
      if (r) gradingForm(ath, list.find(g => String(g.id) === r.dataset.id));
    };
  }

  function gradingForm(ath, g) {
    const options = ath.filter(a => isActive(a) || (g && String(a.id) === String(g.athlete_id)))
      .filter(a => g || inGroup(a))
      .map(a => [a.id, a.full_name + (a.belt ? ` (зараз: ${a.belt})` : '')]);
    const numericId = ath.length && typeof ath[0].id === 'number';
    openForm({
      title: g ? 'Редагувати атестацію' : 'Нова атестація',
      values: g ? { ...g, passed: g.passed ? 'yes' : 'no' } : { date: today(), passed: 'yes' },
      fields: [
        { name: 'athlete_id', label: 'Спортсмен', type: 'select', options, required: true, cast: numericId ? 'number' : '' },
        { name: 'date', label: 'Дата атестації', type: 'date', required: true },
        { name: 'belt', label: 'На який пояс / кю', type: 'select', required: true, options: beltOptions(g && g.belt) },
        { name: 'passed', label: 'Результат', type: 'select', required: true, options: [['yes', 'Здав'], ['no', 'Не здав']] },
        { name: 'note', label: 'Примітка (екзаменатор, оцінка…)' },
      ],
      extra: 'Якщо спортсмен здав, його пояс у картці оновиться автоматично.',
      onSave: async obj => {
        obj.passed = obj.passed === 'yes';
        if (g) await q(db.from('gradings').update(obj).eq('id', g.id));
        else await q(db.from('gradings').insert(obj));
        if (obj.passed) {
          // пояс у картці = пояс з найсвіжішої успішної атестації
          const last = await q(db.from('gradings').select('belt').eq('athlete_id', obj.athlete_id)
            .eq('passed', true).order('date', { ascending: false }).limit(1));
          if (last[0]) await q(db.from('athletes').update({ belt: last[0].belt }).eq('id', obj.athlete_id));
        }
      },
      onDelete: g ? () => q(db.from('gradings').delete().eq('id', g.id)) : null,
    });
    // Для нової атестації: при виборі спортсмена одразу підставляємо наступний пояс
    if (!g) {
      const sel = $('#dlg [name=athlete_id]'), belt = $('#dlg [name=belt]');
      sel.onchange = () => {
        const a = ath.find(x => String(x.id) === sel.value);
        if (a) belt.value = nextBelt(a.belt);
      };
    }
  }

  // ----- Відвідування -----
  async function attendanceView() {
    setActions('');
    const monthStart = state.date.slice(0, 7) + '-01';
    const monthEnd = shiftMonth(state.date.slice(0, 7), 1) + '-01';

    const [ath, marks, monthMarks] = await Promise.all([
      q(db.from('athletes').select('id, full_name, group_name, active').order('full_name')),
      q(db.from('attendance').select('athlete_id, present').eq('date', state.date)),
      q(db.from('attendance').select('athlete_id, date').eq('present', true).gte('date', monthStart).lt('date', monthEnd)),
    ]);
    const rows = ath.filter(a => isActive(a) && inGroup(a));
    const byId = new Map(rows.map(a => [String(a.id), a]));
    const present = new Set(marks.filter(m => m.present).map(m => String(m.athlete_id)));

    $('#view').innerHTML = `
      <div class="bar">
        <button class="btn light sq" data-shift="-1" aria-label="Попередній день">‹</button>
        <label class="picker"><span>${fmtDate(state.date, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })}</span>
          <input type="date" id="attDate" value="${state.date}" aria-label="Обрати дату"></label>
        <button class="btn light sq" data-shift="1" aria-label="Наступний день">›</button>
      </div>
      ${chips()}
      <p class="summary" id="attSum"></p>
      <div class="list" id="attList">
        ${rows.map(a => `
          <label class="row tick">
            <span><strong>${esc(a.full_name)}</strong><span>${esc(a.group_name || '')}</span></span>
            <input type="checkbox" data-id="${esc(a.id)}" ${present.has(String(a.id)) ? 'checked' : ''}>
          </label>`).join('') || '<div class="empty">У цій групі немає активних спортсменів</div>'}
      </div>
      ${rows.length ? '<button class="btn light wide" id="allBtn">Відмітити всіх присутніми</button>' : ''}
      <h3>${fmtMonth(state.date.slice(0, 7))}: відвідування</h3>
      <div class="list" id="stats"></div>`;

    const updateSum = () => {
      const n = $('#attList').querySelectorAll('input:checked').length;
      $('#attSum').innerHTML = `${fmtDate(state.date, { weekday: 'long', day: 'numeric', month: 'long' })} · присутні <b>${n}</b> з ${rows.length}`;
    };
    updateSum();

    // Статистика за місяць
    const counts = new Map();
    const days = new Set();
    monthMarks.forEach(m => {
      if (!byId.has(String(m.athlete_id))) return;
      counts.set(String(m.athlete_id), (counts.get(String(m.athlete_id)) || 0) + 1);
      days.add(m.date);
    });
    const ranked = rows.map(a => [a, counts.get(String(a.id)) || 0]).sort((x, y) => y[1] - x[1]);
    $('#stats').innerHTML = ranked.length
      ? `<div class="row" style="cursor:default"><span class="muted small">Днів з відмітками: ${days.size}</span></div>` +
        ranked.map(([a, n]) => `<div class="row" style="cursor:default"><span>${esc(a.full_name)}</span><span class="badge ${n ? 'gold' : 'bad'}">${n}</span></div>`).join('')
      : '<div class="empty">Немає даних</div>';

    const save = async (ids, isPresent) => {
      const payload = ids.map(id => ({ athlete_id: byId.get(id).id, date: state.date, present: isPresent }));
      await q(db.from('attendance').upsert(payload, { onConflict: 'athlete_id,date' }));
    };

    $('#attList').onchange = async e => {
      const box = e.target;
      if (!box.dataset.id) return;
      updateSum();
      try { await save([box.dataset.id], box.checked); }
      catch (err) { box.checked = !box.checked; updateSum(); }
    };
    const allBtn = $('#allBtn');
    if (allBtn) allBtn.onclick = async () => {
      allBtn.disabled = true;
      try { await save(rows.map(a => String(a.id)), true); toast('Всіх відмічено'); render(); }
      catch (err) { allBtn.disabled = false; }
    };
    $('#attDate').onchange = e => { if (e.target.value) { state.date = e.target.value; render(); } };
    document.querySelectorAll('[data-shift]').forEach(b =>
      b.onclick = () => { state.date = shiftDate(state.date, Number(b.dataset.shift)); render(); });
  }

  // ----- Оплати -----
  async function paymentsView() {
    setActions('');
    const monthStart = state.month + '-01';
    const [ath, pays] = await Promise.all([
      q(db.from('athletes').select('id, full_name, group_name, active, phone, parent_name').order('full_name')),
      q(db.from('payments').select('*').eq('month', monthStart)),
    ]);
    const rows = ath.filter(a => isActive(a) && inGroup(a));
    const payOf = new Map(pays.map(p => [String(p.athlete_id), p]));
    const paidRows = rows.filter(a => payOf.has(String(a.id)));
    const debtors = rows.filter(a => !payOf.has(String(a.id)));
    const total = paidRows.reduce((s, a) => s + Number(payOf.get(String(a.id)).amount || 0), 0);

    $('#view').innerHTML = `
      <div class="bar">
        <button class="btn light sq" data-mshift="-1" aria-label="Попередній місяць">‹</button>
        <div class="picker"><span>${fmtMonth(state.month)}</span></div>
        <button class="btn light sq" data-mshift="1" aria-label="Наступний місяць">›</button>
      </div>
      ${chips()}
      <p class="summary">${fmtMonth(state.month)} · оплатили <b>${paidRows.length}</b> з ${rows.length} · ${fmtMoney(total)}</p>
      <div class="list" id="payList">
        ${[...debtors, ...paidRows].map(a => {
          const p = payOf.get(String(a.id));
          return `<button class="row" data-id="${esc(a.id)}">
            <div><strong>${esc(a.full_name)}</strong><span>${esc(a.group_name || '')}${p && p.note ? ' · ' + esc(p.note) : ''}</span></div>
            ${p ? `<span class="badge ok">✓ ${fmtMoney(p.amount)} · ${fmtDate(p.paid_at, { day: '2-digit', month: '2-digit' })}</span>`
                : '<span class="badge bad">Не оплачено</span>'}
          </button>`;
        }).join('') || '<div class="empty">У цій групі немає активних спортсменів</div>'}
      </div>
      ${debtors.length ? '<button class="btn light wide" id="copyDebtors">Скопіювати список боржників</button>' : ''}`;

    $('#payList').onclick = e => {
      const r = e.target.closest('[data-id]');
      if (!r) return;
      const a = rows.find(x => String(x.id) === r.dataset.id);
      const p = payOf.get(r.dataset.id);
      let lastAmount = '';
      try { lastAmount = localStorage.getItem('ft_last_amount') || ''; } catch (err) {}
      openForm({
        title: `${a.full_name} — ${fmtMonth(state.month).toLowerCase()}`,
        values: p || { amount: lastAmount, paid_at: today() },
        fields: [
          { name: 'amount', label: 'Сума, грн', type: 'number', required: true, attrs: 'min="0" step="1" inputmode="numeric"' },
          { name: 'paid_at', label: 'Дата оплати', type: 'date', required: true },
          { name: 'note', label: 'Примітка (готівка, картка, знижка…)' },
        ],
        onSave: async obj => {
          try { localStorage.setItem('ft_last_amount', obj.amount); } catch (err) {}
          await q(db.from('payments').upsert({ ...obj, athlete_id: a.id, month: monthStart }, { onConflict: 'athlete_id,month' }));
        },
        onDelete: p ? () => q(db.from('payments').delete().eq('id', p.id)) : null,
        deleteText: 'Скасувати цю оплату?',
      });
    };

    const copyBtn = $('#copyDebtors');
    if (copyBtn) copyBtn.onclick = async () => {
      const text = `Не оплачено за ${fmtMonth(state.month).toLowerCase()}:\n` +
        debtors.map(a => `• ${a.full_name}${a.phone ? ' — ' + a.phone : ''}`).join('\n');
      try { await navigator.clipboard.writeText(text); toast('Список скопійовано'); }
      catch (err) { prompt('Скопіюйте список:', text); }
    };
    document.querySelectorAll('[data-mshift]').forEach(b =>
      b.onclick = () => { state.month = shiftMonth(state.month, Number(b.dataset.mshift)); render(); });
  }

  async function chatView() {
    setActions('');
    const msgs = (await q(db.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(200))).reverse();
    $('#view').innerHTML = `
      <div class="chat" id="chatBox"></div>
      <form class="chat-input" id="chatForm">
        <textarea id="chatText" rows="1" maxlength="2000" placeholder="Повідомлення…"></textarea>
        <button class="btn" type="submit" aria-label="Надіслати">➤</button>
      </form>`;
    const box = $('#chatBox');
    let lastDay = '';
    const atBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const add = m => {
      if (box.querySelector(`[data-id="${m.id}"]`)) return;
      const d = new Date(m.created_at);
      const day = d.toLocaleDateString('sv-SE');
      if (day !== lastDay) {
        lastDay = day;
        box.insertAdjacentHTML('beforeend', `<div class="msg-day">${day === today() ? 'Сьогодні' : fmtDate(day, { day: 'numeric', month: 'long', year: 'numeric' })}</div>`);
      }
      const mine = m.author_email === state.email;
      const time = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      box.insertAdjacentHTML('beforeend', `
        <div class="msg ${mine ? 'mine' : ''} ${mine || isCoach() ? 'can-del' : ''}" data-id="${m.id}">
          <div class="msg-head">${mine ? 'Ви' : `<b>${esc(m.author_name || m.author_email)}</b>`} · ${time}</div>
          <div class="msg-body">${esc(m.body)}</div>
        </div>`);
    };
    msgs.forEach(add);
    if (!msgs.length) box.innerHTML = '<p class="muted small" id="chatEmpty" style="text-align:center;margin:auto">Повідомлень ще немає. Напишіть першим 👋</p>';
    box.scrollTop = box.scrollHeight;

    // Нові повідомлення в реальному часі
    chatChannel = db.channel('team-chat')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, p => {
        const stick = atBottom();
        const empty = $('#chatEmpty'); if (empty) empty.remove();
        add(p.new);
        if (stick) box.scrollTop = box.scrollHeight;
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat_messages' }, p => {
        const el = box.querySelector(`[data-id="${p.old.id}"]`); if (el) el.remove();
      })
      .subscribe();

    const text = $('#chatText');
    text.oninput = () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 120) + 'px'; };
    text.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('#chatForm').requestSubmit(); }
    };
    $('#chatForm').onsubmit = async e => {
      e.preventDefault();
      const body = text.value.trim();
      if (!body) return;
      text.value = ''; text.oninput();
      const { data, error } = await db.from('chat_messages').insert({ body }).select().single();
      if (error) { toast('Не надіслано: ' + error.message, true); text.value = body; return; }
      const empty = $('#chatEmpty'); if (empty) empty.remove();
      add(data);
      box.scrollTop = box.scrollHeight;
    };
    box.onclick = async e => {
      const el = e.target.closest('.msg.can-del');
      if (!el || !confirm('Видалити це повідомлення?')) return;
      const { error } = await db.from('chat_messages').delete().eq('id', el.dataset.id);
      if (error) toast('Помилка: ' + error.message, true); else el.remove();
    };
  }

  // ----- Учасники та доступ (тільки тренер) -----
  async function membersView() {
    setActions('<button class="btn" id="addBtn">+ Додати</button>');
    $('#addBtn').onclick = () => memberForm();
    const list = await q(db.from('members').select('*').order('role').order('full_name'));
    $('#view').innerHTML = `
      <div class="info"><b>Як дати доступ:</b><br>
        1. Додайте людину тут: імʼя, email і роль.<br>
        2. Людина відкриває сайт → «Зареєструватися» з цим самим email → підтверджує пошту.<br>
        3. Батьки й спортсмени бачать чат, розклад, події та матеріали. Тренери бачать усе.</div>
      <div class="list">${list.map(m => `
        <button class="row" data-email="${esc(m.email)}">
          <div><strong>${esc(m.full_name)}</strong><span>${esc(m.email)}</span></div>
          <span class="badge ${m.role === 'coach' ? 'gold' : 'ok'}">${ROLES[m.role] || m.role}</span>
        </button>`).join('') || '<div class="empty">Ще нікого не додано</div>'}</div>`;
    $('#view').onclick = e => {
      const r = e.target.closest('.row[data-email]');
      if (r) memberForm(list.find(m => m.email === r.dataset.email));
    };
  }

  function memberForm(m) {
    openForm({
      title: m ? m.full_name : 'Новий учасник',
      values: m || { role: 'parent' },
      fields: [
        { name: 'full_name', label: 'Імʼя (так буде видно в чаті)', required: true, attrs: 'placeholder="напр. Олена (мама Івана)"' },
        { name: 'email', label: 'Email', type: 'email', required: true },
        { name: 'role', label: 'Роль', type: 'select', required: true, options: Object.entries(ROLES) },
      ],
      onSave: obj => {
        obj.email = obj.email.toLowerCase();
        return m ? q(db.from('members').update(obj).eq('email', m.email)) : q(db.from('members').insert(obj));
      },
      onDelete: m ? () => q(db.from('members').delete().eq('email', m.email)) : null,
      deleteText: 'Забрати доступ у цієї людини?',
    });
  }

  // ----- Налаштування -----
  async function settingsView() {
    setActions('');
    let lastAmount = '';
    try { lastAmount = localStorage.getItem('ft_last_amount') || ''; } catch (e) {}
    const seg = (key, opts) => `<div class="chips">${opts.map(([v, l]) =>
      `<button type="button" class="chip ${String(settings[key]) === String(v) ? 'on' : ''}" data-set="${key}" data-val="${v}">${l}</button>`).join('')}</div>`;
    $('#view').innerHTML = `
      <div class="set-block"><h3>🌗 Тема</h3>${seg('theme', [['auto', 'Як у системі'], ['light', 'Світла'], ['dark', 'Темна']])}</div>
      <div class="set-block"><h3>🥋 Колір акценту</h3>
        <div class="swatches">${ACCENTS.map(([c, l]) =>
          `<button type="button" class="swatch ${settings.accent === c ? 'on' : ''}" data-set="accent" data-val="${c}" style="background:${c}" title="${l}" aria-label="${l}"></button>`).join('')}</div></div>
      <div class="set-block"><h3>🔠 Розмір тексту</h3>${seg('zoom', [[1, 'Звичайний'], [1.12, 'Великий'], [1.25, 'Дуже великий']])}
        <p class="muted small">Великий зручно, коли телефон лежить на лавці в залі.</p></div>
      <div class="set-block"><h3>✍️ Девіз у шапці</h3>
        <input id="setMotto" maxlength="60" placeholder="Дисципліна. Праця. Результат." value="${esc(settings.motto)}"></div>
      <div class="set-block"><h3>🏠 Що показувати на головній</h3>
        ${[['showToday', 'Блок «Сьогодні»'], ...(isCoach() ? [['showStats', 'Цифри: спортсмени, присутні, боржники'], ['showBdays', 'Дні народження']] : [])]
          .map(([k, l]) => `<label class="check"><input type="checkbox" data-check="${k}" ${settings[k] ? 'checked' : ''}>${l}</label>`).join('')}</div>
      ${isCoach() ? `<div class="set-block"><h3>💵 Сума оплати за замовчуванням</h3>
        <input id="setAmount" type="number" min="0" inputmode="numeric" placeholder="напр. 800" value="${esc(lastAmount)}"></div>` : ''}
      <p class="muted small">Налаштування зберігаються на цьому пристрої.</p>`;
    $('#view').onclick = e => {
      const b = e.target.closest('[data-set]');
      if (!b) return;
      settings[b.dataset.set] = b.dataset.set === 'zoom' ? Number(b.dataset.val) : b.dataset.val;
      saveSettings(); settingsView();
    };
    $('#setMotto').oninput = e => { settings.motto = e.target.value.trim(); saveSettings(); };
    document.querySelectorAll('[data-check]').forEach(c => c.onchange = () => { settings[c.dataset.check] = c.checked; saveSettings(); });
    const amt = $('#setAmount');
    if (amt) amt.oninput = () => { try { localStorage.setItem('ft_last_amount', amt.value); } catch (e) {} };
  }

  // ----- Меню ☰ -----
  function openMenu() {
    const m = $('#menu');
    m.innerHTML = `
      <div class="menu-head">
        <div><b>${esc(state.name && state.name !== 'Тренер' ? state.name : state.email)}</b><span>${state.role === 'coach' ? 'Тренер' : state.role === 'member' ? 'Учасник команди' : 'Без доступу'}</span></div>
        <button type="button" class="menu-close" aria-label="Закрити">✕</button>
      </div>
      <a class="menu-item" href="#home">🏠 Головна</a>
      ${state.role ? '<a class="menu-item" href="#chat">💬 Чат команди</a>' : ''}
      ${isCoach() ? '<a class="menu-item" href="#members">👥 Учасники та доступ</a>' : ''}
      <a class="menu-item" href="#settings">⚙️ Налаштування</a>
      <button type="button" class="menu-item" id="menuLogout">🚪 Вийти</button>
      <div class="menu-foot">Ferents Team Training · ${APP_VERSION}</div>`;
    m.onclick = e => {
      if (e.target === m || e.target.closest('.menu-close') || e.target.closest('a.menu-item')) m.close();
    };
    $('#menuLogout').onclick = async () => { m.close(); await db.auth.signOut(); location.hash = ''; };
    m.showModal();
  }
  $('#menuBtn').onclick = openMenu;

  // =====================================================================
  //  НАВІГАЦІЯ ТА ВХІД
  // =====================================================================
  const VIEWS = {
    home: homeView, athletes: athletesView, weights: weightsView, gradings: gradingsView, attendance: attendanceView, payments: paymentsView,
    training: trainingView, plans: plansView, tests: testsView,
    schedule: scheduleView, events: eventsView, materials: materialsView,
    links: linksView, chat: chatView, members: membersView, settings: settingsView,
  };
  // Що бачать батьки і спортсмени
  const MEMBER_ROUTES = ['home', 'schedule', 'events', 'materials', 'links', 'chat', 'settings'];
  const PARENT_ROUTE = { weights: 'athletes', schedule: 'training', plans: 'training', tests: 'training', links: 'materials', chat: 'materials' };

  let renderId = 0;
  async function render() {
    let route = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
    if (!isCoach() && !MEMBER_ROUTES.includes(route)) route = 'home';
    if (!state.role && route !== 'settings') route = 'home';
    const id = ++renderId;
    if (chatChannel) { db.removeChannel(chatChannel); chatChannel = null; }
    $('#pageTitle').textContent = TITLES[route];
    $('#backLink').hidden = route === 'home';
    const parent = isCoach() ? PARENT_ROUTE[route] : (['links', 'chat'].includes(route) ? 'home' : null);
    $('#backLink').href = '#' + (parent || 'home');
    $('#view').onclick = null;
    if (!$('#view').innerHTML.trim() || $('#view').dataset.route !== route) {
      $('#view').innerHTML = '<p class="muted">Завантаження…</p>';
    }
    $('#view').dataset.route = route;
    try {
      await VIEWS[route]();
    } catch (err) {
      if (id === renderId) $('#view').innerHTML = `<p class="err">Не вдалося завантажити: ${esc(err.message)}</p>`;
    }
  }

  // Клік по фільтру групи
  document.addEventListener('click', e => {
    const chip = e.target.closest('[data-group]');
    if (chip) { state.group = chip.dataset.group; render(); }
  });
  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

  // Хто зайшов: тренер, учасник (батьки/спортсмен) чи ще ніхто
  async function detectRole() {
    const { data: coach } = await db.rpc('is_coach');
    const { data: name } = await db.rpc('my_name');
    state.name = name || '';
    if (coach) return 'coach';
    const { data: member } = await db.rpc('is_member');
    return member ? 'member' : null;
  }

  let signedIn = null;
  async function showApp(session) {
    const on = !!session;
    if (signedIn === on) return;
    signedIn = on;
    $('#loginSection').hidden = on;
    $('#appSection').hidden = !on;
    $('#menuBtn').hidden = !on;
    if (on) {
      state.email = (session.user.email || '').toLowerCase();
      $('#view').innerHTML = '<p class="muted">Завантаження…</p>';
      state.role = await detectRole();
      render();
    } else {
      state.role = null;
    }
  }

  // Вхід / реєстрація / відновлення пароля
  let loginMode = 'login';
  function setLoginMode(mode) {
    loginMode = mode;
    const t = { login: ['Вхід', 'Увійти', 'Для тренерів, батьків і спортсменів команди.'],
                signup: ['Реєстрація', 'Зареєструватися', 'Використайте email, який ви дали тренеру. Пароль — мінімум 6 символів.'],
                reset: ['Відновлення пароля', 'Надіслати лист', 'Ми надішлемо на пошту посилання для нового пароля.'] }[mode];
    $('#loginTitle').textContent = t[0];
    $('#loginBtn').textContent = t[1];
    $('#loginHint').textContent = t[2];
    $('#pwLabel').hidden = mode === 'reset';
    $('#loginPassword').required = mode !== 'reset';
    $('#loginPassword').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    document.querySelectorAll('[data-mode]').forEach(b => { b.hidden = b.dataset.mode === mode || (mode !== 'login' && b.dataset.mode !== 'login'); });
    $('#loginMessage').textContent = '';
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setLoginMode(b.dataset.mode));

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#loginMessage');
    const say = (text, ok) => { msg.textContent = text; msg.className = 'small ' + (ok ? 'msg-ok' : 'err'); };
    const email = $('#loginEmail').value.trim().toLowerCase();
    const password = $('#loginPassword').value;
    const redirect = location.origin + location.pathname;
    const btn = $('#loginBtn');
    btn.disabled = true;
    try {
      if (loginMode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) say(/confirm/i.test(error.message) ? 'Підтвердіть email — перевірте пошту' : 'Невірний email або пароль');
      } else if (loginMode === 'signup') {
        const { data, error } = await db.auth.signUp({ email, password, options: { emailRedirectTo: redirect } });
        if (error) say(/registered|exists/i.test(error.message) ? 'Цей email уже зареєстрований — увійдіть' : 'Помилка: ' + error.message);
        else if (!data.session) say(`Готово! Ми надіслали лист на ${email}. Підтвердіть пошту й увійдіть.`, true);
      } else {
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: redirect });
        if (error) say('Помилка: ' + error.message);
        else say('Лист надіслано. Відкрийте посилання з пошти й задайте новий пароль.', true);
      }
    } finally { btn.disabled = false; }
  });

  (async function boot() {
    const { data: { session } } = await db.auth.getSession();
    showApp(session);
    db.auth.onAuthStateChange((event, s) => {
      setTimeout(() => {
        showApp(s);
        if (event === 'PASSWORD_RECOVERY') {
          openForm({
            title: 'Новий пароль',
            fields: [{ name: 'password', label: 'Новий пароль (мінімум 6 символів)', type: 'password', required: true, attrs: 'minlength="6" autocomplete="new-password"' }],
            onSave: async obj => {
              const { error } = await db.auth.updateUser({ password: obj.password });
              if (error) { toast('Помилка: ' + error.message, true); throw error; }
            },
          });
        }
      }, 0);
    });
  })();
  </script>
</body>
</html>
