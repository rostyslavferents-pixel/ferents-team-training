<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ferents Team">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ferents Team Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/karate-192.png">
  <link rel="apple-touch-icon" href="icons/karate-apple-180.png">

  <style>
    :root {
      --bg: #f3f4f6; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --border: #d1d5db;
      --card: #ffffff; --head: #111827; --primary: #111827; --on-primary: #ffffff; --link: #1d4ed8;
      --gold: #d1a84b;
      --gold-soft: color-mix(in srgb, var(--gold) 20%, var(--card));
      --gold-ink: color-mix(in srgb, var(--gold) 60%, #000);
      --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0b0f17; --ink: #e5e7eb; --muted: #9ca3af; --line: #1f2937; --border: #374151;
      --card: #151b26; --head: #05080d; --primary: #e5e7eb; --on-primary: #111827; --link: #93c5fd;
      --gold-ink: color-mix(in srgb, var(--gold) 70%, #fff);
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1515;
      color-scheme: dark;
    }
    @font-face {
      font-family: 'Manrope'; src: url('fonts/manrope.woff') format('woff');
      font-weight: 200 800; font-style: normal; font-display: swap;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }

    /* Шапка */
    header {
      background: var(--head); color: #fff;
      padding: 22px 16px 18px;
      padding-top: max(22px, env(safe-area-inset-top));
      border-bottom: 4px solid var(--gold);
    }
    .hwrap { max-width: 640px; margin: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .brand { color: #d1d5db; font-size: 12px; letter-spacing: .15em; margin: 0; }
    header h1 { margin: 6px 0 2px; font-size: 28px; }
    .motto { color: #9ca3af; margin: 0; font-size: 13px; }
    .ghost {
      background: transparent; border: 1px solid #374151; color: #d1d5db;
      border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
    }

    main { padding: 16px; max-width: 640px; margin: auto; }
    footer { text-align: center; color: var(--muted); padding: 25px; font-size: 12px; }

    /* Загальні елементи */
    h2 { margin: 4px 0; font-size: 22px; }
    h3 { margin: 24px 0 8px; font-size: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .err { color: var(--bad); }

    .topbar { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; min-height: 40px; }
    .topbar h2 { flex: 1; }
    .back { color: var(--ink); text-decoration: none; font-size: 15px; padding: 8px 10px 8px 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 0; border-radius: 12px; padding: 11px 16px;
      background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; font-size: 15px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .5; }
    .btn.light { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .btn.danger { background: var(--bad-bg); color: var(--bad); }
    .btn.wide { width: 100%; margin-top: 12px; }
    .btn.sq { width: 46px; padding: 11px 0; font-size: 20px; line-height: 1; }

    input, select, textarea {
      width: 100%; font: inherit; font-size: 16px; color: var(--ink);
      padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); border-color: transparent; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 0; }
    label > input, label > select, label > textarea { margin-top: 5px; }
    label.check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); }
    label.check input { width: 22px; height: 22px; margin: 0; }

    .search { margin-bottom: 10px; }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .picker {
      position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
      font-size: 16px; font-weight: 600; color: var(--ink);
    }
    label.picker { cursor: pointer; }
    .picker input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .picker input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; cursor: pointer; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .chip {
      flex: none; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
      background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
    }
    .chip.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }

    /* Головний екран */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; }
    .stat { background: var(--card); border-radius: 14px; padding: 14px 12px; box-shadow: 0 2px 8px #0000000d; }
    .stat b { display: block; font-size: 26px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat.warn b { color: var(--bad); }
    .bday { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 12px; font-size: 14px; line-height: 1.6; box-shadow: 0 2px 8px #0000000d; }
    .bday strong { display: block; font-size: 13px; letter-spacing: .05em; color: var(--gold-ink); margin-bottom: 2px; }
    .bday-today { background: var(--gold-soft); border-radius: 10px; padding: 8px 10px; margin: 4px 0; }
    .today { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
    .today strong { display: block; font-size: 13px; letter-spacing: .05em; color: var(--gold-ink); margin-bottom: 2px; }

    .card {
      display: block; width: 100%; text-align: left; text-decoration: none;
      border: 0; border-radius: 14px; background: var(--card); padding: 18px 20px; margin: 12px 0;
      color: var(--ink); font: inherit; box-shadow: 0 2px 8px #0000000d; cursor: pointer;
    }
    .card strong { display: block; font-size: 18px; }
    .card span { display: block; color: var(--muted); margin-top: 6px; font-size: 14px; }
    .card:active, .row:active { background: var(--line); }

    /* Списки */
    .list { background: var(--card); border-radius: 14px; box-shadow: 0 2px 8px #0000000d; overflow: hidden; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; border: 0; background: var(--card); color: var(--ink);
      font: inherit; padding: 13px 16px; margin: 0; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .row:last-child { border-bottom: 0; }
    .row strong { display: block; font-size: 16px; font-weight: 600; }
    .row span span, .row div span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .row.dim strong { color: var(--muted); }
    .row.tick input { width: 26px; height: 26px; flex: none; accent-color: var(--ok); }
    .chev { color: var(--muted); font-size: 22px; }
    .row.plan { align-items: flex-start; }
    .tasks { white-space: pre-line; font-size: 14px; color: var(--ink); margin-top: 8px; line-height: 1.5; overflow-wrap: anywhere; }
    .tasks a { color: var(--gold-ink, var(--gold)); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .row input.kg { width: 92px; flex: none; text-align: center; }
    .day-title { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 6px; }
    .empty { padding: 18px 16px; color: var(--muted); }

    .badge { flex: none; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .poll { margin: 0 0 10px; padding: 12px 14px; }
    .poll-opts { margin: 10px 0; display: grid; gap: 6px; }
    .poll-opt { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
    .poll-opt.on { border-color: var(--gold, #c9a227); }
    .poll-opt input { margin: 0; position: relative; z-index: 1; }
    .poll-txt { flex: 1; display: flex; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
    .poll-txt b { font-weight: 600; white-space: nowrap; }
    .poll-opt small { position: relative; z-index: 1; flex-basis: 100%; }
    .poll-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold-soft, rgba(201,162,39,.15)); z-index: 0; }
    .lk { font-size: 12px; font-weight: 400; margin-left: 4px; white-space: nowrap; }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.gold { background: var(--gold-soft); color: var(--gold-ink); }

    .summary { font-size: 15px; margin: 6px 2px 10px; }
    .summary b { font-size: 18px; }

    a.link { color: var(--link); word-break: break-all; }

    /* Вхід */
    .login { background: var(--card); border-radius: 16px; padding: 22px 20px; box-shadow: 0 2px 8px #0000000d; margin-top: 10px; }
    .login .btn { width: 100%; margin-top: 18px; }

    /* Діалог */
    dialog {
      border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100% - 24px));
      max-height: calc(100% - 40px); box-shadow: 0 20px 50px #0004; background: var(--card); color: var(--ink);
    }
    dialog::backdrop { background: #1118277a; }
    dialog form { padding: 20px; }
    dialog h3 { margin: 0 0 4px; font-size: 19px; }
    .dlg-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .dlg-actions .spacer { flex: 1; }
    .dlg-extra { margin-top: 12px; font-size: 14px; }

    /* Меню ☰ */
    .menu-btn {
      width: 44px; height: 44px; flex: none; border: 1px solid #374151; border-radius: 12px; background: transparent;
      display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center; cursor: pointer;
    }
    .menu-btn span { width: 20px; height: 2px; border-radius: 2px; background: #e5e7eb; }
    dialog#menu {
      margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(320px, 86%);
      border-radius: 18px 0 0 18px; padding: 0; display: none; flex-direction: column;
    }
    dialog#menu[open] { display: flex; }
    .menu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      padding: max(20px, env(safe-area-inset-top)) 18px 16px; background: var(--head); color: #fff; border-bottom: 4px solid var(--gold); }
    .menu-head span { display: block; color: #9ca3af; font-size: 13px; margin-top: 3px; }
    .menu-close { background: transparent; border: 0; color: #d1d5db; cursor: pointer; padding: 2px; display: flex; }
    .menu-close svg { width: 22px; height: 22px; }
    .menu-list { padding: 10px 0; }
    .menu-item {
      position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      padding: 11px 18px; border: 0; background: transparent; color: var(--ink);
      font: inherit; font-size: 16px; font-weight: 500; text-decoration: none; cursor: pointer;
      transition: background .15s;
    }
    .menu-item + .menu-item::before {
      content: ''; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--line);
    }
    .menu-item:active { background: var(--line); }
    .menu-item:active .mi { transform: scale(.92); }
    .mi {
      --c1: #94a3b8; --c2: #475569;
      width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(145deg, var(--c1), var(--c2));
      box-shadow: inset 0 1px 0 #ffffff40, 0 3px 8px color-mix(in srgb, var(--c2) 35%, transparent);
      transition: transform .15s;
    }
    .mi svg { width: 20px; height: 20px; }
    .mi-home     { --c1: #ecc76a; --c2: #b8862b; }
    .mi-chat     { --c1: #5eb0ff; --c2: #2563eb; }
    .mi-users    { --c1: #3ddc9f; --c2: #0e9467; }
    .mi-stats    { --c1: #ffb347; --c2: #e0701b; }
    .mi-settings { --c1: #9aa6b8; --c2: #4b5567; }
    .mi-install  { --c1: #b197fc; --c2: #6d3fe0; }
    .mi-logout   { --c1: #ff8a80; --c2: #d93636; }
    .mi-chev { margin-left: auto; width: 18px; height: 18px; color: var(--border); flex: none; }
    .menu-item.out { margin-top: 14px; color: var(--bad); }
    .menu-item.out::before { display: none; }
    .menu-foot { margin-top: auto; padding: 16px 18px; color: var(--muted); font-size: 12px; }

    /* Налаштування */
    .set-block { background: var(--card); border-radius: 14px; padding: 2px 16px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px #0000000d; }
    .set-block h3 { margin: 14px 0 10px; }
    .tlist { display: flex; flex-direction: column; gap: 6px; }
    .tlist .trow { display: flex; gap: 6px; align-items: center; }
    .tlist .trow input { flex: 1; min-width: 0; margin: 0; }
    .tlist .trow button { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 10px; border: 1px solid var(--line, #0002); background: transparent; color: inherit; font-size: 16px; }
    .acc { width: 100%; border-collapse: collapse; font-size: 14px; }
    .acc th { font-weight: 600; font-size: 12px; text-align: center; padding: 4px; }
    .acc td { padding: 8px 4px; border-top: 1px solid var(--line, #0001); }
    .acc td.c { text-align: center; width: 72px; }
    .acc input { width: 22px; height: 22px; }
    .team-save { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); margin-top: 6px; }
    .chip { background: var(--card); }
    .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; }
    .swatch.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }

    /* Чат */
    .chat {
      height: calc(100dvh - 250px); min-height: 280px; overflow-y: auto; background: var(--card);
      border-radius: 14px; padding: 12px; box-shadow: 0 2px 8px #0000000d; display: flex; flex-direction: column; gap: 6px;
    }
    .msg { max-width: 82%; align-self: flex-start; background: var(--bg); border-radius: 14px 14px 14px 4px; padding: 7px 12px; }
    .msg.mine { align-self: flex-end; background: var(--gold-soft); border-radius: 14px 14px 4px 14px; }
    .msg.can-del { cursor: pointer; }
    .msg-head { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .msg-head b { color: var(--gold-ink); font-weight: 600; }
    .msg-body { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.4; }
    .msg-day { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
    .chat-input { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
    .chat-input textarea { resize: none; max-height: 120px; margin: 0; }
    .chat-input .btn { flex: none; width: 52px; height: 46px; padding: 0; font-size: 20px; }

    /* Вхід */
    .login-links { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--link); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    .msg-ok { color: var(--ok); }
    .info { background: var(--gold-soft); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.55; margin-bottom: 12px; }

    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--head); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px;
      max-width: calc(100% - 32px); box-shadow: 0 8px 24px #0003; z-index: 10;
    }
    .toast.bad { background: var(--bad); }

    /* Компактна шапка всередині розділів */
    body.inner header { padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom-width: 3px; }
    body.inner header h1, body.inner header .motto { display: none; }
    body.inner .brand { font-size: 13px; color: #e5e7eb; }
    body.inner .hwrap { align-items: center; }
    body.inner .menu-btn { width: 38px; height: 38px; }
    body[data-route="chat"] footer { display: none; }
    body.has-tabs .chat { height: calc(100dvh - 250px - 62px - env(safe-area-inset-bottom)); }

    /* Нижня панель вкладок */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px #0000000a;
    }
    .tabbar .tabs { max-width: 640px; margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); }
    .tab {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 9px 2px 8px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 500;
    }
    .tab svg { width: 24px; height: 24px; }
    .tab.on { color: var(--ink); font-weight: 700; }
    .tab.on svg { color: var(--gold-ink); }
    .tab.on::before { content: ''; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
    body.has-tabs { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
    body.has-tabs .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
    .medal { width: 1.35em; height: 1.35em; vertical-align: -0.32em; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
    .medal + .medal { margin-left: -0.15em; }
    .medal-n { font-weight: 700; margin: 0 6px 0 1px; }
    .btn > .ic-svg, h3 > .ic-svg { width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: 2px; }
    .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* Головна: плитки розділів */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .tile {
      display: flex; flex-direction: column; gap: 10px; min-height: 108px; padding: 14px;
      background: var(--card); border-radius: 14px; box-shadow: 0 2px 8px #0000000d; color: var(--ink); text-decoration: none;
    }
    .tile:active { background: var(--line); }
    .tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink);
      display: flex; align-items: center; justify-content: center; }
    .tile .ic svg { width: 22px; height: 22px; }
    .tile strong { display: block; font-size: 15px; }
    .tile small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    a.stat { color: inherit; text-decoration: none; position: relative; }
    a.stat::after { content: '›'; position: absolute; top: 10px; right: 12px; color: var(--muted); font-size: 18px; }
    a.stat:active { background: var(--line); }

    /* Головна: тренування зараз */
    .now {
      display: flex; align-items: center; gap: 14px; margin: 0 0 12px; padding: 16px 18px; border-radius: 16px;
      background: var(--primary); color: var(--on-primary); text-decoration: none;
    }
    .now b { display: block; font-size: 17px; }
    .now span { display: block; font-size: 13px; opacity: .75; margin-top: 2px; }
    .now .go { margin-left: auto; font-size: 26px; line-height: 1; }
    .now .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); animation: pulse 1.8s infinite; }
    .now.soon { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--gold); }
    .now.soon .dot { animation: none; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 70%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }

    /* Кольоровий пояс */
    .belt {
      display: inline-block; flex: none; width: 26px; height: 9px; border-radius: 3px; vertical-align: middle;
      background: linear-gradient(90deg, var(--b) 0 60%, var(--s) 60% 80%, var(--b) 80%);
      box-shadow: inset 0 0 0 1px #0000002e; margin-right: 8px; position: relative; top: -2px;
    }
    :root[data-theme="dark"] .belt { box-shadow: inset 0 0 0 1px #ffffff47; }
    .belt.big { width: 54px; height: 16px; border-radius: 4px; top: 0; }
    a.row { text-decoration: none; }
    a.btn { text-decoration: none; }
    .row .belt, .badge .belt { display: inline-block; margin-top: 0; }
    .chips.seg { padding-bottom: 4px; }
    .chips.seg .chip { font-weight: 600; }
    .chips.seg .chip.on { background: var(--gold); color: #111827; }
    /* Статистика (тренер) */
    .st-lock { font-size: 12px; color: var(--muted); margin: 0 2px 8px; }
    .st-kpi { grid-template-columns: repeat(2, 1fr); }
    .st-kpi .stat b { font-size: 22px; }
    .st-sort { align-items: center; }
    .st-sort .chip { padding: 6px 12px; font-size: 13px; }
    .st-wrap { overflow-x: auto; background: var(--card); border-radius: 14px; box-shadow: 0 2px 8px #0000000d; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
    .stbl { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; font-variant-numeric: tabular-nums; }
    .stbl th, .stbl td { padding: 7px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .stbl thead th { font-size: 12px; font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--card); }
    .stbl th.d b { display: block; color: var(--ink); font-size: 13px; }
    .stbl th.d small { font-weight: 400; font-size: 10px; }
    .stbl th[scope=row], .stbl th.nm { position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left; font-weight: 500;
      max-width: 150px; overflow: hidden; text-overflow: ellipsis; box-shadow: 1px 0 0 var(--line); }
    .stbl thead th.nm { z-index: 2; }
    .stbl th[scope=row] a { color: var(--ink); text-decoration: none; }
    .stbl tbody tr:last-child th, .stbl tbody tr:last-child td { border-bottom: 0; }
    .stbl tfoot th, .stbl tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
    .stbl small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
    .stbl td.tot small { display: inline; }
    .stbl td.y, .st-leg .y { color: var(--ok); font-size: 15px; }
    .stbl td.n, .st-leg .n { color: var(--bad); }
    .stbl td.x { background: color-mix(in srgb, var(--line) 35%, transparent); }
    .stbl td.tot { font-weight: 700; }
    .stbl td.pay-ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; cursor: pointer; }
    .stbl td.pay-no { background: var(--bad-bg); color: var(--bad); }
    .stbl td.bad, .st-leg .bad { color: var(--bad); font-weight: 700; }
    .stbl td.ok, .st-leg .ok { color: var(--ok); font-weight: 600; }
    .stbl td.pc { min-width: 64px; position: relative; }
    .pbar { display: block; height: 4px; border-radius: 2px; margin: 0 auto 3px; width: 44px;
      background: linear-gradient(90deg, var(--ok) var(--p), var(--line) var(--p)); }
    .st-leg { margin: 4px 2px 14px; line-height: 1.5; }
    .st-link { display: block; text-align: center; margin: 10px 0 4px; font-size: 14px; }
    .sum-sec { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .sum-sec:last-child { border-bottom: 0; }
    .assign-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .assign-row .chips { padding: 0; flex: none; }
    .assign-row .chip { padding: 6px 11px; font-size: 13px; }
    .pick-tools { display: flex; align-items: center; gap: 14px; margin: 10px 0 8px; }
    .pick-tools span { margin-left: auto; }
    .pick-list { max-height: 46vh; overflow-y: auto; box-shadow: inset 0 0 0 1px var(--line); }
    .hero > h2 + .note { color: var(--ink); }
    /* Форми знизу екрана (шторки) */
    dialog.sheet[open] { animation: sheetUp .3s cubic-bezier(.2, .8, .2, 1); }
    dialog.sheet.closing { animation: sheetDown .2s ease-in forwards; }
    dialog.sheet::backdrop { animation: fadeIn .25s ease-out; }
    dialog.sheet.closing::backdrop { animation: fadeOut .2s ease-in forwards; }
    dialog.sheet::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 10px auto 0; }
    dialog.sheet .dlg-actions { position: sticky; bottom: 0; z-index: 1; background: var(--card); margin: 16px -20px -20px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
    @media (max-width: 700px) {
      dialog.sheet { margin: auto 0 0; width: 100%; max-width: 100%; max-height: 92dvh; border-radius: 22px 22px 0 0; }
    }
    @media (min-width: 701px) {
      dialog.sheet[open] { animation-name: popIn; }
      dialog.sheet.closing { animation-name: popOut; }
      dialog.sheet::before { display: none; }
    }
    @keyframes sheetUp { from { transform: translateY(100%); } }
    @keyframes sheetDown { to { transform: translateY(100%); } }
    @keyframes popIn { from { transform: scale(.96); opacity: 0; } }
    @keyframes popOut { to { transform: scale(.96); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }
    .confirm-body { padding: 18px 20px 20px; }
    .confirm-body h3 { margin: 4px 0 6px; font-size: 19px; }
    .confirm-body p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; white-space: pre-line; }
    .confirm-body .btns { display: grid; gap: 8px; margin-top: 18px; padding-bottom: env(safe-area-inset-bottom); }
    .confirm-body .btn { width: 100%; padding: 14px; }
    .confirm-body textarea { margin-top: 10px; font-size: 14px; }
    .toast { display: flex; align-items: center; gap: 14px; }
    .toast .act { background: none; border: 0; color: var(--gold); font: inherit; font-weight: 700; padding: 2px 0; cursor: pointer; white-space: nowrap; }

    /* Скелетон під час завантаження */
    .sk { border-radius: 14px; margin-bottom: 10px;
      background: linear-gradient(90deg, var(--line) 0, color-mix(in srgb, var(--line) 45%, var(--card)) 40%, var(--line) 80%);
      background-size: 300% 100%; animation: shimmer 1.3s linear infinite; }
    .sk.t { height: 22px; width: 45%; } .sk.c { height: 92px; } .sk.r { height: 58px; }
    .sk.g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: none; animation: none; }
    .sk.g i { height: 84px; border-radius: 14px; background: inherit; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    #view.enter { animation: viewIn .28s ease-out; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { #view.enter, dialog.sheet[open], dialog.sheet.closing, .sk { animation: none !important; } }

    /* Потягни, щоб оновити */
    .ptr { position: fixed; top: 0; left: 50%; z-index: 7; width: 38px; height: 38px; border-radius: 50%; opacity: 0;
      transform: translate(-50%, -44px); background: var(--card); color: var(--gold-ink); box-shadow: 0 4px 14px #0003;
      display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .ptr svg { width: 20px; height: 20px; }
    .ptr.ready { color: var(--ok); }
    .ptr.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Нова версія */
    .update { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 9;
      width: min(560px, calc(100% - 24px)); display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px;
      background: var(--head); color: #fff; border-radius: 14px; box-shadow: 0 10px 30px #0004; font-size: 14px; animation: sheetUp .3s ease-out; }
    .update div { flex: 1; } .update b { color: var(--gold); }
    .update .btn { background: var(--gold); color: #111827; padding: 9px 14px; }
    body.has-tabs .update { bottom: calc(74px + env(safe-area-inset-bottom)); }
    body:has(#update:not([hidden])) .toast { bottom: calc(150px + env(safe-area-inset-bottom)); }
    /* Фото спортсменів */
    .av { flex: none; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: var(--gold-soft); color: var(--gold-ink);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
    .hero-top .avatar, .hero-top .av-cam { display: flex; margin-top: 0; }
    .hero-top .avatar { color: var(--gold-ink); }
    .av-edit { position: relative; cursor: pointer; flex: none; margin: 0; }
    .av-edit .avatar { width: 64px; height: 64px; font-size: 22px; }
    .av-cam { position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--card);
      box-shadow: 0 1px 4px #0003; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .av-lg { width: 52px; height: 52px; font-size: 18px; }
    .av img, .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar { overflow: hidden; }
    .row .grow { flex: 1; min-width: 0; }
    .photo-edit { display: flex; align-items: center; gap: 16px; margin: 14px 0 4px; }
    .photo-edit .avatar { width: 84px; height: 84px; font-size: 28px; }
    .photo-edit .acts { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .photo-edit label.btn { margin: 0; color: var(--ink); font-size: 14px; }
    .photo-note { font-size: 13px; color: var(--muted); margin-top: 10px; }
    /* Вибір кадру з фото: масштаб пальцями / колесом, перетягування */
    dialog.crop { border: 0; padding: 0; margin: auto; background: transparent; color: #fff; max-width: 100vw; max-height: 100dvh; overflow: visible; }
    dialog.crop::backdrop { background: #000e; }
    .crop-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
    .crop-title { font-weight: 600; font-size: 16px; }
    .crop-hint { font-size: 13px; color: #fffb; text-align: center; max-width: 340px; }
    .crop-vp { position: relative; width: min(88vw, 62dvh, 440px); aspect-ratio: 1; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; border-radius: 12px; overflow: hidden; background: #111; }
    .crop-vp.drag { cursor: grabbing; }
    .crop-vp canvas { width: 100%; height: 100%; display: block; }
    .crop-vp .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 999px #0009; border: 2px solid #fffc; pointer-events: none; }
    .crop-zoom { display: flex; align-items: center; gap: 10px; width: min(88vw, 440px); }
    .crop-zoom input { flex: 1; accent-color: var(--gold); }
    .crop-zoom button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #fff5; background: #fff1; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
    .crop-acts { display: flex; gap: 12px; width: min(88vw, 440px); }
    .crop-acts button { flex: 1; height: 46px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; border: 1px solid #fff5; background: transparent; color: #fff; }
    .crop-acts button.ok { background: var(--gold); border-color: var(--gold); color: #111; }
    .rem-list { margin-top: 14px; border-top: 1px solid var(--line); }
    .rem-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .rem-who b { display: block; font-size: 15px; }
    .rem-who span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .rem-done { font-style: normal; color: var(--ok); font-weight: 600; }
    .rem-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .rbtn { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .rbtn.viber { background: #7360f2; color: #fff; box-shadow: none; }
    .rbtn.tg { background: #229ed9; color: #fff; box-shadow: none; }
    .rbtn.sms { background: var(--ok-bg); color: var(--ok); box-shadow: none; }
    /* «Нагадано» в списку оплат */
    .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 12px; background: var(--line); }
    .seg2 a { text-align: center; padding: 9px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 15px; }
    .seg2 a.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px #0000001a; }
    .rank { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; background: var(--line); color: var(--muted); }
    .rank.r1 { background: #f5c542; color: #3d2c00; } .rank.r2 { background: #cfd5dd; color: #2b3138; } .rank.r3 { background: #d9935a; color: #3a1d06; }
    .rating .row { align-items: flex-start; }
    .rating .rank, .rating .av { margin-top: 2px; }
    .merits { white-space: pre-line; font-size: 13px; line-height: 1.45; color: var(--ink); margin-top: 6px;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .row div.merits { display: -webkit-box; }
    .rank-tools { display: flex; flex-direction: column; gap: 4px; flex: none; }
    .rank-tools button { width: 36px; height: 32px; border: 0; border-radius: 9px; background: var(--bg); color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; cursor: pointer; }
    .rank-tools button.x { color: var(--bad); }
    .rank-tools button:disabled { opacity: .3; }
    .hero .merits-full { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; white-space: pre-line; }
    .hero .merits-full b { display: block; font-size: 13px; letter-spacing: .04em; color: var(--gold-ink); margin-bottom: 4px; }
    .badge .belt { width: 18px; height: 7px; margin-right: 5px; top: -1px; }
    :root[data-theme="dark"] .now:not(.soon) { background: var(--gold); color: #111827; }
    :root[data-theme="dark"] .now:not(.soon) .dot { background: #111827; }

    /* Сторінка спортсмена */
    .hero { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px #0000000d; margin-bottom: 12px; }
    .hero-top { display: flex; align-items: center; gap: 14px; }
    .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
    .hero h2 { font-size: 21px; margin: 0; }
    .hero-top span { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; }
    .hero-belt { display: flex; align-items: center; gap: 4px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 600; }
    .hero .btn.wide { margin-top: 14px; }
    .hero .note { margin-top: 12px; font-size: 14px; white-space: pre-line; color: var(--muted); }
    .panel { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px #0000000d; }
    .bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; border-bottom: 1px solid var(--border); padding-top: 4px; }
    .bcol { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .bbar { width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; background: var(--gold); min-height: 2px; }
    .bcol.zero .bbar { background: var(--line); }
    .bval { font-size: 13px; font-weight: 600; }
    .blabs { display: flex; gap: 10px; margin-top: 6px; }
    .blabs span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
    .wchart { width: 100%; height: auto; display: block; }
    .wchart .grid { stroke: var(--line); stroke-width: 1; }
    .wchart .axis { fill: var(--muted); font-size: 11px; }
    .wchart .line { fill: none; stroke: var(--gold-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .wchart .pt { fill: var(--card); stroke: var(--gold-ink); stroke-width: 2; }
    .wchart .pt.on { fill: var(--gold-ink); }
    .wchart .hit { fill: transparent; cursor: pointer; }
    .wchart .rd-band { fill: #22c55e; opacity: .12; }
    .wchart .lbl { fill: var(--ink); font-size: 12px; font-weight: 700; }
    .tile.wide { grid-column: span 2; flex-direction: row; align-items: center; min-height: 0; }
    .sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 24px 0 8px; }
    .sec h3 { margin: 0; }
    .btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
    .hero-w { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; }
    /* Встановлення додатку */
    .install { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 12px 14px;
      box-shadow: inset 0 0 0 1px var(--line), 0 2px 8px #0000000d; margin-bottom: 12px; }
    .install img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
    .install div { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
    .install b { display: block; color: var(--ink); font-size: 15px; }
    .install .x { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 4px; cursor: pointer; }
    .steps { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: st; }
    .steps li { counter-increment: st; display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
    .steps li:last-child { border-bottom: 0; }
    .steps li::before { content: counter(st); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    .ios-share { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--link); }
    .offline.sync { background: var(--gold-soft); color: var(--gold-ink); font-weight: 600; }
    .wait { font-style: normal; color: var(--gold-ink); }
    .offline { position: sticky; top: 0; z-index: 6; background: var(--bad); color: #fff; text-align: center; font-size: 13px; padding: 7px 12px; }
    .wcap { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
    .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .mcell { border-radius: 10px; padding: 8px 2px; text-align: center; font-size: 12px; text-decoration: none; }
    .mcell b { display: block; font-size: 15px; margin-top: 2px; }
    .mcell.ok { background: var(--ok-bg); color: var(--ok); }
    .mcell.bad { background: var(--bad-bg); color: var(--bad); }

    /* ===================== Чистовий шар: спокійно, акуратно, як у нативних додатках ===================== */
    :root {
      --bg: #f4f4f1; --line: #e8e7e3; --border: #d6d4ce;
      --r: 16px; --ease: cubic-bezier(.2, .8, .2, 1);
      --sh-1: 0 1px 2px rgb(17 24 39 / .05);
      --sh-2: 0 6px 20px rgb(17 24 39 / .08);
      --hair: inset 0 0 0 1px rgb(17 24 39 / .06);
    }
    :root[data-theme="dark"] {
      --bg: #0b0d11; --card: #15181e; --line: #22262e; --border: #313641;
      --sh-1: 0 1px 2px rgb(0 0 0 / .3); --sh-2: 0 8px 24px rgb(0 0 0 / .4);
      --hair: inset 0 0 0 1px rgb(255 255 255 / .06);
    }
    body { -webkit-font-smoothing: antialiased; }

    /* Шапка: однотонна, без ефектів */
    header { background: #0f1115; border-bottom-width: 2px; }
    header h1 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; }
    .brand { letter-spacing: .2em; font-weight: 600; color: #9aa0aa; }
    .motto { color: #7c828d; }
    body.inner header { position: sticky; top: 0; z-index: 6; }
    .offline { z-index: 7; }
    .menu-btn { border-color: #2a2e36; }

    /* Типографіка */
    h2 { font-weight: 800; letter-spacing: -.02em; }
    .day-title, .today strong, .bday strong { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
    .back { font-weight: 600; }

    /* Картки: тонка рамка замість важких тіней */
    .card, .tile, .list, .stat, .hero, .panel, .set-block, .login, .bday, .st-wrap, .chat, .install, .now.soon {
      border-radius: var(--r); box-shadow: var(--hair), var(--sh-1);
    }
    .today { background: var(--card); border-radius: var(--r); box-shadow: var(--hair), var(--sh-1); }
    .today strong, .bday strong { color: var(--muted); }

    /* Натискання */
    .card, .tile, a.stat, .now, .btn, .chip, .install, .seg2 a { transition: transform .18s var(--ease), background-color .15s; }
    .card:active, .tile:active, a.stat:active, .now:active, .install:active { transform: scale(.98); }
    .btn:active, .chip:active { transform: scale(.97); }
    @media (hover: hover) { .card:hover, .tile:hover, a.stat:hover { box-shadow: var(--hair), var(--sh-2); } }
    input, select, textarea { border-color: var(--border); transition: box-shadow .15s, border-color .15s; }
    input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent); }

    /* Плитки */
    .tile { min-height: 112px; padding: 16px; }
    .tile .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--bg); color: var(--ink); }
    .tile strong { font-weight: 700; }

    /* Цифри */
    .stat { padding: 14px; }
    .stat b { font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

    /* «Зараз / наступне» */
    .now { border-radius: var(--r); }
    .now:not(.soon) { background: #0f1115; color: #fff; }
    .now b { font-weight: 700; }
    .now .go { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-style: normal; background: rgb(255 255 255 / .08); }
    .now.soon .go { background: var(--bg); color: var(--muted); }
    :root[data-theme="dark"] .now:not(.soon) { background: var(--gold); color: #111; }
    :root[data-theme="dark"] .now:not(.soon) .go { background: rgb(0 0 0 / .1); }

    /* Рядки, чипи */
    .row { padding: 14px 16px; }
    .row:active { background: color-mix(in srgb, var(--line) 60%, var(--card)); }
    .chev { color: var(--border); }
    .chip { font-weight: 600; }

    /* Нижня панель: пігулка під активною вкладкою */
    .tabbar { background: color-mix(in srgb, var(--card) 92%, transparent);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: none; }
    .tab { isolation: isolate; }
    .tab.on svg { color: var(--ink); }
    .tab.on::before { top: 5px; left: 50%; right: auto; width: 54px; height: 32px; transform: translateX(-50%); border-radius: 999px;
      background: var(--line); z-index: -1; animation: tabPill .3s var(--ease); }
    @keyframes tabPill { from { transform: translateX(-50%) scaleX(.6); opacity: 0; } }

    dialog::backdrop { background: rgb(0 0 0 / .4); }

    /* Іконки замість емодзі */
    :where(.ic-svg) { width: 1.1em; height: 1.1em; vertical-align: -0.18em; flex: none; margin-right: 5px; }
    .tile .ic .ic-svg, .tab .ic-svg, .ptr .ic-svg, .av-cam .ic-svg, .ic-box .ic-svg, .rbtn .ic-svg, .chat-input .ic-svg { margin: 0; vertical-align: 0; }
    .lk .ic-svg { margin-right: 2px; }
    .av-cam .ic-svg { width: 14px; height: 14px; }
    .chat-input .btn .ic-svg { width: 20px; height: 20px; }
    .ic-box { width: 40px; height: 40px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--bg); color: var(--ink); }
    .ic-box .ic-svg { width: 22px; height: 22px; }

    /* Лічильник на плитці */
    .tile .ic { position: relative; }
    .cnt { position: absolute; top: -6px; right: -8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
      background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--card); }

    /* П'єдестал рейтингу */
    .podium { display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: end; gap: 8px; margin: 4px 0 14px; }
    .pd { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: var(--ink); min-width: 0; }
    .pd b { font-size: 14px; font-weight: 700; margin-top: 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pd small { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pd-av { width: 56px; height: 56px; font-size: 18px; }
    .pd1 .pd-av { width: 70px; height: 70px; font-size: 22px; box-shadow: 0 0 0 3px var(--card), 0 0 0 5px #e0b43a; }
    .pd2 .pd-av { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px #b5bcc6; }
    .pd3 .pd-av { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px #c9834b; }
    .pd-step { width: 100%; margin-top: 8px; border-radius: 12px 12px 0 0; background: var(--card); box-shadow: var(--hair);
      display: flex; justify-content: center; padding-top: 10px; }
    .pd1 .pd-step { height: 78px; } .pd2 .pd-step { height: 58px; } .pd3 .pd-step { height: 44px; }

    /* Сходинки поясів */
    .ladder { display: flex; gap: 3px; margin-top: 12px; }
    .ladder i { flex: 1; height: 8px; border-radius: 3px; opacity: .28;
      background: linear-gradient(90deg, var(--b) 0 60%, var(--s) 60% 80%, var(--b) 80%); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
    .ladder i.done { opacity: .75; }
    .ladder i.cur { opacity: 1; height: 12px; margin-top: -2px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .2), 0 0 0 2px var(--card), 0 0 0 3.5px var(--ink); }
    .ladder-cap { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .ladder-cap b { color: var(--ink); }

    /* Кільце відвідуваності */
    .ring-wrap { position: relative; width: 50px; height: 50px; margin-bottom: 4px; }
    .ring-wrap b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px !important; letter-spacing: 0 !important; margin: 0 !important; }
    .ring { width: 50px; height: 50px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--line); stroke-width: 5; }
    .ring-fg { fill: none; stroke: var(--ok); stroke-width: 5; stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--o);
      animation: ringIn .9s var(--ease) both; }
    @keyframes ringIn { from { stroke-dashoffset: var(--c); } }

    /* Календар відвідувань */
    .cal-h, .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-h span { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
    .cal-g { margin-top: 6px; }
    .cal-g i { aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-size: 13px; color: var(--muted);
      font-variant-numeric: tabular-nums; }
    .cal-g i.e { visibility: hidden; }
    .cal-g i.y { background: var(--ok); color: #fff; font-weight: 700; }
    :root[data-theme="dark"] .cal-g i.y { color: #08210f; }
    .cal-g i.n { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
    .cal-g i.f { box-shadow: inset 0 0 0 1.5px var(--border); color: var(--ink); }
    .cal-g i.t { outline: 2px solid var(--ink); outline-offset: 1px; }
    .cal-leg { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .cal-leg span { display: flex; align-items: center; gap: 5px; }
    .cal-leg i { width: 10px; height: 10px; border-radius: 3px; }
    .cal-leg i.y { background: var(--ok); } .cal-leg i.n { background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
    .cal-leg i.f { box-shadow: inset 0 0 0 1.5px var(--border); }

    /* Швидка відмітка присутності */
    .att-prog { height: 4px; border-radius: 2px; background: var(--line); margin: -4px 2px 12px; overflow: hidden; }
    .att-prog i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 2px; transition: width .35s var(--ease); }
    .att .row { gap: 12px; padding: 11px 14px; transition: background-color .2s; user-select: none; -webkit-user-select: none; }
    .att .row input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .att .row.on { background: color-mix(in srgb, var(--ok) 9%, var(--card)); }
    .att .row:active { background: color-mix(in srgb, var(--line) 70%, var(--card)); }
    .mk { flex: none; width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--border); display: grid; place-items: center;
      transition: background-color .2s, box-shadow .2s, transform .25s var(--ease); }
    .mk svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s ease .05s; }
    .row.on .mk { background: var(--ok); box-shadow: none; transform: scale(1.08); }
    .row.on .mk svg { stroke-dashoffset: 0; }
    :root[data-theme="dark"] .mk svg { stroke: #08210f; }
    .att .row:active .mk { transform: scale(.88); }

    /* Харчування */
    .ncard { display: flex !important; align-items: center; gap: 14px; }
    .ncard > span:nth-child(2) { flex: 1; min-width: 0; }
    .ncard strong { font-size: 16px !important; }
    .nf h3 .ic-svg { margin-right: 6px; }
    .nf label + .chips { margin-top: 6px; }
    .nf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .nmode { margin-top: 2px; }
    .nres { padding: 18px; }
    .nk b { font-size: 36px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .nk span { margin-left: 8px; color: var(--muted); font-size: 14px; }
    .nk .nmin { display: block; margin: 0 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #22c55e; }
    .plate .chips { justify-content: center; flex-wrap: wrap; }
    .plate-wrap { display: flex; justify-content: center; margin: 4px 0 10px; }
    .plate-svg { width: 100%; max-width: 260px; height: auto; overflow: visible; }
    .plate-rim { fill: var(--card); stroke: var(--line); stroke-width: 2; filter: drop-shadow(0 6px 14px rgba(0,0,0,.12)); }
    .plate-in { fill: none; stroke: var(--line); stroke-width: 1; }
    .plate-part { cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s; }
    .plate-part path { stroke: var(--card); stroke-width: 3; transition: d .4s; }
    .plate-part.on { transform: scale(1.06); }
    .plate-part.dim { opacity: .35; }
    .plate-t { fill: #fff; font-size: 17px; font-weight: 800; pointer-events: none; }
    .plate-s { fill: rgba(255,255,255,.92); font-size: 11px; font-weight: 600; pointer-events: none; }
    .plate-leg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .plate-leg button { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    .plate-leg button.on { border-color: var(--ink); }
    .plate-leg i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .plate-leg b { margin-left: auto; font-variant-numeric: tabular-nums; }
    .plate-info { margin: 12px 2px 0; font-size: 14px; line-height: 1.45; }
    .nk-note { margin: 6px 0 12px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .nbar { display: flex; gap: 3px; height: 8px; margin: 12px 0 14px; border-radius: 4px; overflow: hidden; }
    .nbar i { display: block; }
    .nbar .p, .nm .p::before { background: #3b82f6; } .nbar .f, .nm .f::before { background: #f59e0b; } .nbar .c, .nm .c::before { background: #10b981; }
    .nm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .nm > div { position: relative; padding-left: 10px; }
    .nm > div::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; }
    .nm span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
    .nm b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .nm b small { font-size: 14px; font-weight: 600; color: var(--muted); }
    .nm > div > small { display: block; font-size: 11px; color: var(--muted); }
    .nwater { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
    .nwater .ic-svg { color: #3b82f6; }
    details.nrec { display: block; padding: 0; cursor: pointer; }
    details.nrec summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
    details.nrec summary::-webkit-details-marker { display: none; }
    details.nrec[open] .chev { transform: rotate(90deg); }
    .nrec .chev { transition: transform .2s; }
    .nrec-b { padding: 0 16px 14px; font-size: 14px; line-height: 1.5; }
    .nrec-b p { margin: 0 0 6px; }
    .nfood th[scope=row] { white-space: normal; min-width: 170px; max-width: 220px; font-size: 13px; }
    .nnote { margin: 14px 4px 0; line-height: 1.5; }

    /* Сон і відновлення */
    h3 .ic-svg { margin-right: 6px; }
    .sl-p { margin: 8px 0 14px; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .sl-calc { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; align-items: end; padding-top: 12px; border-top: 1px solid var(--line); }
    .sl-calc label { margin: 0; }
    .sl-out { font-size: 15px; line-height: 1.35; padding-bottom: 4px; }
    .sl-out b { font-size: 18px; font-variant-numeric: tabular-nums; }
    .sl-out small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ic-box.sm { width: 34px; height: 34px; border-radius: 10px; align-self: flex-start; margin-top: 2px; }
    .ic-box.sm .ic-svg { width: 18px; height: 18px; }
    .sl-tips .row { align-items: flex-start; }
    .sl-tips .row span span, .sl-tips .grow > span { line-height: 1.45; }
    .sl-warn { margin-top: 12px; }

    /* Рецепти: підрахунок складу */
    .rcalc { margin-top: 8px; font-size: 13px; line-height: 1.4; }
    .rcalc > div { padding: 4px 0; }
    .rcalc .ok .ic-svg { color: var(--ok); } .rcalc .no { color: var(--bad); }
    .rcalc span { color: var(--muted); }
    .rcalc .tot { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
    .rcp .chips { flex-wrap: wrap; margin-top: 6px; }

    /* ===== Глибина: контраст фону й карток, кольорові іконки розділів ===== */
    :root { --bg: #ebe9e4; --line: #e6e3dd;
      --sh-1: 0 1px 2px rgb(17 24 39 / .06), 0 6px 18px rgb(17 24 39 / .07);
      --sh-2: 0 2px 4px rgb(17 24 39 / .06), 0 14px 32px rgb(17 24 39 / .12); }
    :root[data-theme="dark"] { --bg: #0a0c10; --card: #171b22; --line: #242a33;
      --sh-1: 0 1px 2px rgb(0 0 0 / .5), 0 8px 22px rgb(0 0 0 / .35); }
    header { background: linear-gradient(180deg, #181c25 0%, #0e1015 100%); }
    .now:not(.soon) { background: linear-gradient(140deg, #222833 0%, #0f1115 70%); box-shadow: 0 10px 26px rgb(15 17 21 / .22); }
    :root[data-theme="dark"] .now:not(.soon) { background: linear-gradient(140deg, #e3be62 0%, #c99a3c 100%); }
    h3 { color: var(--ink); font-weight: 800; }
    .tab.on::before { background: var(--gold-soft); }
    .tab.on svg { color: var(--gold-ink); }
    .ic-box { background: var(--gold-soft); color: var(--gold-ink); }
    /* Кожен розділ — свій спокійний колір */
    .tile .ic { --ic: #64748b; background: color-mix(in srgb, var(--ic) 13%, var(--card)); color: var(--ic); }
    :root[data-theme="dark"] .tile .ic { background: color-mix(in srgb, var(--ic) 22%, var(--card)); color: color-mix(in srgb, var(--ic) 70%, #fff); }
    .tile[href="#training"] .ic, .tile[href="#schedule"] .ic { --ic: #2563eb; }
    .tile[href="#events"] .ic, .tile[href="#rating"] .ic { --ic: #c88a12; }
    .tile[href="#links"] .ic { --ic: #db2777; }
    .tile[href="#members"] .ic { --ic: #059669; }
    .tile[href="#stats"] .ic { --ic: #7c3aed; }
    .tile[href="#applications"] .ic, .tile[href="#plans"] .ic { --ic: #0d9488; }
    .tile[href="#chat"] .ic { --ic: #0284c7; }
    .tile[href="#news"] .ic { --ic: #ea580c; }
    .tile[href^="#nutrition"] .ic { --ic: #16a34a; }
    /* Готовність */
    .rd-card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .rd-head { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .rd-head span { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
    .rd-ring { position: relative; }
    .rd-ring svg { width: 100%; height: 100%; }
    .rd-bg { fill: none; stroke: var(--line); stroke-width: 12; }
    .rd-fg { fill: none; stroke-width: 12; stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--o); animation: ringIn 1s var(--ease) both; }
    .rd-ring > div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .rd-ring b { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
    .rd-ring span { font-size: 14px; font-weight: 700; margin-top: 6px; }
    .rd-tip { margin: 0; text-align: center; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .rd-stats { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
    .rd-stats b { display: block; font-size: 18px; font-weight: 800; }
    .rd-stats span { font-size: 12px; color: var(--muted); }
    .rd-week { width: 100%; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 70px; padding-top: 8px; border-top: 1px solid var(--line); }
    .rd-day { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 62px; }
    .rd-day i { width: 100%; max-width: 20px; border-radius: 5px; }
    .rd-day span { font-size: 11px; color: var(--muted); }
    .rd-card .btn.wide { margin-top: 0; }
    .rd-sleep { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 4px; }
    .rd-sleep b { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rd-scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .rd-scale .chip { min-height: 46px; font-size: 16px; font-weight: 800; }
    .rd-lohi { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ===== Пробна версія: стиль Monobank ===== */
    :root.mono { --bg: #000; --card: #15171b; --ink: #fff; --muted: #8e8e93; --line: #25272c; --border: #34363c; --head: #000;
      --sh-1: none; --sh-2: none; --hair: inset 0 0 0 1px #1f2126; color-scheme: dark; }
    :root.mono body { background: #000; }
    :root.mono header { background: #000; border-bottom: 0; }
    :root.mono header::after { display: none; }
    :root.mono header h1, :root.mono .motto { display: none; }
    :root.mono header { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: 6px; }
    :root.mono .hwrap { align-items: center; }
    :root.mono .menu-btn { border: 0; background: #1c1c1e; border-radius: 50%; }
    :root.mono .tabbar { background: rgb(10 10 11 / .9); border-top-color: #1c1c1e; }
    :root.mono .tab.on::before { background: #2a2416; }
    :root.mono .card, :root.mono .tile, :root.mono .list, :root.mono .stat, :root.mono .hero, :root.mono .panel, :root.mono .set-block, :root.mono .now.soon, :root.mono .bday, :root.mono .install { border-radius: 20px; }
    :root.mono h2 { font-size: 26px; }
    :root.mono #view h3 { font-size: 13px; letter-spacing: .02em; color: var(--muted); font-weight: 700; margin: 22px 4px 8px; }
    :root.mono .tile .ic { border-radius: 50%; }
    :root.mono .now:not(.soon) { background: var(--gold); color: #1a1205; box-shadow: none; }
    .m-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0 18px; gap: 2px; }
    .m-hero span { font-size: 14px; color: var(--muted); font-weight: 600; }
    .m-hero b { font-size: 64px; font-weight: 800; letter-spacing: -.045em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .m-hero b small { font-size: 30px; color: var(--muted); letter-spacing: -.02em; }
    .m-hero em { font-style: normal; font-size: 14px; font-weight: 700; }
    .m-hero em.ok { color: #4ade80; } .m-hero em.bad { color: #f87171; }
    .m-acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 4px 0 16px; }
    .m-acts a { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #d1d1d6; font-size: 12px; font-weight: 600; }
    .m-acts a > span { position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
      background: color-mix(in srgb, var(--mc) 22%, #000); color: color-mix(in srgb, var(--mc) 60%, #fff); transition: transform .2s var(--ease); }
    .m-acts a:active > span { transform: scale(.9); }
    .m-acts .ic-svg { width: 24px; height: 24px; margin: 0; }
    .m-acts em { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px;
      background: #ef4444; color: #fff; font: 800 12px/20px Manrope, sans-serif; font-style: normal; text-align: center; }
    .m-card { position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 190px; padding: 18px 20px; margin: 0 0 18px;
      border-radius: 20px; background: #16181d; border: 1px solid #23262d; overflow: hidden; color: #fff; text-decoration: none; box-sizing: border-box; }
    .m-card > * { position: relative; }
    .m-belt { position: absolute !important; left: 0; right: 0; top: 92px; height: 22px; }
    .m-stripe { position: absolute !important; left: 62%; top: 92px; width: 34px; height: 22px; }

-- Вступ за посиланням: створює учасника і привʼязує до спортсмена
create or replace function public.claim_invite(p_code text, p_name text)
returns text language plpgsql security definer set search_path = public as $$
declare
  inv public.invites;
  em text := lower(auth.jwt() ->> 'email');
  aname text;
begin
  if em is null then raise exception 'not_signed_in'; end if;
  select * into inv from public.invites where code = upper(trim(p_code)) for update;
  if not found then raise exception 'invite_not_found'; end if;
  select full_name into aname from public.athletes where id = inv.athlete_id;
  if exists (select 1 from public.member_athletes where email = em and athlete_id = inv.athlete_id) then
    return aname;
  end if;
  if inv.expires_at < now() or inv.uses_left <= 0 then raise exception 'invite_expired'; end if;
  insert into public.members (email, full_name, role)
    values (em, coalesce(nullif(trim(p_name), ''), em), inv.role)
    on conflict (email) do nothing;
  insert into public.member_athletes (email, athlete_id) values (em, inv.athlete_id)
    on conflict do nothing;
  update public.invites set uses_left = uses_left - 1 where code = inv.code;
  return aname;
end $$;
revoke execute on function public.claim_invite(text, text) from anon;

// Секрет вебхука виводимо з токена — окремо задавати не треба
async function hookSecret() {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ft-hook:" + TOKEN));
  return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 48);
}

async function appUrl() {
  const { data } = await admin.from("team_settings").select("value").eq("key", "telegram").maybeSingle();
  return (data?.value as { app?: string } | null)?.app || "";
}
const openBtn = (url: string) => url ? { reply_markup: { inline_keyboard: [[{ text: "Відкрити застосунок", url }]] } } : {};

// Повідомлення від людей у боті
async function onUpdate(u: any) {
  // Відповідь на опитування в Telegram → записуємо голос
  if (u.poll_answer) {
    const pa = u.poll_answer;
    const { data: pm } = await admin.from("poll_messages").select("poll_id, chat_id").eq("tg_poll_id", String(pa.poll_id)).maybeSingle();
    if (!pm) return;
    const { data: p } = await admin.from("polls").select("closed").eq("id", pm.poll_id).maybeSingle();
    if (!p || p.closed) return;
    const { data: link } = await admin.from("telegram_links").select("email").eq("chat_id", pm.chat_id).maybeSingle();
    if (!link?.email) return;
    const email = String(link.email).toLowerCase();
    const choices = (pa.option_ids ?? []).map((n: number) => Number(n));
    if (!choices.length) await admin.from("poll_votes").delete().eq("poll_id", pm.poll_id).eq("email", email);
    else await admin.from("poll_votes").upsert({ poll_id: pm.poll_id, email, choices, via: "telegram", updated_at: new Date().toISOString() });
    return;
  }
  const msg = u.message;
  if (!msg?.chat || msg.chat.type !== "private") return;
  const chat = msg.chat.id as number;
  const text = String(msg.text || "").trim();
  const app = await appUrl();

  if (text.startsWith("/start")) {
    const code = text.split(/\\s+/)[1] || "";
    if (!code) {
      await tg("sendMessage", { chat_id: chat, parse_mode: "HTML", ...openBtn(app),
        text: "👋 Це бот <b>Ferents Team</b>.\\n\\nЩоб отримувати сповіщення, відкрийте застосунок → <b>Налаштування</b> → <b>Підключити Telegram</b>." });
      return;
    }
    const { data: row } = await admin.from("telegram_codes").select("email, created_at").eq("code", code).maybeSingle();
    if (!row || Date.now() - new Date(row.created_at).getTime() > 86400000) {
      await tg("sendMessage", { chat_id: chat, ...openBtn(app),
        text: "⏳ Посилання застаріло. Натисніть «Підключити Telegram» у застосунку ще раз." });
      return;
    }
    const name = [msg.from?.first_name, msg.from?.last_name].filter(Boolean).join(" ") || null;
    await admin.from("telegram_links").upsert({ chat_id: chat, email: row.email, tg_name: name });
    await admin.from("telegram_codes").delete().eq("code", code);

    // Кого стосується акаунт
    const { data: links } = await admin.from("member_athletes").select("athlete_id").eq("email", row.email);
    const ids = (links ?? []).map((l: any) => l.athlete_id);
    const { data: kids } = ids.length
      ? await admin.from("athletes").select("full_name").in("id", ids)
      : { data: [] as any[] };
    const who = (kids ?? []).map((k: any) => k.full_name).join(", ");

    // Повідомити тренера, що хтось підключив Telegram
    try {
      const { data: mem } = await admin.from("members").select("full_name, role").eq("email", row.email).maybeSingle();
      const isCoachAcc = mem?.role === "coach" ||
        !!(await admin.from("coaches").select("email").eq("email", row.email).maybeSingle()).data;
      if (!isCoachAcc) {
        const { data: c1 } = await admin.from("coaches").select("email");
        const { data: c2 } = await admin.from("members").select("email").eq("role", "coach");
        const cEmails = [...(c1 ?? []), ...(c2 ?? [])].map((r: any) => String(r.email).toLowerCase());
        const { data: cChats } = cEmails.length
          ? await admin.from("telegram_links").select("chat_id, email")
          : { data: [] as any[] };
        const role = mem?.role === "athlete" ? "спортсмен" : mem?.role === "parent" ? "батьки" : "акаунт";
        const note = "✈️ <b>Telegram підключено</b>\\n" + (who ? esc(who) + " (" + role + ")" : esc(mem?.full_name || row.email));
        for (const c of (cChats ?? []).filter((r: any) => cEmails.includes(String(r.email).toLowerCase()) && r.chat_id !== chat)) {
          await tg("sendMessage", { chat_id: c.chat_id, parse_mode: "HTML", text: note });
        }
      }
    } catch (e) { console.error(e); }
    await tg("sendMessage", { chat_id: chat, parse_mode: "HTML", ...openBtn(app),
      text: "✅ <b>Telegram підключено!</b>\\n\\n" +
        (who ? \`Сповіщення про: <b>\${esc(who)}</b>\\n\\n\` : "") +
        "Сюди приходитимуть оголошення тренера, нові події та інші важливі новини.\\n\\nВідключити: /stop" });
    return;
  }

  if (text === "/stop") {
    await admin.from("telegram_links").delete().eq("chat_id", chat);
    await tg("sendMessage", { chat_id: chat,
      text: "🔕 Сповіщення вимкнено. Увімкнути знову — у застосунку: Налаштування → Підключити Telegram." });
    return;
  }

  const { data: linked } = await admin.from("telegram_links").select("chat_id").eq("chat_id", chat).maybeSingle();
  await tg("sendMessage", { chat_id: chat, ...openBtn(app),
    text: linked
      ? "Я надсилаю сповіщення команди Ferents Team 🥋 Усе інше — у застосунку."
      : "Щоб отримувати сповіщення, відкрийте застосунок → Налаштування → Підключити Telegram." });
}

// Тренер натиснув «Підключити бота» в застосунку
async function setup(req: Request, b: any) {
  const asUser = createClient(URL_, Deno.env.get("SUPABASE_ANON_KEY")!, {
    global: { headers: { Authorization: req.headers.get("Authorization") ?? "" } },
  });
  if ((await asUser.rpc("is_coach")).data !== true) return json({ error: "forbidden" }, 403);
  if (!TOKEN) return json({ error: "no_token" }, 400);

  const me = await tg("getMe", {});
  if (!me.ok) return json({ error: "bad_token" }, 400);
  const hook = await tg("setWebhook", {
    url: \`\${URL_}/functions/v1/telegram\`,
    secret_token: await hookSecret(),
    allowed_updates: ["message", "poll_answer"],
    drop_pending_updates: true,
  });
  if (!hook.ok) return json({ error: "webhook: " + (hook.description || "") }, 400);
  await tg("setMyCommands", { commands: [{ command: "stop", description: "Вимкнути сповіщення" }] });

  const app = /^https:\\/\\//.test(String(b.app || "")) ? String(b.app) : "";
  const { error } = await admin.from("team_settings").upsert({
    key: "telegram", value: { username: me.result.username, app }, updated_at: new Date().toISOString(),
  });
  if (error) return json({ error: error.message }, 500);
  return json({ username: me.result.username });
}

// Тренер натиснув «Надіслати в Telegram» у нагадуваннях про оплату.
// items: [{ id: athlete_id, text }]; dry: true — лише дізнатись, у кого підключено Telegram.
async function onRemind(req: Request, b: any) {
  const asUser = createClient(URL_, Deno.env.get("SUPABASE_ANON_KEY")!, {
    global: { headers: { Authorization: req.headers.get("Authorization") ?? "" } },
  });
  if ((await asUser.rpc("is_coach")).data !== true) return json({ error: "forbidden" }, 403);
  if (!TOKEN) return json({ error: "no_token" }, 400);
  const items = (Array.isArray(b.items) ? b.items : []).slice(0, 300)
    .map((i: any) => ({ id: String(i?.id ?? ""), text: String(i?.text ?? "").slice(0, 1500) })).filter((i: any) => i.id);
  if (!items.length) return json({ with: [], sent: 0 });

  // Хто з батьків (або сам спортсмен, якщо батьків немає) підключив Telegram
  const { data: links } = await admin.from("member_athletes").select("email, athlete_id").in("athlete_id", items.map((i: any) => i.id));
  const emails = [...new Set((links ?? []).map((l: any) => String(l.email).toLowerCase()))];
  const { data: mem } = emails.length ? await admin.from("members").select("email, role").in("email", emails) : { data: [] as any[] };
  const role = new Map((mem ?? []).map((m: any) => [String(m.email).toLowerCase(), m.role]));
  const { data: tl } = emails.length ? await admin.from("telegram_links").select("chat_id, email").in("email", emails) : { data: [] as any[] };
  const chatsOf = (id: string) => {
    const mine = (links ?? []).filter((l: any) => String(l.athlete_id) === id).map((l: any) => String(l.email).toLowerCase());
    const parents = mine.filter((e: string) => role.get(e) === "parent");
    const who = parents.some((e: string) => (tl ?? []).some((t: any) => String(t.email).toLowerCase() === e)) ? parents : mine;
    return [...new Set((tl ?? []).filter((t: any) => who.includes(String(t.email).toLowerCase())).map((t: any) => Number(t.chat_id)))];
  };
  const withTg = items.filter((i: any) => chatsOf(i.id).length).map((i: any) => i.id);
  if (b.dry) return json({ with: withTg });

  const app = await appUrl();
  let sent = 0;
  const reached: string[] = [];
  for (const it of items) {
    let ok = false;
    for (const chat of chatsOf(it.id)) {
      const r = await tg("sendMessage", { chat_id: chat, text: "💳 " + it.text, ...openBtn(app) });
      if (r?.ok) { sent++; ok = true; }
      await new Promise((res) => setTimeout(res, 40)); // ліміт Telegram ~30 повідомлень/с
    }
    if (ok) reached.push(it.id);
  }
  return json({ with: withTg, sent, reached });
}

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
  try {
    const secret = req.headers.get("X-Telegram-Bot-Api-Secret-Token");
    if (secret !== null) {
      if (!TOKEN || secret !== await hookSecret()) return new Response("forbidden", { status: 403 });
      try { await onUpdate(await req.json()); } catch (e) { console.error(e); }
      return new Response("ok"); // Telegram завжди відповідаємо «ok», щоб не повторював
    }
    const b = await req.json().catch(() => ({}));
    if (b.action === "setup") return await setup(req, b);
    if (b.action === "remind") return await onRemind(req, b);
    return json({ error: "unknown" }, 400);
  } catch (e) {
    return json({ error: String(e) }, 500);
  }
});

      if (p.length >= 2) return { n: 2, x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2, d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) };

      y0 = e.touches[0].clientY; dy = 0;

          return `<option value="${esc(val)}" ${String(v ?? '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`;
        }).join('')}</select></label>`;
      }
      if (f.type === 'textarea') return `<label>${f.label}<textarea name="${f.name}" rows="${f.rows || 3}" ${req} ${f.attrs || ''}>${esc(v)}</textarea></label>`;
      if (f.type === 'checkbox') return `<label class="check"><input type="checkbox" name="${f.name}" ${v !== false ? 'checked' : ''}>${f.label}</label>`;
      return `<label>${f.label}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.attrs || ''}></label>`;
    };

    dlg.innerHTML = `<form>
        <h3>${esc(title)}</h3>
        ${top}
        ${fields.map(field).join('')}
        ${extra ? `<div class="dlg-extra">${extra}</div>` : ''}
        <div class="dlg-actions">
          ${onDelete ? '<button type="button" class="btn danger" data-act="delete">Видалити</button>' : ''}
          <span class="spacer"></span>
          <button type="button" class="btn light" data-act="cancel">Скасувати</button>
          <button type="submit" class="btn">Зберегти</button>
        </div>
      </form>`;

    const form = dlg.querySelector('form');
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const obj = {};
      for (const f of fields) {
        let v;
        if (f.type === 'checkbox') v = fd.has(f.name);
        else {
          v = String(fd.get(f.name) ?? '').trim();
          if (v === '') v = null;
          else if (f.type === 'number' || f.cast === 'number') v = Number(v);
        }
        obj[f.name] = v;
      }
      const btn = form.querySelector('[type=submit]');
      btn.disabled = true;
      state.queued = false;
      try {
        await onSave(obj); dlg.close();
        toast(state.queued ? '⏳ Збережено на телефоні — відправлю, коли буде інтернет' : 'Збережено');
        render();
      }
      catch (err) { /* помилку вже показано */ }
      finally { btn.disabled = false; }
    };
    form.querySelector('[data-act=cancel]').onclick = () => dlg.close();
    const del = form.querySelector('[data-act=delete]');
    if (del) del.onclick = async () => {
      // Якщо видалення можна відмінити — видаляємо одразу з кнопкою «Скасувати», інакше питаємо
      if (!onUndo && !(await confirmSheet({ title: 'Видалити?', text: deleteText || 'Цю дію не можна буде скасувати.' }))) return;
      state.queued = false;
      try {
        await onDelete(); dlg.close();
        const msg = state.queued ? '⏳ Видалено на телефоні — відправлю, коли буде інтернет' : 'Видалено';
        toast(msg, false, onUndo ? { label: 'Скасувати', fn: async () => { try { await onUndo(); toast('Повернуто'); render(); } catch (e) {} } } : null);
        render();
      } catch (err) {}
    };
    dlg.showModal();
  }
