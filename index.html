        onDelete: p ? () => write('payments', 'delete', { athlete_id: a.id, month: monthStart }) : null,
        onUndo: p ? () => write('payments', 'upsert', [{ athlete_id: a.id, month: monthStart, amount: p.amount, paid_at: p.paid_at, note: p.note ?? null }]) : null,
        deleteText: 'Скасувати цю оплату?',
      });

    if (copyBtn) copyBtn.onclick = async () => {
      const text = `${secTitle}Не оплачено за ${fmtMonth(state.month).toLowerCase()}:\n` +
        debtors.map(a => `• ${a.full_name}${a.phone ? ' — ' + a.phone : ''}`).join('\n');
      copyText(text, 'Список скопійовано');
    };
    document.querySelectorAll('[data-mshift]').forEach(b =>
      b.onclick = () => { state.month = shiftMonth(state.month, Number(b.dataset.mshift)); render(); });
  }

  // ===== Нагадування батькам про оплату: Viber / Telegram / SMS =====
  const REMIND_TPL = 'Добрий день, {батьки}! Нагадуємо про оплату тренувань з карате за {місяць}: {дитина}. Сума: {сума} грн. Дякуємо! Ferents Team';
  function normPhone(p) {
    let d = String(p || '').replace(/[^\d+]/g, '');
    if (/^0\d{9}$/.test(d)) d = '+38' + d;
    else if (/^380\d{9}$/.test(d)) d = '+' + d;
    return d;
  }
  function remindedKey(ym) { return 'ft_reminded_' + ym; }
  function remindSheet(debtors, ym) {
    const dlg = $('#dlg');
    let tpl = REMIND_TPL, amount = '', marks = {};
    try {
      tpl = (localStorage.getItem('ft_remind_tpl') || REMIND_TPL).replace('{, батьки}', ', {батьки}');
      amount = localStorage.getItem('ft_last_amount') || '';
      marks = JSON.parse(localStorage.getItem(remindedKey(ym)) || '{}');
    } catch (e) {}
    const monthWord = fmtMonth(ym).split(' ')[0].toLowerCase();
    const textFor = a => tpl
      .replace(/,\s*\{батьки\}/g, a.parent_name ? ', ' + a.parent_name : '')
      .replace(/\{батьки\}/g, a.parent_name || '')
      .replace(/\{дитина\}/g, a.full_name)
      .replace(/\{місяць\}/g, monthWord)
      .replace(/\{секція\}/g, a.section || '')
      .replace(/\{сума\}/g, amount || '…');
    const rowHtml = a => {
      const ph = normPhone(a.phone), done = marks[a.id];
      return `<div class="rem-row" data-rid="${esc(a.id)}">
        <div class="rem-who"><b>${esc(a.full_name)}</b>
          <span>${esc([a.parent_name, a.phone].filter(Boolean).join(' · ') || 'телефон не вказано')}${done ? ` · <i class="rem-done">✓ нагадано ${esc(done)}</i>` : ''}</span></div>
        <div class="rem-btns">
          <button type="button" class="rbtn viber" data-via="viber">Viber</button>
          <button type="button" class="rbtn tg" data-via="tg">Telegram</button>
          ${ph ? '<button type="button" class="rbtn sms" data-via="sms">SMS</button>' : ''}
          <button type="button" class="rbtn" data-via="copy" aria-label="Скопіювати">📋</button>
        </div></div>`;
    };
    dlg.innerHTML = `<form><h3>📨 Нагадати про оплату</h3>
      <p class="muted small" style="margin:4px 0 0">${esc(fmtMonth(ym))} · не оплатили ${debtors.length}</p>
      <label>Текст повідомлення<textarea id="remTpl" rows="4">${esc(tpl)}</textarea></label>
      <p class="muted small" style="margin:6px 0 0">Підставляється автоматично: {батьки} {дитина} {місяць} {сума} {секція}</p>
      <label>Сума, грн<input id="remAmount" type="number" inputmode="numeric" min="0" value="${esc(amount)}"></label>
      <div class="rem-list">${debtors.map(rowHtml).join('')}</div>
      <p class="muted small" style="margin:10px 0 0">Текст копіюється автоматично. Якщо месенджер не вставив його сам — утримуйте поле вводу і натисніть «Вставити».</p>
      <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn" data-act="cancel">Готово</button></div></form>`;
    const form = dlg.querySelector('form');
    $('#remTpl').oninput = e => { tpl = e.target.value; try { localStorage.setItem('ft_remind_tpl', tpl); } catch (err) {} };
    $('#remAmount').oninput = e => { amount = e.target.value; try { localStorage.setItem('ft_last_amount', amount); } catch (err) {} };
    form.onsubmit = e => e.preventDefault();
    form.onclick = async e => {
      if (e.target.closest('[data-act=cancel]')) { dlg.close(); return; }
      const b = e.target.closest('[data-via]');
      if (!b) return;
      const row = b.closest('[data-rid]');
      const a = debtors.find(x => String(x.id) === row.dataset.rid);
      const text = textFor(a), ph = normPhone(a.phone), enc = encodeURIComponent(text);
      try { await navigator.clipboard.writeText(text); } catch (err) {}
      if (b.dataset.via === 'copy') { copyText(text, 'Текст скопійовано'); }
      else if (b.dataset.via === 'viber') {
        location.href = ph ? `viber://chat?number=${encodeURIComponent(ph)}&draft=${enc}` : `viber://forward?text=${enc}`;
      } else if (b.dataset.via === 'tg') {

  // ===== Сповіщення на телефон (Web Push) =====
  const VAPID_PUBLIC = 'BERN8stgfObnsznUvmKnUGBcv681B1MClj1y_GNh-kCM0Nzk3su7xEKIjciEqD8UODnj-5Ys_Mx_I4dcmV-ojBU';
  const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  function b64uToBytes(s) {
    const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(b, c => c.charCodeAt(0));
  }
  async function pushStatus() {
    if (!pushSupported()) return isIOS && !isInstalled() ? 'ios-install' : 'unsupported';
    if (Notification.permission === 'denied') return 'denied';
    const reg = await navigator.serviceWorker.ready;
    return (await reg.pushManager.getSubscription()) ? 'on' : 'off';
  }
  async function enablePush() {
    if (!pushSupported()) {
      toast(isIOS ? 'На iPhone спершу додайте застосунок на головний екран (Поділитися → На екран Додому) і відкрийте його звідти' : 'Цей браузер не підтримує сповіщення', true);
      return false;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Сповіщення заборонені — їх можна дозволити в налаштуваннях браузера', true); return false; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription() ||
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC) });
      const j = sub.toJSON();
      const { error } = await db.from('push_subscriptions').upsert({ endpoint: j.endpoint, email: state.email, sub: j });
      if (error) { await sub.unsubscribe().catch(() => {}); throw error; }
      toast('🔔 Сповіщення увімкнено');
      return true;
    } catch (e) {
      const m = String(e.message || e);
      toast(/push_subscriptions|does not exist|schema cache/i.test(m)
        ? 'Не вдалося: у базі ще немає таблиці для сповіщень — тренеру треба запустити SQL з розділу «Оголошення»'
        : 'Не вдалося увімкнути: ' + m, true);
      return false;
    }
  }
  async function disablePush() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await db.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
      toast('Сповіщення вимкнено');
    } catch (e) {}

  // Вибір учасників події: пошук, секція, група, «всіх у списку»
  function pickParticipants(ev, ath, current) {
    const dlg = $('#dlg');
    const chosen = new Set(current);
    const f = { section: state.section, group: 'Усі', search: '' };
    const list = ath.filter(a => isActive(a) || chosen.has(String(a.id)));
    const shown = () => list.filter(a =>
      (f.group === 'Усі' || a.group_name === f.group) &&
      (!state.hasSection || f.section === 'Усі' || a.section === f.section) &&
      (!f.search || a.full_name.toLowerCase().includes(f.search.toLowerCase())));
    const chip = (key, val, label) => `<button type="button" class="chip ${f[key] === val ? 'on' : ''}" data-f="${key}" data-v="${val}">${label}</button>`;

    dlg.innerHTML = `<form><h3>Учасники: ${esc(ev.title)}</h3>
      <input type="search" id="pSearch" placeholder="Пошук за імʼям" style="margin-top:10px">
      <div id="pFilters" style="margin-top:8px"></div>
      <div class="pick-tools"><button type="button" class="linkbtn" id="pAll">Вибрати всіх у списку</button>
        <button type="button" class="linkbtn" id="pNone">Зняти</button><span class="muted small" id="pCount"></span></div>
      <div class="list pick-list" id="pList"></div>
      <div class="dlg-actions"><span class="spacer"></span>
        <button type="button" class="btn light" data-act="cancel">Скасувати</button>
        <button type="submit" class="btn">Зберегти</button></div></form>`;
    const draw = () => {
      $('#pFilters').innerHTML =
        (state.hasSection ? `<div class="chips seg">${chip('section', 'Усі', 'Обидві секції')}${SECTIONS.map(x => chip('section', x, x)).join('')}</div>` : '') +
        `<div class="chips">${chip('group', 'Усі', 'Усі')}${GROUPS.map(g => chip('group', g, g)).join('')}</div>`;
      $('#pList').innerHTML = shown().map(a => `<label class="row tick">
          <span><strong>${beltTag(a.belt)}${esc(a.full_name)}</strong><span>${esc([a.section, a.group_name, beltShort(a.belt)].filter(Boolean).join(' · '))}</span></span>
          <input type="checkbox" data-pid="${esc(a.id)}" ${chosen.has(String(a.id)) ? 'checked' : ''}></label>`).join('')
        || '<div class="empty">Нікого не знайдено</div>';
      $('#pCount').textContent = `Вибрано: ${chosen.size}`;
    };
    const form = dlg.querySelector('form');
    form.onclick = e => {
      const c = e.target.closest('[data-f]');
      if (c) { f[c.dataset.f] = c.dataset.v; draw(); }
      if (e.target.closest('#pAll')) { shown().forEach(a => chosen.add(String(a.id))); draw(); }
      if (e.target.closest('#pNone')) { shown().forEach(a => chosen.delete(String(a.id))); draw(); }
      if (e.target.closest('[data-act=cancel]')) dlg.close();
    };
    form.onchange = e => {
      const b = e.target.closest('[data-pid]');
      if (!b) return;
      if (b.checked) chosen.add(b.dataset.pid); else chosen.delete(b.dataset.pid);
      $('#pCount').textContent = `Вибрано: ${chosen.size}`;
    };
    $('#pSearch').oninput = e => { f.search = e.target.value; draw(); };
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector('[type=submit]');
      btn.disabled = true;
      const ids = ath.filter(a => chosen.has(String(a.id))).map(a => a.id);
      try { await q(db.from('events').update({ participants: ids }).eq('id', ev.id)); dlg.close(); toast(`Учасників: ${ids.length}`); render(); }
      catch (err) { btn.disabled = false; }
    };
    draw();
    dlg.showModal();
  }

  // ----- Чат команди -----
  let chatChannel = null;
  async function chatView() {
    setActions('');
    const msgs = (await q(db.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(200))).reverse();
    $('#view').innerHTML = `
      <div class="chat" id="chatBox"></div>
      <form class="chat-input" id="chatForm">
        <textarea id="chatText" rows="1" maxlength="2000" placeholder="Повідомлення…"></textarea>
        <button class="btn" type="submit" aria-label="Надіслати">➤</button>
      </form>`;
    const box = $('#chatBox');
    let lastDay = '';
    const atBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const add = m => {
      if (box.querySelector(`[data-id="${m.id}"]`)) return;
      const d = new Date(m.created_at);
      const day = d.toLocaleDateString('sv-SE');
      if (day !== lastDay) {
        lastDay = day;
        box.insertAdjacentHTML('beforeend', `<div class="msg-day">${day === today() ? 'Сьогодні' : fmtDate(day, { day: 'numeric', month: 'long', year: 'numeric' })}</div>`);
      }
      const mine = m.author_email === state.email;
      const time = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      box.insertAdjacentHTML('beforeend', `
        <div class="msg ${mine ? 'mine' : ''} ${mine || isCoach() ? 'can-del' : ''}" data-id="${m.id}">
          <div class="msg-head">${mine ? 'Ви' : `<b>${esc(m.author_name || m.author_email)}</b>`} · ${time}</div>
          <div class="msg-body">${esc(m.body)}</div>
        </div>`);
    };
    msgs.forEach(add);
    if (!msgs.length) box.innerHTML = '<p class="muted small" id="chatEmpty" style="text-align:center;margin:auto">Повідомлень ще немає. Напишіть першим 👋</p>';
    box.scrollTop = box.scrollHeight;

    // Нові повідомлення в реальному часі
    chatChannel = db.channel('team-chat')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, p => {
        const stick = atBottom();
        const empty = $('#chatEmpty'); if (empty) empty.remove();
        add(p.new);
        if (stick) box.scrollTop = box.scrollHeight;
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat_messages' }, p => {
        const el = box.querySelector(`[data-id="${p.old.id}"]`); if (el) el.remove();
      })
      .subscribe();

    const text = $('#chatText');
    text.oninput = () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 120) + 'px'; };
    text.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('#chatForm').requestSubmit(); }
    };
    $('#chatForm').onsubmit = async e => {
      e.preventDefault();
      const body = text.value.trim();
      if (!body) return;
      text.value = ''; text.oninput();
      const { data, error } = await db.from('chat_messages').insert({ body }).select().single();
      if (error) { toast('Не надіслано: ' + error.message, true); text.value = body; return; }
      const empty = $('#chatEmpty'); if (empty) empty.remove();
      add(data);
      box.scrollTop = box.scrollHeight;
      notify('chat', { title: '💬 ' + (data.author_name || 'Чат команди'), body: body.slice(0, 200), url: './#chat' });
    };
    box.onclick = async e => {
      const el = e.target.closest('.msg.can-del');
      if (!el || !(await confirmSheet({ title: 'Видалити повідомлення?', text: 'Його не побачить ніхто з команди.' }))) return;
      const { error } = await db.from('chat_messages').delete().eq('id', el.dataset.id);
      if (error) toast('Помилка: ' + error.message, true); else el.remove();
    };
  }

  async function handleRequest(btn, reqs, ath) {
    const box = btn.closest('[data-req]');
    const r = reqs.find(x => String(x.id) === box.dataset.req);
    if (!r) return;
    if (btn.matches('[data-req-no]')) {
      if (!(await confirmSheet({ title: 'Відхилити запит?', text: `${r.full_name} — ${r.child_name}` }))) return;
      await q(db.from('join_requests').delete().eq('id', r.id));
      toast('Запит відхилено'); render(); return;
    }
    const id = box.querySelector('[data-req-ath]').value;
    if (!id) { toast('Виберіть спортсмена зі списку', true); return; }
    btn.disabled = true;
    try {
      const numeric = ath.length && typeof ath[0].id === 'number';
      await q(db.from('members').upsert({ email: r.email, full_name: r.full_name, role: r.role }, { onConflict: 'email', ignoreDuplicates: true }));
      await q(db.from('member_athletes').upsert({ email: r.email, athlete_id: numeric ? Number(id) : id }, { onConflict: 'email,athlete_id', ignoreDuplicates: true }));
      await q(db.from('join_requests').delete().eq('id', r.id));
      const a = ath.find(x => String(x.id) === id);
      toast(`Готово: ${r.full_name} → ${a ? a.full_name : ''}`);
      render();
    } catch (e) { btn.disabled = false; }
  }

  function memberForm(m, ath = [], kids = [], linksOk = false) {
    const chosen = new Set(kids.map(String));
    const people = ath.filter(a => a.active !== false || chosen.has(String(a.id)));
    const picker = linksOk ? `<div style="margin-top:4px"><b>Чия дитина / хто це</b>
        <p class="muted small" style="margin:2px 0 6px">Батьки й спортсмен бачитимуть лише вибраних. Можна кількох (брати, сестри).</p>

        <div class="list pick-list" id="kList" style="max-height:260px;overflow:auto"></div></div>` : '';
    openForm({
      title: m ? m.full_name : 'Новий учасник',
      values: m || { role: 'parent' },
      fields: [
        { name: 'full_name', label: 'Імʼя (так буде видно в чаті)', required: true, attrs: 'placeholder="напр. Олена (мама Івана)"' },
        { name: 'email', label: 'Email', type: 'email', required: true },
        { name: 'role', label: 'Роль', type: 'select', required: true, options: Object.entries(ROLES) },
      ],
      extra: picker,
      onSave: async obj => {
        obj.email = obj.email.toLowerCase();
        if (m) await q(db.from('members').update(obj).eq('email', m.email));
        else await q(db.from('members').insert(obj));
        if (linksOk) {
          await q(db.from('member_athletes').delete().eq('email', obj.email));
          const ids = [...chosen];
          if (ids.length && obj.role !== 'coach') {
            const numeric = ath.length && typeof ath[0].id === 'number';
            await q(db.from('member_athletes').insert(ids.map(id => ({ email: obj.email, athlete_id: numeric ? Number(id) : id }))));
          }
        }
      },
      onDelete: m ? () => q(db.from('members').delete().eq('email', m.email)) : null,
      deleteText: 'Забрати доступ у цієї людини?',
    });
    if (!linksOk) return;
    let search = '';
    const draw = () => {
      const s = search.toLowerCase();
      const rows = people.filter(a => chosen.has(String(a.id)) || !s || a.full_name.toLowerCase().includes(s))
        .sort((x, y) => (chosen.has(String(y.id)) - chosen.has(String(x.id))) || x.full_name.localeCompare(y.full_name));
      $('#kList').innerHTML = rows.map(a => `<label class="row tick">
          <span><strong>${esc(a.full_name)}</strong><span>${esc([a.section, a.group_name].filter(Boolean).join(' · '))}</span></span>
          <input type="checkbox" data-kid="${esc(a.id)}" ${chosen.has(String(a.id)) ? 'checked' : ''}></label>`).join('') || '<div class="empty">Нікого не знайдено</div>';
    };
    $('#kSearch').oninput = e => { search = e.target.value; draw(); };
    $('#kSearch').onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
    $('#kList').onchange = e => {
      const b = e.target.closest('[data-kid]'); if (!b) return;
      if (b.checked) chosen.add(b.dataset.kid); else chosen.delete(b.dataset.kid);
    };
    draw();
  }

  // ===== Резервна копія в Excel (.xlsx без сторонніх бібліотек) =====
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  // ZIP без стиснення (метод «store») — xlsx саме так і пакується
  function zipStore(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    let off = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
        .forEach(([o, v, s]) => s === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2],
       [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
        .forEach(([o, v, s]) => s === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, x) => s + x.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, off, 4], [20, 0, 2]]
      .forEach(([o, v, s]) => s === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  // sheets: [{ name, rows: [[заголовки], [значення…], …] }] → Blob .xlsx
  function makeXlsx(sheets) {
    const x = v => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
    const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const sheetXml = rows => {
      const widths = [];
      rows.forEach(r => r.forEach((v, i) => { widths[i] = Math.min(50, Math.max(widths[i] || 6, String(v ?? '').split('\n')[0].length + 2)); }));
      const data = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
        const ref = col(ci) + (ri + 1);
        if (v === null || v === undefined || v === '') return '';
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${ri ? '' : ' s="1"'}><v>${v}</v></c>`;
        return `<c r="${ref}" t="inlineStr"${ri ? '' : ' s="1"'}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
      }).join('')}</row>`).join('');
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
        `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${data}</sheetData></worksheet>`;
    };
    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${R}"><sheets>${sheets.map((s, i) => `<sheet name="${x(s.name.replace(/[\[\]:*?\/\\]/g, '').slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${R}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${R}/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s.rows) })),
    ];
    return zipStore(files);
  }
  // Усі рядки таблиці (Supabase віддає максимум 1000 за раз)
  async function fetchAll(table, select, order) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      let req = db.from(table).select(select).range(from, from + 999);
      if (order) req = req.order(order);
      const { data, error } = await req;
      if (error) return out.length ? out : null;
      out.push(...(data || []));
      if (!data || data.length < 1000) return out;
    }
  }
  async function saveFile(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }

    ]);
    if (!ath) throw new Error('не вдалося завантажити спортсменів');
    const byId = new Map(ath.map(a => [String(a.id), a]));
    const nm = id => byId.get(String(id))?.full_name || '(видалений)';
    const sec = id => byId.get(String(id))?.section || '';
    const dmy = d => d ? String(d).slice(0, 10).split('-').reverse().join('.') : '';
    const num = v => v === null || v === undefined || v === '' ? '' : Number(v);
    const sheets = [{ name: 'Спортсмени', rows: [['Прізвище та імʼя', 'Секція', 'Група', 'Дата народження', 'Пояс', 'Батьки', 'Телефон', 'Активний', 'Місце в рейтингу', 'Заслуги', 'Нотатки'],
      ...ath.map(a => [a.full_name, a.section || '', a.group_name || '', a.birth_date ? dmy(a.birth_date) : (a.birth_year || ''), a.belt || '', a.parent_name || '', a.phone || '',

    if (grs) sheets.push({ name: 'Атестації', rows: [['Дата', 'Спортсмен', 'Пояс', 'Результат', 'Примітка'],
      ...grs.slice().reverse().map(g => [dmy(g.date), nm(g.athlete_id), g.belt, g.passed === false ? 'не здав' : 'здав', g.note || ''])] });
    if (mem) sheets.push({ name: 'Доступ', rows: [['Імʼя', 'Email', 'Роль', 'Спортсмени'],

    await saveFile(makeXlsx(sheets), `Ferents-Team-${today()}.xlsx`);
    try { localStorage.setItem('ft_last_export', today()); } catch (e) {}

  // ----- Додаток на телефоні: встановлення, робота без інтернету -----
  let installEvent = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function isInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }
  function canInstall() { return !isInstalled() && (installEvent || isIOS || /android/i.test(navigator.userAgent)); }
  function installCard() {
    let hidden = false;
    try { hidden = localStorage.getItem('ft_install_hide') === '1'; } catch (e) {}
    if (hidden || !canInstall()) return '';
    return `<div class="install" id="installCard">
      <img src="icons/karate-192.png" alt="">
      <div><b>Додаток на телефон</b>Іконка на екрані, на весь екран</div>

  document.addEventListener('click', e => {
    if (e.target.closest('#installBtn')) installApp();
    if (e.target.closest('#installHide')) {
      try { localStorage.setItem('ft_install_hide', '1'); } catch (err) {}
      const c = $('#installCard'); if (c) c.remove();
    }
  });
  async function installApp() {
    if (installEvent) {
      installEvent.prompt();
      const { outcome } = await installEvent.userChoice;
      installEvent = null;
      if (outcome === 'accepted') { const c = $('#installCard'); if (c) c.remove(); }
      return;
    }
    const share = '<svg class="ios-share ic-svg" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
    const steps = isIOS
      ? [`Відкрийте сайт у <b>Safari</b> (у Chrome на iPhone теж є кнопка «Поділитися»)`,
         `Натисніть «Поділитися» ${share} внизу або вгорі екрана`,
         `Прокрутіть і виберіть <b>«На екран Додому»</b>`, `Натисніть <b>«Додати»</b> — на екрані з'явиться іконка FT`]
      : [`Відкрийте сайт у <b>Chrome</b>`, `Натисніть <b>⋮</b> у правому верхньому куті`,
         `Виберіть <b>«Встановити додаток»</b> або <b>«Додати на головний екран»</b>`, `Підтвердьте — на екрані з'явиться іконка FT`];
    const dlg = $('#dlg');
    dlg.innerHTML = `<form method="dialog"><h3>📲 Встановити додаток</h3>
      <p class="muted small" style="margin:4px 0 0">${isIOS ? 'iPhone / iPad' : 'Android'}</p>
      <ol class="steps">${steps.map(x => `<li><span>${x}</span></li>`).join('')}</ol>
      <div class="dlg-actions"><span class="spacer"></span><button class="btn">Зрозуміло</button></div></form>`;
    dlg.showModal();
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installEvent = e;
    if ((location.hash.slice(1) || 'home') === 'home' && !$('#installCard') && signedIn) render();
  });
  window.addEventListener('appinstalled', () => { installEvent = null; const c = $('#installCard'); if (c) c.remove(); toast('Додаток встановлено'); });

  // Смужка зверху з'являється лише тоді, коли є зміни, що чекають відправки
  function updateOnline() {
    const bar = $('#offline'), n = loadQueue().length;
    bar.className = 'offline sync';
    bar.hidden = !n;
    if (n) bar.textContent = navigator.onLine && flushing ? `⏳ Відправляю зміни: ${n}…` : `⏳ Чекають відправки: ${n}`;
  }
  window.addEventListener('online', () => { updateOnline(); flushQueue().then(() => { if (signedIn) render(); }); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flushQueue(); });
  setInterval(flushQueue, 30000);
  window.addEventListener('offline', updateOnline);
  updateOnline();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  sheetify($('#dlg'));
  sheetify($('#confirm'));

  // Нова версія: перевіряємо при поверненні в додаток (не частіше, ніж раз на 5 хв)
  let lastCheck = 0;
  async function checkUpdate(force = false) {
    if (!navigator.onLine || (!force && Date.now() - lastCheck < 5 * 60e3)) return;
    lastCheck = Date.now();
    try {
      const html = await (await fetch('index.html?check=' + Date.now(), { cache: 'no-store' })).text();
      const m = html.match(/const APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) {
        $('#update b').textContent = m[1];
        $('#update').hidden = false;
      }
    } catch (e) {}
  }
  $('#updateBtn').onclick = async () => {
    $('#updateBtn').disabled = true;
    try { const r = await navigator.serviceWorker?.getRegistration(); if (r) await r.update(); } catch (e) {}
    location.reload();
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setTimeout(() => checkUpdate(true), 8000);
  setInterval(checkUpdate, 30 * 60e3);

  // Потягни сторінку вниз, щоб оновити
  (function pullToRefresh() {
    const ind = $('#ptr');
    let y0 = null, dy = 0;
    const reset = () => { ind.style.transform = ''; ind.style.opacity = ''; ind.classList.remove('ready', 'spin'); };
    addEventListener('touchstart', e => {
      if (window.scrollY > 0 || !signedIn || document.querySelector('dialog[open]') || e.target.closest('.chat, .pick-list, input, textarea')) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    addEventListener('touchmove', e => {
      if (y0 === null) return;
      dy = (e.touches[0].clientY - y0) * 0.5;
      if (dy <= 0) { reset(); return; }
      const d = Math.min(dy, 90);
      ind.style.transform = `translate(-50%, ${d - 44}px) rotate(${d * 4}deg)`;
      ind.style.opacity = Math.min(1, d / 50);
      ind.classList.toggle('ready', dy > 70);
    }, { passive: true });
    addEventListener('touchend', async () => {
      if (y0 === null) return;
      y0 = null;
      if (dy > 70) {
        ind.classList.add('spin');
        ind.style.transform = 'translate(-50%, 20px)';
        try { await flushQueue(); await render(); } catch (e) {}
      }
      reset();
    });
  })();

  // =====================================================================
  //  НАВІГАЦІЯ ТА ВХІД
  // =====================================================================
  const VIEWS = {
    home: homeView, athletes: athletesView, rating: ratingView, athlete: athleteView, event: eventView, attendance: attendanceView, payments: paymentsView,
    training: trainingView, plans: plansView, tests: testsView,
    schedule: scheduleView, events: eventsView, materials: materialsView,
    links: linksView, chat: chatView, members: membersView, settings: settingsView, news: newsView, join: joinView,
  };
  // Що бачать батьки і спортсмени
  const MEMBER_ROUTES = ['home', 'athlete', 'rating', 'events', 'news', 'settings', 'join'];
  const ATHLETE_ROUTES = [...MEMBER_ROUTES, 'chat', 'schedule', 'plans', 'links'];
  const PARENT_ROUTE = { athlete: 'athletes', event: 'events', schedule: 'training', plans: 'training', tests: 'training', materials: 'home' };
  // Нижня панель для тренера: вкладка → які екрани до неї належать
  const TABS = [['home', 'Головна'], ['attendance', 'Відмітки'], ['payments', 'Оплати'], ['athletes', 'Спортсмени'], ['chat', 'Чат']];
  const TAB_OF = { athlete: 'athletes', rating: 'athletes' };
  // Нижня панель для батьків і спортсменів: [посилання, підпис, іконка]
  function memberTabs() {
    const ids = state.kidIds || [];
    const kid = ids.length ? 'athlete/' + encodeURIComponent(ids[0]) : 'home';
    return isAthleteM()
      ? [['home', 'Головна', 'home'], [kid, 'Я', 'kid'], ['plans', 'Завдання', 'plans'], ['chat', 'Чат', 'chat'], ['events', 'Події', 'training']]
      : [['home', 'Головна', 'home'], [kid, ids.length > 1 ? 'Діти' : 'Дитина', 'kid'], ['events', 'Події', 'training'], ['news', 'Оголошення', 'news']];
  }
  const MEMBER_TAB_OF = { rating: 'home', schedule: 'home', links: 'home', join: 'home', settings: 'home' };
  function tabsNow() { return isCoach() ? TABS.map(([r, l]) => [r, l, r]) : state.role === 'member' ? memberTabs() : null; }
  function drawTabbar(route) {
    const bar = $('#tabbar'), tabs = tabsNow(), on = !!tabs;
    bar.hidden = !on;
    document.body.classList.toggle('has-tabs', on);
    if (!on) return;
    const keys = tabs.map(([href]) => href.split('/')[0]);
    const cur = keys.includes(route) ? route : ((isCoach() ? TAB_OF : MEMBER_TAB_OF)[route] || 'home');
    bar.firstElementChild.innerHTML = tabs.map(([href, label, ic], i) => { const on = keys[i] === cur;
      return `<a class="tab ${on ? 'on' : ''}" href="#${href}" data-tab="${keys[i]}" ${on ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></a>`; }).join('');
  }
  function isTabRoute(route) { const t = tabsNow(); return !!t && t.some(([href]) => href.split('/')[0] === route); }
  // Вкладка завжди відкриває «сьогодні» і поточний місяць
  $('#tabbar').addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (!t) return;
    if (t.dataset.tab === 'attendance') state.date = today();
    if (t.dataset.tab === 'payments') state.month = today().slice(0, 7);
    if (location.hash === t.getAttribute('href')) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
  });

  let renderId = 0;
  async function render() {
    const [key, param] = location.hash.slice(1).split('/');
    let route = VIEWS[key] ? key : 'home';
    state.param = param ? decodeURIComponent(param) : null;
    if (!isCoach() && !(isAthleteM() ? ATHLETE_ROUTES : MEMBER_ROUTES).includes(route)) route = 'home';
    if (!state.role && route !== 'settings' && route !== 'join') route = 'home';
    const id = ++renderId;
    if (chatChannel) { db.removeChannel(chatChannel); chatChannel = null; }
    $('#pageTitle').textContent = route === 'rating' && !isCoach() ? 'Рейтинг спортсменів'
      : route === 'athlete' && !isCoach() ? (isAthleteM() ? 'Моя картка' : 'Моя дитина') : TITLES[route];
    document.body.classList.toggle('inner', route !== 'home');
    document.body.dataset.route = route;
    drawTabbar(route);
    const isTab = isCoach() ? (TABS.some(([r]) => r === route) || route === 'rating') : isTabRoute(route);
    $('#backLink').hidden = route === 'home' || isTab;
    const parent = isCoach() ? PARENT_ROUTE[route] : (['athlete', 'rating', 'events', 'news', 'chat', 'schedule', 'plans', 'links', 'join'].includes(route) ? 'home' : null);
    $('#backLink').href = '#' + (parent || 'home');
    $('#view').onclick = null;
    const viewKey = location.hash;
    const fresh = !$('#view').innerHTML.trim() || $('#view').dataset.key !== viewKey;
    if (fresh) { $('#view').classList.remove('enter'); $('#view').innerHTML = skeleton(); }
    $('#view').dataset.route = route;
    $('#view').dataset.key = viewKey;
    try {
      await VIEWS[route]();
    } catch (err) {
      if (id === renderId) $('#view').innerHTML = `<p class="err">Не вдалося завантажити: ${esc(err.message)}</p>`;
    }
    if (fresh && id === renderId) { void $('#view').offsetWidth; $('#view').classList.add('enter'); }
  }

  // Клік по фільтру групи
  document.addEventListener('click', e => {
    const chip = e.target.closest('[data-group]');
    if (chip) { state.group = chip.dataset.group; render(); }
    const sec = e.target.closest('[data-section]');
    if (sec) {
      state.section = sec.dataset.section;
      try { localStorage.setItem('ft_section', state.section); } catch (err) {}
      render();
    }
  });
  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

  // Хто зайшов: тренер, учасник (батьки/спортсмен) чи ще ніхто
  async function detectRole() {
    const { data: coach, error } = await db.rpc('is_coach');
    // Без інтернету беремо роль, збережену минулого разу
    if (error && !navigator.onLine) {
      try { const c = JSON.parse(localStorage.getItem('ft_role') || 'null'); if (c && c.email === state.email) { state.name = c.name; state.memberRole = c.memberRole || 'parent'; return c.role; } } catch (e) {}
    }
    const { data: name } = await db.rpc('my_name');
    state.name = name || '';
    let role = null;
    if (coach) role = 'coach';
    else { const { data: member } = await db.rpc('is_member'); role = member ? 'member' : null; }
    state.memberRole = 'parent';
    if (role === 'member') {
      const [{ data: r }, { data: ks }] = await Promise.all([db.rpc('my_role'), db.from('athletes').select('id, active').order('full_name')]);
      if (r === 'athlete') state.memberRole = 'athlete';
      const act = (ks || []).filter(isActive);
      state.kidIds = (act.length ? act : ks || []).map(x => String(x.id));
    }
    try { localStorage.setItem('ft_role', JSON.stringify({ email: state.email, role, name: state.name, memberRole: state.memberRole })); } catch (e) {}
    return role;
  }

  let signedIn = null;
  async function showApp(session) {
    const on = !!session;
    if (signedIn === on) return;
    signedIn = on;
    $('#loginSection').hidden = on;
    $('#appSection').hidden = !on;
    $('#menuBtn').hidden = !on;
    if (on) {
      state.email = (session.user.email || '').toLowerCase();
      $('#view').innerHTML = skeleton();
      state.role = await detectRole();
      if (pendingJoin() && state.role !== 'coach') await claimJoin();
      render();
      flushQueue();
    } else {
      state.role = null;
      drawTabbar('home');
      document.body.classList.remove('inner');
    }
  }

  // ===== Запрошення за посиланням: …/#join/КОД =====
  function pendingJoin() { try { return localStorage.getItem('ft_join') || ''; } catch (e) { return ''; } }
  function setJoin(code) { try { code ? localStorage.setItem('ft_join', code) : localStorage.removeItem('ft_join'); } catch (e) {} }
  // Спільне посилання для всіх: …/#team — одразу відкриваємо реєстрацію
  let teamLink = false;
  if (location.hash === '#team') { teamLink = true; history.replaceState(null, '', location.pathname); }
  if (location.hash.startsWith('#join/')) {
    setJoin(decodeURIComponent(location.hash.slice(6)).toUpperCase());
    history.replaceState(null, '', location.pathname);
  }
  // Після входу: питаємо імʼя і привʼязуємо акаунт до спортсмена
  function claimJoin() {
    return new Promise(resolve => {
      const dlg = $('#dlg');
      dlg.innerHTML = `<form><h3>Ласкаво просимо в Ferents Team 🥋</h3>
        <p class="muted small" style="margin:4px 0 10px">Вас запросив тренер. Як вас звати?</p>
        <label>Імʼя<input name="name" required maxlength="60" placeholder="напр. Олена, мама Івана" value="${esc(state.name || '')}"></label>
        <p class="err small" id="joinErr"></p>
        <div class="dlg-actions"><span class="spacer"></span>
          <button type="button" class="btn light" data-act="cancel">Пізніше</button>
          <button type="submit" class="btn">Готово</button></div></form>`;
      const form = dlg.querySelector('form');
      const done = () => { dlg.close(); resolve(); };
      form.querySelector('[data-act=cancel]').onclick = done;
      form.onsubmit = async e => {
        e.preventDefault();
        const btn = form.querySelector('[type=submit]'); btn.disabled = true;
        const { data, error } = await db.rpc('claim_invite', { p_code: pendingJoin(), p_name: form.name.value });
        if (error) {
          btn.disabled = false;
          const m = error.message || '';
          $('#joinErr').textContent = /expired/.test(m) ? 'Посилання вже не діє. Попросіть тренера надіслати нове.'
            : /not_found/.test(m) ? 'Посилання неправильне. Попросіть тренера надіслати нове.' : 'Не вдалося: ' + m;
          if (/expired|not_found/.test(m)) setJoin('');
          return;
        }
        setJoin('');
        state.role = await detectRole();
        toast(`Готово! Ваш акаунт привʼязано: ${data || 'спортсмен'}`);
        notify('joined', { title: '👋 Новий учасник', body: `${form.name.value.trim()} → ${data || ''}`, url: './#members' });
        done();
      };
      dlg.showModal();
    });
  }

  // Вхід / реєстрація / відновлення пароля
  let loginMode = 'login';
  let codeType = 'signup'; // для якого листа чекаємо код: реєстрація чи новий пароль
  function setLoginMode(mode) {
    loginMode = mode;
    const t = { login: ['Вхід', 'Увійти', 'Для тренерів, батьків і спортсменів команди.'],
                signup: ['Реєстрація', 'Зареєструватися', 'Використайте email, який ви дали тренеру. Пароль — мінімум 6 символів.'],
                reset: ['Відновлення пароля', 'Надіслати лист', 'Ми надішлемо на пошту посилання для нового пароля.'],
                code: ['Код із пошти', 'Підтвердити', 'Ми надіслали лист із кодом. Введіть код нижче (якщо листа немає — гляньте в «Спам»).'] }[mode];
    $('#loginTitle').textContent = t[0];
    $('#loginBtn').textContent = t[1];
    $('#loginHint').textContent = t[2];
    $('#pwLabel').hidden = mode === 'reset' || mode === 'code';
    $('#loginPassword').required = mode === 'login' || mode === 'signup';
    $('#email2Label').hidden = mode !== 'signup';
    $('#loginEmail2').required = mode === 'signup';
    $('#codeLabel').hidden = mode !== 'code';
    $('#loginCode').required = mode === 'code';
    $('#resendBtn').hidden = mode !== 'code';
    if (mode === 'code') { $('#loginCode').value = ''; setTimeout(() => $('#loginCode').focus(), 50); }
    $('#loginPassword').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    document.querySelectorAll('[data-mode]').forEach(b => { b.hidden = b.dataset.mode === mode || (mode !== 'login' && b.dataset.mode !== 'login'); });
    $('#loginMessage').textContent = '';
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setLoginMode(b.dataset.mode));
  $('#resendBtn').onclick = async () => {
    const email = $('#loginEmail').value.trim().toLowerCase();
    const msg = $('#loginMessage');
    const { error } = codeType === 'signup'
      ? await db.auth.resend({ type: 'signup', email })
      : await db.auth.resetPasswordForEmail(email);
    msg.textContent = error ? 'Помилка: ' + error.message : 'Надіслали новий код на ' + email;
    msg.className = 'small ' + (error ? 'err' : 'msg-ok');
  };

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#loginMessage');
    const say = (text, ok) => {
      if (/rate limit|too many/i.test(text)) text = 'Забагато листів за короткий час. Зачекайте близько години й спробуйте ще раз.';
      msg.textContent = text; msg.className = 'small ' + (ok ? 'msg-ok' : 'err');
    };
    const email = $('#loginEmail').value.trim().toLowerCase();
    const password = $('#loginPassword').value;
    const redirect = location.origin + location.pathname;
    const btn = $('#loginBtn');
    btn.disabled = true;
    try {
      if (loginMode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error && /confirm/i.test(error.message)) {
          // Пошту ще не підтверджено — надсилаємо лист ще раз
          await db.auth.resend({ type: 'signup', email, options: { emailRedirectTo: redirect } });
          say('Пошту ще не підтверджено. Ми надіслали лист на ' + email + ' — відкрийте посилання з нього.', true);
        } else if (error) say('Невірний email або пароль');
      } else if (loginMode === 'signup') {
        if ($('#loginEmail2').value.trim().toLowerCase() !== email) {
          say('Email не збігається. Перевірте адресу — на неї прийде лист, якщо забудете пароль.');
          return;
        }
        const { data, error } = await db.auth.signUp({ email, password, options: { emailRedirectTo: redirect } });
        if (error) say(/registered|exists/i.test(error.message) ? 'Цей email уже зареєстрований — увійдіть' : 'Помилка: ' + error.message);
        else if (!data.session) say(`Готово! Ми надіслали лист на ${email}. Відкрийте посилання з листа, щоб підтвердити пошту.`, true);
      } else if (loginMode === 'reset') {
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: redirect });
        if (error) say('Помилка: ' + error.message);
        else say('Лист надіслано на ' + email + '. Відкрийте посилання з листа на цьому пристрої — і задайте новий пароль.', true);
      } else {
        const token = $('#loginCode').value.replace(/\D/g, '');
        const { error } = await db.auth.verifyOtp({ email, token, type: codeType });
        if (error) say(/expired/i.test(error.message) ? 'Код застарів — натисніть «Надіслати ще раз»' : 'Невірний код. Перевірте й спробуйте ще раз');
        else if (codeType === 'recovery') setTimeout(newPasswordForm, 300);
      }
    } finally { btn.disabled = false; }
  });

  if (pendingJoin()) {
    setLoginMode('signup');
    $('#loginHint').textContent = 'Вас запросив тренер. Введіть свою пошту (двічі, щоб не помилитися) й придумайте пароль (мінімум 6 символів). Якщо акаунт уже є — натисніть «Назад до входу».';
  } else if (teamLink) {
    setLoginMode('signup');
    $('#loginHint').textContent = 'Ласкаво просимо в Ferents Team! Введіть свою пошту (двічі, щоб не помилитися) й придумайте пароль (мінімум 6 символів). Далі вкажете свою дитину — і тренер підтвердить. Якщо акаунт уже є — натисніть «Назад до входу».';
  }
  (async function boot() {
    const { data: { session } } = await db.auth.getSession();
    showApp(session);
    db.auth.onAuthStateChange((event, s) => {
      setTimeout(() => {
        showApp(s);
        if (event === 'PASSWORD_RECOVERY') newPasswordForm();
      }, 0);
    });
  })();
  function newPasswordForm() {
          openForm({
            title: 'Новий пароль',
            fields: [{ name: 'password', label: 'Новий пароль (мінімум 6 символів)', type: 'password', required: true, attrs: 'minlength="6" autocomplete="new-password"' }],
            onSave: async obj => {
              const { error } = await db.auth.updateUser({ password: obj.password });
              if (error) { toast('Помилка: ' + error.message, true); throw error; }
            },
          });
  }
  </script>
</body>
</html>
